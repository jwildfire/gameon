<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameOn Docs</title>
<!--
  Renders the Markdown pages in this folder on GitHub Pages, where .md files are otherwise
  served as plain text. docs/?p=layout.md shows docs/layout.md; no p shows docs/README.md.
  The Markdown files stay the source of truth and read the same on GitHub.
-->
<style>
:root {
  --paper: #fffdf6; --ink: #1d1a14; --muted: #6b6455; --rule: #e6dfcc;
  --pop: #e0533d; --code-bg: #f3eddc; --wall: #ffd23f;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #17150f; --ink: #f2ecdc; --muted: #a79f8c; --rule: #3a352a;
    --pop: #ff8a6e; --code-bg: #26221a; --wall: #ffd23f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #17150f; --ink: #f2ecdc; --muted: #a79f8c; --rule: #3a352a;
  --pop: #ff8a6e; --code-bg: #26221a; --wall: #ffd23f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 17px/1.6 var(--body); }
header { border-bottom: 3px solid var(--ink); background: var(--wall); color: #1d1a14; }
header nav { max-width: 760px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 20px; align-items: baseline; flex-wrap: wrap; }
header a { color: inherit; font-weight: 800; text-decoration: none; }
header a.brand { font-size: 20px; margin-right: auto; }
main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
h1, h2, h3 { line-height: 1.2; text-wrap: balance; }
h1 { font-size: 34px; margin: 8px 0 16px; }
h2 { font-size: 24px; margin: 36px 0 12px; }
h3 { font-size: 19px; margin: 28px 0 8px; }
a { color: inherit; text-decoration-color: var(--pop); text-underline-offset: 3px; }
code { font: 0.86em/1 var(--mono); background: var(--code-bg); padding: 2px 5px; border-radius: 4px; }
pre { padding: 14px 16px; background: var(--code-bg); border-radius: 10px; overflow-x: auto; font: 13px/1.55 var(--mono); }
pre code { background: none; padding: 0; font-size: inherit; }
.table { overflow-x: auto; margin: 16px 0; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--rule); }
th { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
blockquote { margin: 16px 0; padding: 4px 16px; border-left: 4px solid var(--pop); color: var(--muted); }
img { max-width: 100%; }
.note { color: var(--muted); }
footer { max-width: 760px; margin: 0 auto; padding: 0 16px 32px; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <nav>
    <a class="brand" href="./">GameOn docs</a>
    <a href="../">Arcade</a>
    <a href="https://github.com/jwildfire/gameon">GitHub</a>
  </nav>
</header>
<main id="page"><p class="note">Loading…</p></main>
<footer><a id="source" href="https://github.com/jwildfire/gameon/tree/dev/docs">This page on GitHub</a></footer>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
(function () {
  var page = document.getElementById("page");
  var docsDir = new URL("./", location.href.split(/[?#]/)[0]);
  var siteRoot = new URL("../", docsDir);
  var branch = /\/dev\/docs\/$/.test(docsDir.pathname) ? "dev" : "main";

  // Turn a URL inside the site into a path relative to this folder, e.g. "layout.md"
  // or "../AGENTS.md". Returns null for anything outside the site.
  function relPath(u) {
    if (u.origin !== location.origin) return null;
    if (u.pathname.indexOf(docsDir.pathname) === 0) return u.pathname.slice(docsDir.pathname.length);
    if (u.pathname.indexOf(siteRoot.pathname) === 0) return "../" + u.pathname.slice(siteRoot.pathname.length);
    return null;
  }

  var p = new URLSearchParams(location.search).get("p") || "README.md";
  var mdUrl = /^[\w.\/-]+\.md$/.test(p) && p.indexOf("//") < 0 ? new URL(p, docsDir) : null;
  if (!mdUrl || relPath(mdUrl) === null) { page.innerHTML = "<h1>Page not found</h1><p><a href='./'>Back to the docs</a></p>"; return; }

  var fromRoot = mdUrl.pathname.slice(siteRoot.pathname.length);
  document.getElementById("source").href = "https://github.com/jwildfire/gameon/blob/" + branch + "/" + fromRoot;

  fetch(mdUrl).then(function (r) {
    if (!r.ok) throw new Error(r.status);
    return r.text();
  }).then(function (md) {
    if (!window.marked) {
      page.innerHTML = "";
      var pre = document.createElement("pre");
      pre.textContent = md;
      page.appendChild(pre);
      return;
    }
    page.innerHTML = marked.parse(md);
    page.querySelectorAll("a[href]").forEach(function (a) {
      var raw = a.getAttribute("href");
      if (raw.charAt(0) === "#") return;
      var u = new URL(raw, mdUrl);
      var rel = relPath(u);
      if (rel !== null && /\.md$/.test(u.pathname)) a.href = "?p=" + rel + u.hash;
      else a.href = u.href;
    });
    page.querySelectorAll("img[src]").forEach(function (img) {
      img.src = new URL(img.getAttribute("src"), mdUrl).href;
    });
    page.querySelectorAll("table").forEach(function (t) {
      var wrap = document.createElement("div");
      wrap.className = "table";
      t.parentNode.insertBefore(wrap, t);
      wrap.appendChild(t);
    });
    var h1 = page.querySelector("h1");
    if (h1) document.title = h1.textContent === "GameOn docs" ? h1.textContent : h1.textContent + " · GameOn docs";
  }).catch(function () {
    page.innerHTML = "<h1>Page not found</h1><p><a href='./'>Back to the docs</a></p>";
  });
})();
</script>
</body>
</html>
