# Builds one GitHub Pages site from two branches on every push to either:
#   main -> https://jwildfire.github.io/gameon/
#   dev  -> https://jwildfire.github.io/gameon/dev/
name: Deploy site

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/checkout@v4
        with:
          ref: dev
          path: dev
      - name: Assemble site
        run: |
          mkdir -p _site/dev
          rsync -a --exclude='.git' --exclude='.github' --exclude='.claude' main/ _site/
          rsync -a --exclude='.git' --exclude='.github' --exclude='.claude' dev/ _site/dev/
          touch _site/.nojekyll
          echo "main $(git -C main rev-parse --short HEAD), dev $(git -C dev rev-parse --short HEAD)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
