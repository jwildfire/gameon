<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GameOn Arcade</title>
<meta name="description" content="An arcade of party games anyone can make. Dream up a game, an AI builds it, play it with your friends.">
<meta name="theme-color" content="#ffd23f">
<script src="assets/mode.js"></script>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Toy shelf: a sunny wall of chunky, outlined cartridges. One look on purpose, so it
   reads the same in light and dark. */
:root {
  --wall: #ffd23f;
  --ink: #1d1a2f;
  --card: #fffdf6;
  --muted: #5b5670;
  --pop: #ff6b4a;
  --bar: #1d1a2f;
  --bar-fg: #fffdf6;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body: "Nunito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --line: 3px solid var(--ink);
  --lift: 5px 5px 0 var(--ink);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--wall);
  color: var(--ink);
  font: 600 16px/1.45 var(--body);
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--pop); outline-offset: 3px; }

/* ---------- Home ---------- */
.home {
  max-width: 1120px;
  margin: 0 auto;
  padding-block: max(28px, env(safe-area-inset-top, 0px)) max(40px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 28px;
}
.masthead { display: grid; gap: 6px; }
.wordmark {
  margin: 0;
  font: 400 clamp(56px, 12vw, 104px)/0.9 var(--display);
  letter-spacing: 0.01em;
  color: var(--card);
  -webkit-text-stroke: 3px var(--ink);
  paint-order: stroke fill;
  text-shadow: 5px 5px 0 var(--ink);
}
.wordmark span { color: var(--pop); }
.lede { margin: 0; font-size: clamp(17px, 2.4vw, 21px); font-weight: 800; max-width: 34ch; text-wrap: balance; min-height: 2.9em; transition: opacity 350ms ease; }
.lede.fading { opacity: 0; }
@media (prefers-reduced-motion: reduce) { .lede { transition: none; } }

.shelf {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
  gap: 24px;
}
.cart {
  display: grid;
  grid-template-rows: auto 1fr;
  height: 100%;
  background: var(--card);
  border: var(--line);
  border-radius: 18px;
  box-shadow: var(--lift);
  overflow: hidden;
  text-decoration: none;
  transition: transform 120ms ease, box-shadow 120ms ease;
}
.cart:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--ink); }
.cart:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--ink); }
.cover {
  position: relative;
  aspect-ratio: 16 / 9;
  max-width: 100%;
  border-bottom: var(--line);
  background: var(--tint, var(--pop));
}
.cover img { display: block; width: 100%; height: 100%; object-fit: cover; }
.play-badge {
  position: absolute;
  right: 12px;
  bottom: -22px;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: var(--tint, var(--pop));
  border: var(--line);
  display: grid;
  place-items: center;
}
.play-badge svg { width: 20px; height: 20px; margin-left: 3px; fill: var(--card); stroke: var(--ink); stroke-width: 2; }
.cart-body { display: grid; align-content: start; gap: 8px; padding: 16px 18px 18px; }
.cart h2 { margin: 0; padding-right: 56px; font: 400 26px/1.05 var(--display); text-wrap: balance; }
.cart p { margin: 0; color: var(--muted); font-size: 15px; }
.credit { font-size: 13px; font-weight: 800; color: var(--ink); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.tag {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 3px 9px;
  border: 2px solid var(--ink);
  border-radius: 999px;
  background: var(--card);
}
.tag.new { background: var(--ink); color: var(--wall); }

.make {
  justify-self: start;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
  padding: 14px 22px;
  background: var(--pop);
  color: var(--card);
  border: var(--line);
  border-radius: 18px;
  box-shadow: var(--lift);
  font: 400 clamp(22px, 3.4vw, 28px)/1 var(--display);
  text-decoration: none;
  -webkit-text-stroke: 1px var(--ink);
  paint-order: stroke fill;
  transition: transform 120ms ease, box-shadow 120ms ease;
}
.make:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--ink); }
.make:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--ink); }
.make svg { width: 26px; height: 26px; fill: var(--card); stroke: var(--ink); stroke-width: 1.5; }
@media (prefers-reduced-motion: reduce) { .make, .make:hover, .make:active { transition: none; transform: none; } }
.foot { margin: 0; font-size: 14px; color: var(--ink); }
.foot a { font-weight: 800; }

/* ---------- Player ---------- */
.player { position: fixed; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; background: var(--ink); }
.bar {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 44px;
  padding-top: env(safe-area-inset-top, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
  background: var(--bar);
  color: var(--bar-fg);
  border-bottom: 3px solid var(--wall);
}
.bar-title { flex: 1; min-width: 0; font: 400 19px/1 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 34px;
  padding: 0 12px;
  border: 2px solid var(--wall);
  border-radius: 999px;
  background: transparent;
  color: var(--bar-fg);
  font: 800 14px/1 var(--body);
  text-decoration: none;
  cursor: pointer;
  white-space: nowrap;
}
.btn.primary { background: var(--wall); color: var(--ink); }
.btn svg.gh, .gh-home svg.gh { fill: currentColor; stroke: none; }
.masthead { position: relative; }
.gh-home {
  position: absolute; top: 4px; right: 0;
  display: inline-flex; align-items: center; gap: 6px;
  height: 36px; padding: 0 12px;
  border: 2.5px solid var(--ink); border-radius: 999px;
  background: var(--card); color: var(--ink);
  font: 800 14px/1 var(--body); text-decoration: none;
}
.gh-home svg { width: 18px; height: 18px; }
/* Wide screens: one row (logo, tagline, button, then GitHub at the far right) instead of a tall stack. */
@media (min-width: 760px) {
  .masthead { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 28px; }
  .wordmark { order: 1; flex: none; font-size: clamp(56px, 6.5vw, 84px); }
  .lede { order: 2; flex: 1 1 220px; max-width: 30ch; }
  .make { order: 3; flex: none; margin-top: 0; }
  .gh-home { order: 4; position: static; margin-left: auto; }
}
.btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.frame { width: 100%; height: 100%; border: 0; display: block; background: #000; }

/* Game switcher */
.switcher {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: grid;
  align-content: start;
  justify-items: center;
  background: rgba(29, 26, 47, 0.72);
  padding-block: calc(56px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-y: auto;
}
.switch-panel {
  width: min(100%, 760px);
  background: var(--wall);
  border: var(--line);
  border-radius: 18px;
  box-shadow: var(--lift);
  padding: 16px;
  display: grid;
  gap: 12px;
}
.switch-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.switch-head h2 { margin: 0; font: 400 26px/1 var(--display); }
.switch-head .btn { color: var(--ink); border-color: var(--ink); }
.ver {
  height: 34px; max-width: 130px; padding: 0 8px;
  border: 2px solid var(--wall); border-radius: 999px;
  background: var(--bar); color: var(--bar-fg);
  font: 800 13px/1 var(--body); cursor: pointer;
}
.ver-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.ver-item {
  width: 100%; display: grid; gap: 4px; text-align: left; cursor: pointer;
  padding: 12px 14px; border: var(--line); border-radius: 14px; background: var(--card); color: var(--ink);
}
.ver-item[aria-current="true"] { box-shadow: 4px 4px 0 var(--ink); }
.ver-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font: 400 20px/1.1 var(--display); }
.ver-chip { font: 800 11px/1 var(--body); letter-spacing: 0.04em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px; border: 2px solid var(--ink); }
.ver-chip.latest { background: var(--ink); color: var(--wall); }
.ver-note { font: 600 14px/1.35 var(--body); color: var(--muted); }
.switch-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 12px; }
.mini {
  display: grid;
  gap: 6px;
  padding: 6px 6px 10px;
  background: var(--card);
  border: var(--line);
  border-radius: 12px;
  text-decoration: none;
  font: 400 16px/1.1 var(--display);
  text-align: center;
}
.mini img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 7px; border: 2px solid var(--ink); }
.mini[aria-current="true"] { background: var(--ink); color: var(--wall); }

@media (max-width: 520px) {
  .wide-only { display: none !important; }
  .bar { gap: 6px; }
  .bar.has-versions .bar-title { display: none; }
  .ver { flex: 1; min-width: 0; max-width: 120px; font-size: 12px; }
  .btn .label { display: none; }
  .btn { padding: 0 10px; }
}
@media (prefers-reduced-motion: reduce) {
  .cart, .cart:hover, .cart:active { transition: none; transform: none; }
}
/* Normal | Weird (assets/mode.js, #134). The switch sits with GitHub: stacked under it on
   wide screens, beside the Make button on phones. */
.corner { display: contents; }
.mode-switch { grid-row: 3; grid-column: 2; align-self: center; margin-top: 10px; }
@media (max-width: 759px) {
  .masthead { grid-template-columns: minmax(0, 1fr) auto; column-gap: 8px; }
  .wordmark, .lede { grid-column: 1 / -1; }
  .wordmark { grid-row: 1; }
  .lede { grid-row: 2; }
  .make { grid-row: 3; grid-column: 1; white-space: nowrap; }
}
@media (max-width: 374px) { .mode-switch { grid-row: 4; grid-column: 1; justify-self: start; margin-top: 0; } }
@media (min-width: 760px) {
  .corner { order: 4; margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .corner .gh-home { margin-left: 0; }
  .mode-switch { margin-top: 0; }
}
/* Weird mode: trippy backgrounds (assets/backgrounds.js) behind the page, so the words that
   sit on the wall get a card, and the page leaves room for the skip button in the corner. */
html[data-mode="weird"] .lede, html[data-mode="weird"] .foot { justify-self: start; background: var(--card); border: var(--line); border-radius: 14px; box-shadow: var(--lift); padding: 8px 14px; }
/* The rotating tagline fades its words, not its card. Two lines, plus the card's padding and border. */
html[data-mode="weird"] .lede { transition: color 350ms ease; min-height: calc(2.9em + 22px); }
html[data-mode="weird"] .lede.fading { opacity: 1; color: transparent; }
/* In the wide header row the card leaves less room for words, so it holds three lines, centred. */
@media (min-width: 760px) { html[data-mode="weird"] .lede { display: flex; align-items: center; min-height: calc(4.35em + 18px); padding: 6px 12px; } }
@media (prefers-reduced-motion: reduce) { html[data-mode="weird"] .lede { transition: none; } }
.home { padding-bottom: max(88px, env(safe-area-inset-bottom, 0px)); } /* room for the corner control (Shuffle, and Next in Weird) */
</style>
</head>
<body>

<main class="home" id="home">
  <header class="masthead">
    <h1 class="wordmark">Game<span>On</span></h1>
    <div class="corner">
      <a class="gh-home" id="gh-home" href="https://github.com/jwildfire/gameon" target="_blank" rel="noopener"><svg class="gh" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2.2c-3.3.7-4-1.4-4-1.4-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 0-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.2.5-2.3 1.3-3.1-.2-.4-.6-1.6 0-3.2 0 0 1-.3 3.4 1.2a11.5 11.5 0 0 1 6 0C17 4.6 18 5 18 5c.6 1.6.2 2.8.1 3.2.8.8 1.3 1.9 1.3 3.1 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3"/></svg>GitHub</a>
      <div class="mode-switch" role="group" aria-label="Arcade mode"><button type="button" data-mode-set="normal" aria-pressed="true">Normal</button><button type="button" data-mode-set="weird" aria-pressed="false">Weird</button></div>
    </div>
    <p class="lede" id="tagline">Think of a Game? Make it, play it, change it!</p>
    <a class="make" id="make-btn" href="new/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.6 6.3L21 9l-5 4.4L17.5 20 12 16.6 6.5 20 8 13.4 3 9l6.4-.7z"/></svg>Make a game</a>
  </header>
  <ul class="shelf" id="shelf" aria-label="Games"></ul>
  <p class="foot">Every game here started as someone's idea, said out loud and built in an evening. <a href="https://github.com/jwildfire/gameon">How it works</a></p>
</main>

<section class="player" id="player" hidden aria-label="Now playing">
  <div class="bar">
    <a class="btn" href="#" id="home-btn" aria-label="All games">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg><span class="label">Arcade</span>
    </a>
    <div class="bar-title" id="bar-title"></div>
    <button class="btn primary" type="button" id="switch-btn" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg><span class="label">Games</span>
    </button>
    <select class="ver" id="ver-select" aria-label="Version" hidden></select>
    <a class="btn" id="update-btn" aria-label="Ask for a change to this game"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4"/></svg><span class="label">Update</span></a>
    <button class="btn wide-only" type="button" id="fs-btn" aria-label="Full screen" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <a class="btn" id="gh-btn" target="_blank" rel="noopener" aria-label="See this game's code on GitHub"><svg class="gh" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2.2c-3.3.7-4-1.4-4-1.4-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 0-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.2.5-2.3 1.3-3.1-.2-.4-.6-1.6 0-3.2 0 0 1-.3 3.4 1.2a11.5 11.5 0 0 1 6 0C17 4.6 18 5 18 5c.6 1.6.2 2.8.1 3.2.8.8 1.3 1.9 1.3 3.1 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3"/></svg></a>
    <a class="btn" id="own-btn" target="_blank" rel="noopener" aria-label="Open in its own tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
    </a>
  </div>
  <iframe class="frame" id="frame" title="Game" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>
</section>

<div class="switcher" id="switcher" hidden role="dialog" aria-modal="true" aria-labelledby="switch-title">
  <div class="switch-panel">
    <div class="switch-head">
      <h2 id="switch-title">Pick a game</h2>
      <button class="btn" type="button" id="close-switch">Close</button>
    </div>
    <ul class="switch-grid" id="switch-grid"></ul>
  </div>
</div>

<div class="switcher" id="chooser" hidden role="dialog" aria-modal="true" aria-labelledby="choose-title">
  <div class="switch-panel">
    <div class="switch-head">
      <h2 id="choose-title">Which version?</h2>
      <button class="btn" type="button" id="close-choose">Cancel</button>
    </div>
    <ul class="ver-list" id="ver-list"></ul>
  </div>
</div>

<script>
// Taglines: Jeremy's two lines and the Game Night line, then fifty more in the same voice.
// Normal mode shows the first line and holds it. Weird mode (assets/mode.js) shows one at a
// time, starting at random and changing every few seconds; with reduced motion it's one
// random line per visit.
(function () {
  var LINES = ["Think of a Game? Make it, play it, change it!", "Think of a Game? Make it. Then make it better.", "Dream up a game. Play it with your friends tonight.", "Say it out loud. Play it by dinner.", "Your idea. Our robots. Everyone's controller.", "Describe it. Build it. Beat your friends at it.", "Grab a controller. Grab a friend. Grab a weird idea.", "Every game here started as one sentence.", "One idea in. One game out.", "If you can say it, you can play it.", "Thought up by people. Built by robots. Played by everyone.", "Pitch a game. Hit Send. Press Start.", "Make the game you wish existed.", "Couch, snacks, friends, and a game nobody's played yet.", "Today's weird idea is tonight's game night.", "Nachos, jelly, lava, robots. Anything goes.", "Your game, your rules, your high score.", "Change the rules. Then change them again.", "Don't like the ending? Make your own version.", "Built in an hour. Played for weeks.", "Insert idea. Get game.", "Player 1, pitch your game.", "The arcade where the games take requests.", "Some people play games. You make them.", "Two controllers, one couch, endless nonsense.", "What if the floor was lava? Go find out.", "Bring an idea. Leave with a game.", "No coding. Just ideas and a big Send button.", "Remix any game. Make it yours.", "Game night, freshly baked.", "Every version stays. Every idea counts.", "From “what if” to “one more round.”", "Think it. Say it. Splat it.", "It's not cheating if you made the game.", "The best games start with “what if…”", "You bring the chaos. We'll bring the code.", "Make a game in the time it takes to get a pizza.", "Too easy? Make it harder.", "Too hard? Make it easier. It's your game.", "Every game here has a story. Add yours.", "Sauce, shapes, pies and trampolines. So far.", "Fork a game. Put your name on it.", "Imagine it on the couch. Play it on the couch.", "One more game. Then one more after that.", "Make it silly. Make it spicy. Make it yours.", "The arcade is open. The cabinets are yours.", "Ideas welcome. Controllers recommended.", "Someone's idea is about to be your favourite game.", "Got a game stuck in your head? Let it out.", "Make a game with your friends. Then beat them at it.", "Send it to the Matrix. Grab the snacks.", "Weird ideas make the best games.", "Change one rule. See what happens."];
  var el = document.getElementById("tagline");
  var i = 0, timer = 0;
  function weird() { return !!window.gameonMode && window.gameonMode.get() === "weird"; }
  function show(n) { i = (n + LINES.length) % LINES.length; el.textContent = LINES[i]; }
  function next() {
    el.classList.add("fading");
    setTimeout(function () { if (weird()) show(i + 1); el.classList.remove("fading"); }, 360);
  }
  function apply() {
    clearInterval(timer);
    timer = 0;
    el.classList.remove("fading");
    if (!weird()) { show(0); return; }
    show(Math.floor(Math.random() * LINES.length));
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    timer = setInterval(function () { if (!document.hidden) next(); }, 6500);
  }
  window.gameonTaglines = LINES.slice();
  window.gameonNextTagline = function () { show(i + 1); return LINES[i]; };
  document.addEventListener("gameon:mode", apply);
  apply();
})();
</script>
<script>
(function () {
  var games = [];
  var shelf = document.getElementById("shelf");
  var home = document.getElementById("home");
  var player = document.getElementById("player");
  var frame = document.getElementById("frame");
  var barTitle = document.getElementById("bar-title");
  var ownBtn = document.getElementById("own-btn");
  var ghBtn = document.getElementById("gh-btn");
  var fsBtn = document.getElementById("fs-btn");
  var switcher = document.getElementById("switcher");
  var switchGrid = document.getElementById("switch-grid");
  var chooser = document.getElementById("chooser");
  var verList = document.getElementById("ver-list");
  var verSelect = document.getElementById("ver-select");
  var updateBtn = document.getElementById("update-btn");
  var bar = document.querySelector(".bar");
  var current = null, currentVer = null;
  var PICK = "gameon.arcade.version.";

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    for (var k in attrs || {}) {
      if (k === "text") n.textContent = attrs[k];
      else n.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { n.appendChild(c); });
    return n;
  }
  // Versions: see docs/game-versions.md. An entry without versions is one version, {creator}.v1.
  function creatorOf(g) { return g.creator || "jeremy"; }
  function versionsOf(g) {
    return g.versions && g.versions.length ? g.versions : [{ id: creatorOf(g) + ".v1", url: g.url, note: "The first version" }];
  }
  function who(v) { return v.id.split(".v")[0]; }
  function num(v) { return parseInt(v.id.split(".v")[1], 10) || 0; }
  function defaultOf(g) {
    var vs = versionsOf(g);
    if (g["default"] && vs.some(function (v) { return v.id === g["default"]; })) return g["default"];
    var mine = vs.filter(function (v) { return who(v) === creatorOf(g); }).sort(function (a, b) { return num(b) - num(a); });
    return (mine[0] || vs[0]).id;
  }
  // The default first, then the creator's older versions, then forks grouped by who made them.
  function ordered(g) {
    var def = defaultOf(g), c = creatorOf(g);
    return versionsOf(g).slice().sort(function (a, b) {
      if (a.id === def) return -1; if (b.id === def) return 1;
      var ac = who(a) === c, bc = who(b) === c;
      if (ac !== bc) return ac ? -1 : 1;
      if (who(a) !== who(b)) return who(a) < who(b) ? -1 : 1;
      return num(b) - num(a);
    });
  }
  function findVersion(g, id) { return versionsOf(g).filter(function (v) { return v.id === id; })[0]; }
  function lastPick(slug) { try { return localStorage.getItem(PICK + slug); } catch (e) { return null; } }
  function rememberPick(slug, id) { try { localStorage.setItem(PICK + slug, id); } catch (e) {} }
  // Where a version's code lives: the game's own repo, or its folder here.
  function sourceUrl(g, v) {
    if (/^https?:/.test(v.url)) return g.repo;
    return "https://github.com/jwildfire/gameon/tree/main/" + v.url.replace(/\/$/, "");
  }
  function cover(g) { return "assets/covers/" + g.slug + ".jpg"; }

  function renderShelf() {
    games.forEach(function (g) {
      var badge = el("span", { "class": "play-badge", "aria-hidden": "true" });
      badge.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg>';
      var nv = versionsOf(g).length;
      var tags = el("div", { "class": "tags" }, (g.tags || []).concat(nv > 1 ? [nv + " versions"] : []).map(function (t) {
        return el("span", { "class": "tag" + (t === "New" ? " new" : ""), text: t });
      }));
      var body = el("div", { "class": "cart-body" }, [el("h2", { text: g.title }), el("p", { text: g.tagline })]);
      if (g.credit) body.appendChild(el("span", { "class": "credit", text: g.credit }));
      body.appendChild(tags);
      var link = el("a", { "class": "cart", href: "#" + g.slug, style: "--tint:" + g.color }, [
        el("div", { "class": "cover" }, [el("img", { src: cover(g), alt: "", loading: "lazy", width: "800", height: "450" }), badge]),
        body
      ]);
      shelf.appendChild(el("li", {}, [link]));

      var mini = el("a", { "class": "mini", href: "#" + g.slug, "data-slug": g.slug }, [
        el("img", { src: cover(g), alt: "", loading: "lazy" }),
        el("span", { text: g.title })
      ]);
      switchGrid.appendChild(el("li", {}, [mini]));
    });
  }

  function openSwitcher() {
    switchGrid.querySelectorAll(".mini").forEach(function (m) {
      m.setAttribute("aria-current", current && m.dataset.slug === current.slug ? "true" : "false");
    });
    switcher.hidden = false;
    document.getElementById("close-switch").focus();
  }
  function closeSwitcher() {
    switcher.hidden = true;
    if (current) focusGame();
  }
  function focusGame() {
    try { frame.contentWindow.focus(); } catch (e) { frame.focus(); }
  }

  function showChooser(g) {
    var def = defaultOf(g), last = lastPick(g.slug), c = creatorOf(g);
    verList.innerHTML = "";
    ordered(g).forEach(function (v) {
      var top = el("span", { "class": "ver-top" }, [el("span", { text: v.id })]);
      if (v.id === def) top.appendChild(el("span", { "class": "ver-chip latest", text: "Latest" }));
      if (v.id === last) top.appendChild(el("span", { "class": "ver-chip", text: "Last played" }));
      var bits = [];
      if (v.note) bits.push(v.note);
      if (who(v) !== c) bits.push("Made by " + who(v) + (v.from ? ", started from " + v.from : ""));
      var btn = el("button", { "class": "ver-item", type: "button", "data-version": v.id, "aria-current": String(v.id === (last || def)) }, [top]);
      if (bits.length) btn.appendChild(el("span", { "class": "ver-note", text: bits.join(" · ") }));
      btn.addEventListener("click", function () { location.replace("#" + g.slug + "@" + v.id); });
      verList.appendChild(el("li", {}, [btn]));
    });
    document.getElementById("choose-title").textContent = "Which " + g.title + "?";
    chooser.hidden = false;
    var focus = verList.querySelector('[aria-current="true"]') || verList.querySelector("button");
    if (focus) focus.focus();
  }
  function closeChooser() {
    chooser.hidden = true;
    location.replace(current ? "#" + current.slug + "@" + currentVer : "#");
  }

  function route() {
    var parts = decodeURIComponent(location.hash.replace(/^#/, "")).split("@");
    var g = games.filter(function (x) { return x.slug === parts[0]; })[0];
    switcher.hidden = true;
    chooser.hidden = true;
    if (!g) {
      current = null; currentVer = null;
      player.hidden = true;
      home.hidden = false;
      frame.removeAttribute("src");
      document.title = "GameOn Arcade";
      return;
    }
    var vs = versionsOf(g);
    var v = parts[1] ? findVersion(g, parts[1]) : null;
    if (!v) {
      if (vs.length > 1) { showChooser(g); return; }
      v = vs[0];
    }
    if (!current || current.slug !== g.slug || currentVer !== v.id) {
      current = g; currentVer = v.id;
      frame.src = v.url;
      barTitle.textContent = g.title;
      ownBtn.href = v.url;
      ghBtn.href = sourceUrl(g, v);
      updateBtn.href = "new/?game=" + encodeURIComponent(g.slug) + "&version=" + encodeURIComponent(v.id);
      verSelect.innerHTML = "";
      ordered(g).forEach(function (x) {
        var o = el("option", { value: x.id, text: x.id + (x.id === defaultOf(g) ? " (latest)" : "") });
        if (x.id === v.id) o.selected = true;
        verSelect.appendChild(o);
      });
      verSelect.hidden = vs.length < 2;
      bar.classList.toggle("has-versions", vs.length > 1);
      if (vs.length > 1) rememberPick(g.slug, v.id);
      document.title = g.title + " · GameOn";
    }
    home.hidden = true;
    player.hidden = false;
    window.scrollTo(0, 0);
  }

  frame.addEventListener("load", focusGame);
  document.getElementById("switch-btn").addEventListener("click", openSwitcher);
  document.getElementById("close-switch").addEventListener("click", closeSwitcher);
  switcher.addEventListener("click", function (e) { if (e.target === switcher) closeSwitcher(); });
  switchGrid.addEventListener("click", function (e) {
    var a = e.target.closest(".mini");
    if (a && current && a.dataset.slug === current.slug) { e.preventDefault(); closeSwitcher(); }
  });
  document.getElementById("close-choose").addEventListener("click", closeChooser);
  chooser.addEventListener("click", function (e) { if (e.target === chooser) closeChooser(); });
  verSelect.addEventListener("change", function () { if (current) location.hash = current.slug + "@" + verSelect.value; });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !switcher.hidden) closeSwitcher();
    else if (e.key === "Escape" && !chooser.hidden) closeChooser();
  });

  if (frame.requestFullscreen) {
    fsBtn.hidden = false;
    fsBtn.addEventListener("click", function () {
      frame.requestFullscreen().then(focusGame).catch(function () {});
    });
  }

  window.addEventListener("hashchange", route);
  fetch("games.json")
    .then(function (r) { return r.json(); })
    .then(function (list) { games = list; renderShelf(); route(); })
    .catch(function () {
      shelf.appendChild(el("li", { text: "The game list didn't load. Check your connection and refresh." }));
    });
})();
</script>
<script src="assets/backgrounds.js" data-mount data-pause="#player:not([hidden])" defer></script>
</body>
</html>
