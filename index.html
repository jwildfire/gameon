<!doctype html>
<html lang="en">
<!-- sample change for #194: proves an arcade-only PR runs no game specs (never merged) -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GameOn Arcade</title>
<meta name="description" content="An arcade of party games anyone can make. Dream up a game, an AI builds it, play it with your friends.">
<meta name="theme-color" content="#ffd23f">
<!-- Home screen (#74): the manifest's "./" URLs resolve next to it, so the same file installs
     /gameon/ and /gameon/dev/ as separate apps. On iPhone the page runs full screen under a
     see-through status bar, and the safe-area paddings below keep things clear of the notch. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GameOn">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="assets/mode.js"></script>
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Toy shelf: a sunny wall of chunky, outlined cartridges. One look on purpose, so it
   reads the same in light and dark. */
:root {
  --wall: #ffd23f;
  --ink: #1d1a2f;
  --card: #fffdf6;
  --muted: #5b5670;
  --pop: #ff6b4a;
  --bar: #1d1a2f;
  --bar-fg: #fffdf6;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body: "Nunito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --line: 3px solid var(--ink);
  --lift: 5px 5px 0 var(--ink);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--wall);
  color: var(--ink);
  font: 600 16px/1.45 var(--body);
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--pop); outline-offset: 3px; }

/* ---------- Home ---------- */
.home {
  max-width: 1120px;
  margin: 0 auto;
  padding-block: max(28px, env(safe-area-inset-top, 0px)) max(40px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 28px;
}
.masthead { display: grid; gap: 6px; }
.wordmark {
  margin: 0;
  font: 400 clamp(56px, 12vw, 104px)/0.9 var(--display);
  letter-spacing: 0.01em;
  color: var(--card);
  -webkit-text-stroke: 3px var(--ink);
  paint-order: stroke fill;
  text-shadow: 5px 5px 0 var(--ink);
}
.wordmark { white-space: nowrap; }
.wordmark .wm-on { color: var(--pop); }
.wordmark .wm-word { display: inline-block; }
.lede { margin: 0; font-size: clamp(17px, 2.4vw, 21px); font-weight: 800; max-width: 34ch; text-wrap: balance; min-height: 2.9em; transition: opacity 350ms ease; }
.lede.fading { opacity: 0; }
@media (prefers-reduced-motion: reduce) { .lede { transition: none; } }

.shelf {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
  gap: 24px;
}
.cart {
  display: grid;
  grid-template-rows: auto 1fr;
  height: 100%;
  background: var(--card);
  border: var(--line);
  border-radius: 18px;
  box-shadow: var(--lift);
  overflow: hidden;
  text-decoration: none;
  transition: transform 120ms ease, box-shadow 120ms ease;
}
.cart:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--ink); }
.cart:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--ink); }
.cover {
  position: relative;
  aspect-ratio: 16 / 9;
  max-width: 100%;
  border-bottom: var(--line);
  background: var(--tint, var(--pop));
}
.cover img { display: block; width: 100%; height: 100%; object-fit: cover; }
.play-badge {
  position: absolute;
  right: 12px;
  bottom: -22px;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: var(--tint, var(--pop));
  border: var(--line);
  display: grid;
  place-items: center;
}
.play-badge svg { width: 20px; height: 20px; margin-left: 3px; fill: var(--card); stroke: var(--ink); stroke-width: 2; }
.cart-body { display: grid; align-content: start; gap: 8px; padding: 16px 18px 18px; }
.cart h2 { margin: 0; padding-right: 56px; font: 400 26px/1.05 var(--display); text-wrap: balance; }
.cart p { margin: 0; color: var(--muted); font-size: 15px; }
.credit { font-size: 13px; font-weight: 800; color: var(--ink); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.tag {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 3px 9px;
  border: 2px solid var(--ink);
  border-radius: 999px;
  background: var(--card);
}
.tag.new { background: var(--ink); color: var(--wall); }
/* Editor's Choice (games.json "editorsChoice": true): a gold star on the cover and a gold
   tag, first on the card. The gold is fixed, so it stays gold on every wall and in Weird. */
.pick-star {
  position: absolute;
  top: 8px;
  left: 10px;
  width: 50px;
  height: 50px;
  filter: drop-shadow(3px 3px 0 var(--ink));
}
.pick-star svg { display: block; width: 100%; height: 100%; fill: #ffc233; stroke: var(--ink); stroke-width: 1.6; stroke-linejoin: round; }
.tag.pick { display: inline-flex; align-items: center; gap: 4px; background: #ffc233; color: var(--ink); box-shadow: 2px 2px 0 var(--ink); }
.tag.pick svg { width: 13px; height: 13px; flex: none; fill: var(--card); stroke: var(--ink); stroke-width: 2.4; stroke-linejoin: round; }

.make {
  justify-self: start;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
  padding: 14px 22px;
  background: var(--pop);
  color: var(--card);
  border: var(--line);
  border-radius: 18px;
  box-shadow: var(--lift);
  font: 400 clamp(22px, 3.4vw, 28px)/1 var(--display);
  text-decoration: none;
  -webkit-text-stroke: 1px var(--ink);
  paint-order: stroke fill;
  transition: transform 120ms ease, box-shadow 120ms ease;
}
.make:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--ink); }
.make:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--ink); }
.make svg { width: 26px; height: 26px; fill: var(--card); stroke: var(--ink); stroke-width: 1.5; }
@media (prefers-reduced-motion: reduce) { .make, .make:hover, .make:active { transition: none; transform: none; } }
.foot { margin: 0; font-size: 14px; color: var(--ink); }
.foot a { font-weight: 800; }

/* ---------- Player ---------- */
.player { position: fixed; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; background: var(--ink); }
.bar {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 44px;
  padding-top: env(safe-area-inset-top, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
  background: var(--bar);
  color: var(--bar-fg);
  border-bottom: 3px solid var(--wall);
}
.bar-title { flex: 1; min-width: 0; font: 400 19px/1 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 34px;
  padding: 0 12px;
  border: 2px solid var(--wall);
  border-radius: 999px;
  background: transparent;
  color: var(--bar-fg);
  font: 800 14px/1 var(--body);
  text-decoration: none;
  cursor: pointer;
  white-space: nowrap;
}
.btn.primary { background: var(--wall); color: var(--ink); }
.btn svg.gh, .gh-home svg.gh { fill: currentColor; stroke: none; }
.masthead { position: relative; }
.gh-home {
  position: absolute; top: 4px; right: 0;
  display: inline-flex; align-items: center; gap: 6px;
  height: 36px; padding: 0 12px;
  border: 2.5px solid var(--ink); border-radius: 999px;
  background: var(--card); color: var(--ink);
  font: 800 14px/1 var(--body); text-decoration: none;
}
.gh-home svg { width: 18px; height: 18px; }
/* Wide screens: one row (logo, tagline, button, then GitHub at the far right) instead of a tall stack. */
@media (min-width: 760px) {
  .masthead { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 28px; }
  .wordmark { order: 1; flex: none; font-size: clamp(56px, 6.5vw, 84px); }
  .lede { order: 2; flex: 1 1 220px; max-width: 30ch; }
  .make { order: 3; flex: none; margin-top: 0; }
  .gh-home { order: 4; position: static; margin-left: auto; }
}
.btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.frame { width: 100%; height: 100%; border: 0; display: block; background: #000; }
/* Full screen on a phone: the game stops above the home bar and, sideways, beside the notch.
   Inside the frame the insets read 0, so the arcade keeps the game's own buttons clear. */
.player { padding-bottom: env(safe-area-inset-bottom, 0px); }
.frame {
  width: calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
  margin-left: env(safe-area-inset-left, 0px);
}

/* Game switcher */
.switcher {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: grid;
  align-content: start;
  justify-items: center;
  background: rgba(29, 26, 47, 0.72);
  padding-block: calc(56px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-y: auto;
}
.switch-panel {
  width: min(100%, 760px);
  background: var(--wall);
  border: var(--line);
  border-radius: 18px;
  box-shadow: var(--lift);
  padding: 16px;
  display: grid;
  gap: 12px;
}
.switch-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.switch-head h2 { margin: 0; font: 400 26px/1 var(--display); }
.switch-head .btn { color: var(--ink); border-color: var(--ink); }
.ver {
  height: 34px; max-width: 130px; padding: 0 8px;
  border: 2px solid var(--wall); border-radius: 999px;
  background: var(--bar); color: var(--bar-fg);
  font: 800 13px/1 var(--body); cursor: pointer;
}
.ver-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.ver-item {
  width: 100%; display: grid; gap: 4px; text-align: left; cursor: pointer;
  padding: 12px 14px; border: var(--line); border-radius: 14px; background: var(--card); color: var(--ink);
}
.ver-item[aria-current="true"] { box-shadow: 4px 4px 0 var(--ink); }
.ver-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font: 400 20px/1.1 var(--display); }
.ver-chip { font: 800 11px/1 var(--body); letter-spacing: 0.04em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px; border: 2px solid var(--ink); }
.ver-chip.latest { background: var(--ink); color: var(--wall); }
.ver-note { font: 600 14px/1.35 var(--body); color: var(--muted); }
.switch-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 12px; }
.mini {
  display: grid;
  gap: 6px;
  padding: 6px 6px 10px;
  background: var(--card);
  border: var(--line);
  border-radius: 12px;
  text-decoration: none;
  font: 400 16px/1.1 var(--display);
  text-align: center;
}
.mini img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 7px; border: 2px solid var(--ink); }
.mini[aria-current="true"] { background: var(--ink); color: var(--wall); }

@media (max-width: 520px) {
  .wide-only { display: none !important; }
  .bar { gap: 6px; }
  .bar.has-versions .bar-title { display: none; }
  .ver { flex: 1; min-width: 0; max-width: 120px; font-size: 12px; }
  .btn .label { display: none; }
  .btn { padding: 0 10px; }
}
@media (prefers-reduced-motion: reduce) {
  .cart, .cart:hover, .cart:active { transition: none; transform: none; }
}
/* Normal | Weird (assets/mode.js, #134). The switch sits with GitHub: stacked under it on
   wide screens, beside the Make button on phones. */
.corner { display: contents; }
.mode-switch { grid-row: 3; grid-column: 2; align-self: center; margin-top: 10px; }
@media (max-width: 759px) {
  .masthead { grid-template-columns: minmax(0, 1fr) auto; column-gap: 8px; }
  .wordmark, .lede { grid-column: 1 / -1; }
  .wordmark { grid-row: 1; }
  .lede { grid-row: 2; }
  .make { grid-row: 3; grid-column: 1; white-space: nowrap; }
}
@media (max-width: 374px) { .mode-switch { grid-row: 4; grid-column: 1; justify-self: start; margin-top: 0; } }
@media (min-width: 760px) {
  .corner { order: 4; margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .corner .gh-home { margin-left: 0; }
  .mode-switch { margin-top: 0; }
}
/* Weird mode: trippy backgrounds (assets/backgrounds.js) behind the page, so the words that
   sit on the wall get a card, and the page leaves room for the skip button in the corner. */
html[data-mode="weird"] .lede, html[data-mode="weird"] .foot { justify-self: start; background: var(--card); border: var(--line); border-radius: 14px; box-shadow: var(--lift); padding: 8px 14px; }
/* The rotating tagline fades its words, not its card. Two lines, plus the card's padding and border. */
html[data-mode="weird"] .lede { transition: color 350ms ease; min-height: calc(2.9em + 22px); }
html[data-mode="weird"] .lede.fading { opacity: 1; color: transparent; }
/* In the wide header row the card leaves less room for words, so it holds three lines, centred. */
@media (min-width: 760px) { html[data-mode="weird"] .lede { display: flex; align-items: center; min-height: calc(4.35em + 18px); padding: 6px 12px; } }
@media (prefers-reduced-motion: reduce) { html[data-mode="weird"] .lede { transition: none; } }
/* The logo's rotating titles (#145): the first word wobbles into a new one, "On" stays put. In
   the wide row the logo has the widest title's width (4.6em), so the tagline doesn't
   shuffle sideways, and is a little smaller so that width matches Normal's "GameOn" and the
   tagline card keeps its room. */
@media (min-width: 760px) { html[data-mode="weird"] .wordmark { width: 4.6em; font-size: clamp(48px, 5.3vw, 68px); } }
/* On phones GitHub sits in the logo's top-right corner, so the logo shrinks just enough for the
   widest title (about 4.6em) to stay clear of it. */
@media (max-width: 759px) { html[data-mode="weird"] .wordmark { font-size: min(clamp(56px, 12vw, 104px), calc((100vw - 148px) / 4.65)); } }
.wordmark .wm-word.wobble { animation: wm-wobble 440ms ease-in-out; transform-origin: 50% 80%; }
@keyframes wm-wobble {
  0% { transform: none; }
  40% { transform: rotate(-6deg) scale(0.85); }
  70% { transform: rotate(4deg) scale(1.06); }
  100% { transform: none; }
}
@media (prefers-reduced-motion: reduce) { .wordmark .wm-word.wobble { animation: none; } }
/* Title styles: every new title also gets a new look (font, colors, outline, shadow). Style 0
   is the classic logo above. The heading's height is pinned so taller fonts can't nudge the
   header, and the script shrinks the letters (--fit) when a wide font would overrun 4.55em.
   The fonts load only once Weird mode is on. */
html[data-mode="weird"] .wordmark { height: 0.9em; }
html[data-mode="weird"] .wordmark > span { display: inline-block; font-size: calc(var(--fit, 1) * 1em); }
html[data-mode="weird"] .wordmark[data-style="1"] { font-family: "Bungee", var(--display); color: #ffd23f; -webkit-text-stroke: 3px #1d1a2f; text-shadow: 4px 4px 0 #1d1a2f, 8px 8px 0 #ff3ea5; }
html[data-mode="weird"] .wordmark[data-style="1"] .wm-on { color: #ff3ea5; }
html[data-mode="weird"] .wordmark[data-style="2"] { font-family: "Press Start 2P", monospace; color: #39ff14; -webkit-text-stroke: 2px #000; text-shadow: 4px 4px 0 #000; letter-spacing: -0.02em; }
html[data-mode="weird"] .wordmark[data-style="2"] .wm-on { color: #ff4fd8; }
html[data-mode="weird"] .wordmark[data-style="3"] { font-family: "Creepster", var(--display); color: #b6ff3b; -webkit-text-stroke: 3px #2a0033; text-shadow: 0 6px 0 #2a0033; letter-spacing: 0.03em; }
html[data-mode="weird"] .wordmark[data-style="3"] .wm-on { color: #ff7b00; }
html[data-mode="weird"] .wordmark[data-style="4"] { font-family: "Bangers", var(--display); color: #fff; -webkit-text-stroke: 3px #000; text-shadow: 5px 5px 0 #e4002b; letter-spacing: 0.04em; }
html[data-mode="weird"] .wordmark[data-style="4"] .wm-on { color: #ffdd00; }
html[data-mode="weird"] .wordmark[data-style="5"] { font-family: "Pacifico", cursive; color: #ffe3f1; -webkit-text-stroke: 3px #5b1a8a; text-shadow: 4px 4px 0 #5b1a8a; letter-spacing: 0; }
html[data-mode="weird"] .wordmark[data-style="5"] .wm-on { color: #ff5fa2; }
html[data-mode="weird"] .wordmark[data-style="6"] { font-family: "Monoton", var(--display); color: #00f0ff; -webkit-text-stroke: 0; text-shadow: 3px 3px 0 #10002b, 0 0 8px #00f0ff; }
html[data-mode="weird"] .wordmark[data-style="6"] .wm-on { color: #ff2bd6; }
html[data-mode="weird"] .wordmark[data-style="7"] { font-family: "Shrikhand", var(--display); color: #ff9f1c; -webkit-text-stroke: 3px #3d0c02; text-shadow: 5px 5px 0 #3d0c02; }
html[data-mode="weird"] .wordmark[data-style="7"] .wm-on { color: #2ec4b6; }
html[data-mode="weird"] .wordmark[data-style="8"] { font-family: "Titan One", var(--display); color: #7df9ff; -webkit-text-stroke: 3px #002a5c; text-shadow: 0 5px 0 #002a5c, 0 9px 0 #ff5aa5; }
html[data-mode="weird"] .wordmark[data-style="8"] .wm-on { color: #ffe600; }
html[data-mode="weird"] .wordmark[data-style="9"] { font-family: "Fredericka the Great", var(--display); color: #fff8e7; -webkit-text-stroke: 1.5px #1d1a2f; text-shadow: 3px 3px 0 #1d1a2f; }
html[data-mode="weird"] .wordmark[data-style="9"] .wm-on { color: #ffcf33; }
html[data-mode="weird"] .wordmark[data-style="10"] { font-family: "Righteous", var(--display); color: #c77dff; -webkit-text-stroke: 3px #10002b; text-shadow: 5px 5px 0 #10002b; }
html[data-mode="weird"] .wordmark[data-style="10"] .wm-on { color: #72efdd; }
html[data-mode="weird"] .wordmark[data-style="11"] { font-family: "Lobster", cursive; color: #ff5d73; -webkit-text-stroke: 3px #3a0ca3; text-shadow: 4px 4px 0 #3a0ca3; letter-spacing: 0; }
html[data-mode="weird"] .wordmark[data-style="11"] .wm-on { color: #fff275; }
html[data-mode="weird"] .wordmark[data-style="12"] { font-family: "Rubik Glitch", var(--display); color: #fff; -webkit-text-stroke: 2px #000; text-shadow: -4px 0 0 #ff0055, 4px 0 0 #00e5ff; }
html[data-mode="weird"] .wordmark[data-style="12"] .wm-on { color: #00ffd5; }
html[data-mode="weird"] .wordmark[data-style="13"] { font-family: "Bungee Shade", var(--display); color: #ffd60a; -webkit-text-stroke: 0; text-shadow: 3px 3px 0 #1d1a2f; }
html[data-mode="weird"] .wordmark[data-style="13"] .wm-on { color: #ff006e; }
html[data-mode="weird"] .wordmark[data-style="14"] { font-family: "Chewy", var(--display); color: #a0ff6e; -webkit-text-stroke: 3px #213a00; text-shadow: 4px 4px 0 #213a00; }
html[data-mode="weird"] .wordmark[data-style="14"] .wm-on { color: #ff8fab; }
html[data-mode="weird"] .wordmark[data-style="15"] { font-family: "Faster One", var(--display); color: #ff3c38; -webkit-text-stroke: 2px #1d1a2f; text-shadow: 6px 3px 0 #1d1a2f; }
html[data-mode="weird"] .wordmark[data-style="15"] .wm-on { color: #ffd166; }
html[data-mode="weird"] .wordmark[data-style="16"] { font-family: "Rampart One", var(--display); color: #fff; -webkit-text-stroke: 0; text-shadow: 4px 4px 0 #240046; }
html[data-mode="weird"] .wordmark[data-style="16"] .wm-on { color: #c77dff; }
html[data-mode="weird"] .wordmark[data-style="17"] { font-family: "Silkscreen", monospace; color: #fefae0; -webkit-text-stroke: 2px #000; text-shadow: 4px 4px 0 #3a86ff, 8px 8px 0 #000; }
html[data-mode="weird"] .wordmark[data-style="17"] .wm-on { color: #ff6b4a; }
html[data-mode="weird"] .wordmark[data-style="18"] { font-family: "Fascinate", var(--display); color: #f72585; -webkit-text-stroke: 3px #1d1a2f; text-shadow: 5px 5px 0 #4cc9f0; }
html[data-mode="weird"] .wordmark[data-style="18"] .wm-on { color: #4cc9f0; }
html[data-mode="weird"] .wordmark[data-style="19"] { font-family: "Rubik Moonrocks", var(--display); color: #e0e1dd; -webkit-text-stroke: 2px #0d1b2a; text-shadow: 5px 5px 0 #0d1b2a; }
html[data-mode="weird"] .wordmark[data-style="19"] .wm-on { color: #ffb703; }

// Normal mode shows the first line and holds it. Weird mode (assets/mode.js) shows one at a

// random line per visit.
(function () {
  var LINES = ["Think of a Game? Make it, play it, change it!", "Think of a Game? Make it. Then make it better.", "Dream up a game. Play it with your friends tonight.", "Say it out loud. Play it by dinner.", "Your idea. Our robots. Everyone's controller.", "Describe it. Build it. Beat your friends at it.", "Grab a controller. Grab a friend. Grab a weird idea.", "Every game here started as one sentence.", "One idea in. One game out.", "If you can say it, you can play it.", "Thought up by people. Built by robots. Played by everyone.", "Pitch a game. Hit Send. Press Start.", "Make the game you wish existed.", "Couch, snacks, friends, and a game nobody's played yet.", "Today's weird idea is tonight's game night.", "Nachos, jelly, lava, robots. Anything goes.", "Your game, your rules, your high score.", "Change the rules. Then change them again.", "Don't like the ending? Make your own version.", "Built in an hour. Played for weeks.", "Insert idea. Get game.", "Player 1, pitch your game.", "The arcade where the games take requests.", "Some people play games. You make them.", "Two controllers, one couch, endless nonsense.", "What if the floor was lava? Go find out.", "Bring an idea. Leave with a game.", "No coding. Just ideas and a big Send button.", "Remix any game. Make it yours.", "Game night, freshly baked.", "Every version stays. Every idea counts.", "From “what if” to “one more round.”", "Think it. Say it. Splat it.", "It's not cheating if you made the game.", "The best games start with “what if…”", "You bring the chaos. We'll bring the code.", "Make a game in the time it takes to get a pizza.", "Too easy? Make it harder.", "Too hard? Make it easier. It's your game.", "Every game here has a story. Add yours.", "Sauce, shapes, pies and trampolines. So far.", "Fork a game. Put your name on it.", "Imagine it on the couch. Play it on the couch.", "One more game. Then one more after that.", "Make it silly. Make it spicy. Make it yours.", "The arcade is open. The cabinets are yours.", "Ideas welcome. Controllers recommended.", "Someone's idea is about to be your favourite game.", "Got a game stuck in your head? Let it out.", "Make a game with your friends. Then beat them at it.", "Send it to the Matrix. Grab the snacks.", "Weird ideas make the best games.", "Change one rule. See what happens."];
  var el = document.getElementById("tagline");
  var i = 0, timer = 0;
  function weird() { return !!window.gameonMode && window.gameonMode.get() === "weird"; }
  function show(n) { i = (n + LINES.length) % LINES.length; el.textContent = LINES[i]; }
  function next() {
    el.classList.add("fading");
    setTimeout(function () { if (weird()) show(i + 1); el.classList.remove("fading"); }, 360);
  }

    clearInterval(timer);
    timer = 0;
    el.classList.remove("fading");

// Logo titles (#145): Normal mode is always "GameOn". Weird mode starts on "GameOn" and swaps
// the first word every 6.5 s, half a beat after the tagline, so the two take turns. "On"
// stays orange; the h1's aria-label keeps it "GameOn" for screen readers. With reduced motion
// the word still changes, just without the wobble. ?titleInterval=<seconds> speeds it up.
(function () {
  var WORDS = ["Game", "Flame", "Llama", "Dream", "Glitch", "Party", "Bounce", "Noodle", "Zoom", "Jelly", "Space", "Goose", "Pizza", "Wiggle", "Beam", "Robot", "Banana", "Taco", "Dino", "Combo", "Rocket", "Bubble", "Disco", "Waffle", "Pickle", "Turbo", "Splash", "Giggle", "Sauce", "Lava", "Comet", "Pixel"];
  // Each title also gets the next of 20 looks (CSS: .wordmark[data-style]). Style 0 is the
  // classic logo; the rest each need one Google font, loaded the first time Weird mode is on.
  var STYLES = ["Classic", "Bungee", "Press Start 2P", "Creepster", "Bangers", "Pacifico", "Monoton", "Shrikhand", "Titan One", "Fredericka the Great", "Righteous", "Lobster", "Rubik Glitch", "Bungee Shade", "Chewy", "Faster One", "Rampart One", "Silkscreen", "Fascinate", "Rubik Moonrocks"];
  var FIT = 4.55; // the widest a title may be, in ems of the heading (the room the header leaves it)
  var mark = document.getElementById("wordmark");
  var word = document.getElementById("wm-word");
  var secs = parseFloat(new URLSearchParams(location.search).get("titleInterval"));
  var every = secs > 0 ? secs * 1000 : 6500;
  var i = 0, s = 0, timer = 0, swap = 0, fonts = null;
  function weird() { return !!window.gameonMode && window.gameonMode.get() === "weird"; }
  function still() { return !!window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches; }

    if (fonts) return fonts;
    var link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = "https://fonts.googleapis.com/css2?" + STYLES.slice(1).map(function (f) { return "family=" + f.replace(/ /g, "+"); }).join("&") + "&display=swap";
    fonts = new Promise(function (done) {
      link.onload = function () {
        // Ask for every letter: some fonts (Rampart One) come in slices, and a slice that
        // arrives after the title is measured would make it wider than its room.
        var abc = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
        Promise.all(STYLES.slice(1).map(function (f) { return document.fonts.load('40px "' + f + '"', abc).catch(function () {}); })).then(function () { fit(); done(); });
      };
      link.onerror = function () { done(); };
    });
    document.head.appendChild(link);
    return fonts;
  }
  // Shrink the letters, not the heading, when a wide font would overrun the title's room.
  function fit() {
    if (!weird()) { mark.style.removeProperty("--fit"); return; }
    var room = FIT * parseFloat(getComputedStyle(mark).fontSize), k = 1;
    mark.style.width = "max-content"; // measure the title's own width, as laid out

    // measure again after each shrink, a few times at most.

    s = ((look === undefined ? n : look) % STYLES.length + STYLES.length) % STYLES.length;

  }
  function next() {
    if (still()) { show(i + 1, s + 1); return; }
    word.classList.remove("wobble");
    void word.offsetWidth; // restart the animation
    word.classList.add("wobble");

    swap = setTimeout(function () { if (weird()) show(i + 1, s + 1); }, 180); // at the wobble's squeeze
  }
  function stop() {
    clearTimeout(timer); clearInterval(timer); clearTimeout(swap);
    timer = swap = 0;
    word.classList.remove("wobble");
  }
  function apply() {
    stop();
    show(0, 0);
    if (!weird()) return;
    loadFonts();
    timer = setTimeout(function () {
      if (!document.hidden) next();
      timer = setInterval(function () { if (!document.hidden) next(); }, every);
    }, every / 2);
  }
  word.addEventListener("animationend", function () { word.classList.remove("wobble"); });
  window.gameonTitles = WORDS.map(function (w) { return w + "On"; });
  window.gameonNextTitle = function () { show(i + 1, s + 1); return WORDS[i] + "On"; };
  window.gameonTitleStyles = STYLES.slice();
  window.gameonTitleStyle = function () { return STYLES[s]; };
  // Test hook: show word n in look k, and a promise that settles once Weird's fonts are in.
  window.gameonShowTitle = function (n, k) { show(n, k); return WORDS[i] + "On"; };
  window.gameonTitleFonts = function () { return loadFonts(); };
  if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener("loadingdone", fit);
  document.addEventListener("gameon:mode", apply);
  apply();
})();
</script>
<script>
(function () {
  var games = [];
  var shelf = document.getElementById("shelf");
  var home = document.getElementById("home");
  var player = document.getElementById("player");
  var frame = document.getElementById("frame");
  var barTitle = document.getElementById("bar-title");
  var ownBtn = document.getElementById("own-btn");
  var ghBtn = document.getElementById("gh-btn");
  var fsBtn = document.getElementById("fs-btn");
  var switcher = document.getElementById("switcher");
  var switchGrid = document.getElementById("switch-grid");
  var chooser = document.getElementById("chooser");
  var verList = document.getElementById("ver-list");
  var verSelect = document.getElementById("ver-select");
  var updateBtn = document.getElementById("update-btn");
  var bar = document.querySelector(".bar");
  var current = null, currentVer = null;
  var PICK = "gameon.arcade.version.";

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    for (var k in attrs || {}) {
      if (k === "text") n.textContent = attrs[k];
      else n.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { n.appendChild(c); });
    return n;
  }
  // Versions: see docs/game-versions.md. An entry without versions is one version, {creator}.v1.
  function creatorOf(g) { return g.creator || "jeremy"; }
  function versionsOf(g) {
    return g.versions && g.versions.length ? g.versions : [{ id: creatorOf(g) + ".v1", url: g.url, note: "The first version" }];
  }
  function who(v) { return v.id.split(".v")[0]; }
  function num(v) { return parseInt(v.id.split(".v")[1], 10) || 0; }
  function defaultOf(g) {
    var vs = versionsOf(g);
    if (g["default"] && vs.some(function (v) { return v.id === g["default"]; })) return g["default"];
    var mine = vs.filter(function (v) { return who(v) === creatorOf(g); }).sort(function (a, b) { return num(b) - num(a); });
    return (mine[0] || vs[0]).id;
  }
  // The default first, then the creator's older versions, then forks grouped by who made them.
  function ordered(g) {
    var def = defaultOf(g), c = creatorOf(g);
    return versionsOf(g).slice().sort(function (a, b) {
      if (a.id === def) return -1; if (b.id === def) return 1;
      var ac = who(a) === c, bc = who(b) === c;
      if (ac !== bc) return ac ? -1 : 1;
      if (who(a) !== who(b)) return who(a) < who(b) ? -1 : 1;
      return num(b) - num(a);
    });
  }
  function findVersion(g, id) { return versionsOf(g).filter(function (v) { return v.id === id; })[0]; }
  function lastPick(slug) { try { return localStorage.getItem(PICK + slug); } catch (e) { return null; } }
  function rememberPick(slug, id) { try { localStorage.setItem(PICK + slug, id); } catch (e) {} }
  // Where a version's code lives: the game's own repo, or its folder here.
  function sourceUrl(g, v) {
    if (/^https?:/.test(v.url)) return g.repo;
    return "https://github.com/jwildfire/gameon/tree/main/" + v.url.replace(/\/$/, "");
  }
  function cover(g) { return "assets/covers/" + g.slug + ".jpg"; }

  // Editor's Choice games first, then the rest; each group keeps its games.json order.
  function shelfOrder() {
    return games.filter(function (g) { return g.editorsChoice === true; })
      .concat(games.filter(function (g) { return g.editorsChoice !== true; }));
  }
  var STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2l2.9 6.2 6.8.8-5 4.6 1.3 6.7L12 17.2l-6 3.3 1.3-6.7-5-4.6 6.8-.8z"/></svg>';

  function renderShelf() {
    shelfOrder().forEach(function (g) {
      var badge = el("span", { "class": "play-badge", "aria-hidden": "true" });
      badge.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg>';
      var nv = versionsOf(g).length;
      var tags = el("div", { "class": "tags" }, (g.tags || []).concat(nv > 1 ? [nv + " versions"] : []).map(function (t) {
        return el("span", { "class": "tag" + (t === "New" ? " new" : ""), text: t });
      }));
      var coverKids = [el("img", { src: cover(g), alt: "", loading: "lazy", width: "800", height: "450" }), badge];
      if (g.editorsChoice === true) {
        var pick = el("span", { "class": "tag pick", title: "Editor's Choice" });
        pick.innerHTML = STAR;
        pick.appendChild(document.createTextNode("Editor's Choice"));
        tags.insertBefore(pick, tags.firstChild);
        var star = el("span", { "class": "pick-star", "aria-hidden": "true" });
        star.innerHTML = STAR;
        coverKids.push(star);
      }
      var body = el("div", { "class": "cart-body" }, [el("h2", { text: g.title }), el("p", { text: g.tagline })]);
      if (g.credit) body.appendChild(el("span", { "class": "credit", text: g.credit }));
      body.appendChild(tags);
      var link = el("a", { "class": "cart", href: "#" + g.slug, style: "--tint:" + g.color }, [
        el("div", { "class": "cover" }, coverKids),
        body
      ]);
      shelf.appendChild(el("li", {}, [link]));

      var mini = el("a", { "class": "mini", href: "#" + g.slug, "data-slug": g.slug }, [
        el("img", { src: cover(g), alt: "", loading: "lazy" }),
        el("span", { text: g.title })
      ]);
      switchGrid.appendChild(el("li", {}, [mini]));
    });
  }

  function openSwitcher() {
    switchGrid.querySelectorAll(".mini").forEach(function (m) {
      m.setAttribute("aria-current", current && m.dataset.slug === current.slug ? "true" : "false");
    });
    switcher.hidden = false;
    document.getElementById("close-switch").focus();
  }
  function closeSwitcher() {
    switcher.hidden = true;
    if (current) focusGame();
  }
  function focusGame() {
    try { frame.contentWindow.focus(); } catch (e) { frame.focus(); }
  }

  function showChooser(g) {
    var def = defaultOf(g), last = lastPick(g.slug), c = creatorOf(g);
    verList.innerHTML = "";
    ordered(g).forEach(function (v) {
      var top = el("span", { "class": "ver-top" }, [el("span", { text: v.id })]);
      if (v.id === def) top.appendChild(el("span", { "class": "ver-chip latest", text: "Latest" }));
      if (v.id === last) top.appendChild(el("span", { "class": "ver-chip", text: "Last played" }));
      var bits = [];
      if (v.note) bits.push(v.note);
      if (who(v) !== c) bits.push("Made by " + who(v) + (v.from ? ", started from " + v.from : ""));
      var btn = el("button", { "class": "ver-item", type: "button", "data-version": v.id, "aria-current": String(v.id === (last || def)) }, [top]);
      if (bits.length) btn.appendChild(el("span", { "class": "ver-note", text: bits.join(" · ") }));
      btn.addEventListener("click", function () { location.replace("#" + g.slug + "@" + v.id); });
      verList.appendChild(el("li", {}, [btn]));
    });
    document.getElementById("choose-title").textContent = "Which " + g.title + "?";
    chooser.hidden = false;
    var focus = verList.querySelector('[aria-current="true"]') || verList.querySelector("button");
    if (focus) focus.focus();
  }
  function closeChooser() {
    chooser.hidden = true;
    location.replace(current ? "#" + current.slug + "@" + currentVer : "#");
  }

  function route() {
    var parts = decodeURIComponent(location.hash.replace(/^#/, "")).split("@");
    var g = games.filter(function (x) { return x.slug === parts[0]; })[0];
    switcher.hidden = true;
    chooser.hidden = true;
    if (!g) {
      current = null; currentVer = null;
      player.hidden = true;
      home.hidden = false;
      frame.removeAttribute("src");
      document.title = "GameOn Arcade";
      return;
    }
    var vs = versionsOf(g);
    var v = parts[1] ? findVersion(g, parts[1]) : null;
    if (!v) {
      if (vs.length > 1) { showChooser(g); return; }
      v = vs[0];
    }
    if (!current || current.slug !== g.slug || currentVer !== v.id) {
      current = g; currentVer = v.id;
      frame.src = v.url;
      barTitle.textContent = g.title;
      ownBtn.href = v.url;
      ghBtn.href = sourceUrl(g, v);
      updateBtn.href = "new/?game=" + encodeURIComponent(g.slug) + "&version=" + encodeURIComponent(v.id);
      verSelect.innerHTML = "";
      ordered(g).forEach(function (x) {
        var o = el("option", { value: x.id, text: x.id + (x.id === defaultOf(g) ? " (latest)" : "") });
        if (x.id === v.id) o.selected = true;
        verSelect.appendChild(o);
      });
      verSelect.hidden = vs.length < 2;
      bar.classList.toggle("has-versions", vs.length > 1);
      if (vs.length > 1) rememberPick(g.slug, v.id);
      document.title = g.title + " · GameOn";
    }
    home.hidden = true;
    player.hidden = false;
    window.scrollTo(0, 0);
  }

  frame.addEventListener("load", focusGame);
  document.getElementById("switch-btn").addEventListener("click", openSwitcher);
  document.getElementById("close-switch").addEventListener("click", closeSwitcher);
  switcher.addEventListener("click", function (e) { if (e.target === switcher) closeSwitcher(); });
  switchGrid.addEventListener("click", function (e) {
    var a = e.target.closest(".mini");
    if (a && current && a.dataset.slug === current.slug) { e.preventDefault(); closeSwitcher(); }
  });
  document.getElementById("close-choose").addEventListener("click", closeChooser);
  chooser.addEventListener("click", function (e) { if (e.target === chooser) closeChooser(); });
  verSelect.addEventListener("change", function () { if (current) location.hash = current.slug + "@" + verSelect.value; });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !switcher.hidden) closeSwitcher();
    else if (e.key === "Escape" && !chooser.hidden) closeChooser();
  });

  if (frame.requestFullscreen) {
    fsBtn.hidden = false;
    fsBtn.addEventListener("click", function () {
      frame.requestFullscreen().then(focusGame).catch(function () {});
    });
  }

  // Game controllers (#130), with the Gamepad API's standard mapping. The D-pad or left stick
  // moves a focus ring, A picks, B goes back, Y opens the game switcher. While a game plays its
  // input is its own: only Start+Select (or Home) brings up the player bar, where B goes back
  // to the game. Nothing runs, and no hints show, until a controller is connected.
  (function () {
    if (!navigator.getGamepads) return;
    var A = 0, B = 1, Y = 3, SELECT = 8, START = 9, HOME = 16;
    var hints = document.getElementById("pad-hints");
    var homeBtn = document.getElementById("home-btn");
    var SCOPES = {
      home: "#shelf .cart, #make-btn, [data-mode-set]",
      switcher: "#switch-grid .mini, #close-switch",
      chooser: "#ver-list .ver-item, #close-choose",
      bar: "#home-btn, #switch-btn, #ver-select"
    };
    var PAD = '<svg viewBox="0 0 24 24"><path d="M9 2h6v7h7v6h-7v7H9v-7H2V9h7z"/></svg>';
    var HINTS = {
      home: [["pad", "Move"], ["a", "Play"]],
      switcher: [["pad", "Move"], ["a", "Play"], ["b", "Back"]],
      chooser: [["pad", "Move"], ["a", "Choose"], ["b", "Back"]],
      bar: [["pad", "Move"], ["a", "Choose"], ["y", "Games"], ["b", "Back to game"]]
    };
    var active = false, prev = null, menu = false, ctx = "", ring = null, lastSlug = null;
    var heldDir = "", repeatAt = 0, fadeTimer = 0;

    function pads() {
      return Array.prototype.filter.call(navigator.getGamepads() || [], function (p) { return p && p.connected; });
    }
    // Where the controller is: a dialog, the player bar (menu), the game itself, or the shelf.
    function context() {
      if (!chooser.hidden) return "chooser";
      if (!switcher.hidden) return "switcher";
      if (!player.hidden) return menu ? "bar" : "game";
      return "home";
    }
    function targets() {
      return SCOPES[ctx] ? Array.prototype.filter.call(document.querySelectorAll(SCOPES[ctx]), function (n) { return n.getClientRects().length > 0; }) : [];
    }
    // Where the ring starts: the first game, not the header's buttons.
    function first(list) {
      return list.filter(function (n) { return n.matches(".cart, .mini, .ver-item"); })[0] || list[0];
    }
    function setRing(n) {
      if (ring) ring.classList.remove("gp-focus");
      ring = n || null;
      if (!ring) return;
      ring.classList.add("gp-focus");
      if (ring.matches(".cart")) lastSlug = ring.getAttribute("href").slice(1);
      ring.focus({ preventScroll: true });
      ring.scrollIntoView({ block: "nearest", inline: "nearest" });
    }
    // The nearest target in that direction, counting sideways distance double, so the ring
    // goes straight down a column rather than across.
    function move(dir) {
      var list = targets();
      if (!list.length) return;
      if (!ring && list.indexOf(document.activeElement) >= 0) setRing(document.activeElement);
      if (!ring || list.indexOf(ring) < 0) { setRing(first(list)); return; }
      var a = ring.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2;
      var best = null, bestScore = Infinity;
      list.forEach(function (n) {
        if (n === ring) return;
        var b = n.getBoundingClientRect(), dx = b.left + b.width / 2 - ax, dy = b.top + b.height / 2 - ay;
        var across = dir === "left" || dir === "right";
        var ahead = dir === "left" ? -dx : dir === "right" ? dx : dir === "up" ? -dy : dy;
        if (ahead <= 1) return;
        var score = ahead + 2 * Math.abs(across ? dy : dx);
        if (score < bestScore) { bestScore = score; best = n; }
      });
      if (best) setRing(best);
    }
    function renderHints() {
      hints.innerHTML = "";
      hints.setAttribute("data-ctx", ctx);
      hints.classList.remove("faded");
      clearTimeout(fadeTimer);
      if (ctx === "game") {
        hints.appendChild(el("span", {}, [el("span", { "class": "k wide", text: "Start" }), document.createTextNode("+"),
          el("span", { "class": "k wide", text: "Select" }), document.createTextNode("Arcade menu")]));
        // Over a game the hint shows for a few seconds, then gets out of the way.
        fadeTimer = setTimeout(function () { hints.classList.add("faded"); }, 4000);
        return;
      }
      (HINTS[ctx] || []).forEach(function (h) {
        var k = el("span", { "class": "k " + h[0], text: h[0] === "pad" ? "" : h[0].toUpperCase() });
        if (h[0] === "pad") k.innerHTML = PAD;
        hints.appendChild(el("span", h[0] === "pad" ? { "class": "move" } : {}, [k, document.createTextNode(h[1])]));
      });
    }
    // Follow the arcade into its new state: put the ring somewhere sensible, show its hints.
    function sync() {
      var from = ctx, c = context();
      if (c === from) return;
      if ((from === "switcher" || from === "chooser") && !player.hidden) { menu = false; c = context(); }
      if (c === "home") menu = false;
      ctx = c;
      if (c === "home") setRing((lastSlug && shelf.querySelector('.cart[href="#' + lastSlug + '"]')) || first(targets()));
      else if (c === "switcher") setRing(switchGrid.querySelector('.mini[aria-current="true"]') || first(targets()));
      else if (c === "chooser") setRing(verList.querySelector('[aria-current="true"]') || first(targets()));
      else if (c === "bar") setRing(homeBtn);
      else { setRing(null); if (from) focusGame(); }
      renderHints();
    }
    function press(b) {
      if (b === A) {
        if (!ring || targets().indexOf(ring) < 0) move("down");
        else if (ring === verSelect) showChooser(current);
        else ring.click();
      } else if (b === B) {
        if (ctx === "switcher") closeSwitcher();
        else if (ctx === "chooser") closeChooser();
        else if (ctx === "bar") menu = false;
      } else if (b === Y) {
        if (ctx === "bar") openSwitcher();
        else if (ctx === "switcher") closeSwitcher();
      }
      sync();
    }
    // Start+Select (or Home): in a game, open the bar; anywhere in the player, go back to the game.
    function combo() {
      if (ctx === "game") menu = true;
      else if (ctx === "bar") menu = false;
      else if (ctx === "switcher" && current) closeSwitcher();
      else if (ctx === "chooser" && current) closeChooser();
      sync();
    }
    function poll() {
      if (!active) return;
      var list = pads();
      if (!list.length) { stop(); return; }
      var down = [], i, now = performance.now();
      for (i = 0; i <= HOME; i++) {
        down[i] = list.some(function (p) { var b = p.buttons[i]; return !!b && (b.pressed || b.value > 0.5); });
      }
      var dir = down[12] ? "up" : down[13] ? "down" : down[14] ? "left" : down[15] ? "right" : "";
      if (!dir) list.some(function (p) {
        var x = p.axes[0] || 0, y = p.axes[1] || 0;
        if (Math.max(Math.abs(x), Math.abs(y)) < 0.5) return false;
        dir = Math.abs(x) > Math.abs(y) ? (x > 0 ? "right" : "left") : (y > 0 ? "down" : "up");
        return true;
      });
      if (current) lastSlug = current.slug;
      sync();
      // Buttons held when the controller turned up don't count until they're let go.
      if (prev) {
        var hit = function (n) { return down[n] && !prev[n]; };
        if ((down[SELECT] && down[START] && !(prev[SELECT] && prev[START])) || hit(HOME)) combo();
        else if (ctx !== "game") {
          if (hit(A)) press(A); else if (hit(B)) press(B); else if (hit(Y)) press(Y);
        }
        if (ctx !== "game") {
          if (dir && dir !== heldDir) { move(dir); repeatAt = now + 380; }
          else if (dir && now >= repeatAt) { move(dir); repeatAt = now + 150; }
        }
      }
      heldDir = dir;
      prev = down;
      requestAnimationFrame(poll);
    }
    function start() {
      if (active) return;
      active = true; prev = null; ctx = ""; menu = false;
      document.documentElement.setAttribute("data-pad", "");
      hints.hidden = false;
      requestAnimationFrame(poll);
    }
    function stop() {
      active = false; prev = null; ctx = ""; menu = false;
      setRing(null);
      document.documentElement.removeAttribute("data-pad");
      hints.hidden = true;
    }
    window.addEventListener("gamepadconnected", start);
    // A controller first pressed while a game had focus may only show up by polling.
    setInterval(function () { if (!active && pads().length) start(); }, 1000);
    // Touch, mouse and keyboard work as always; they just put the ring away.
    document.addEventListener("pointerdown", function () { setRing(null); }, true);
    document.addEventListener("keydown", function () { setRing(null); }, true);
  })();

  window.addEventListener("hashchange", route);
  fetch("games.json")
    .then(function (r) { return r.json(); })
    .then(function (list) { games = list; renderShelf(); route(); })
    .catch(function () {
      shelf.appendChild(el("li", { text: "The game list didn't load. Check your connection and refresh." }));
    });
})();
</script>
<script src="assets/backgrounds.js" data-mount data-pause="#player:not([hidden])" defer></script>
</body>
</html>
