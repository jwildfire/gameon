<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Fidget Factory</title>
<meta name="description" content="Dream up wild fidget toys in a goofy toy workshop, then spin, pop, squish and click them!">
<meta name="theme-color" content="#ff9ccc">
<link rel="icon" href="data:,">
<style>
:root {
  --ink: #2a2140;
  --cream: #fff8f0;
  --pink: #ff6fb5;
  --pink-soft: #ffd3e8;
  --lemon: #ffd93d;
  --mint: #4cd97b;
  --sky: #4f8cff;
  --lilac: #a66cff;
  --round: ui-rounded, "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
body { font-family: var(--round); color: var(--ink); background: #ffe3f1; }
[hidden] { display: none !important; }
button { font-family: var(--round); color: var(--ink); cursor: pointer; }
button:focus-visible { outline: 4px solid var(--sky); outline-offset: 2px; }
.screen { position: fixed; inset: 0; overflow: hidden; }
canvas.full { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.btn { border: 3px solid var(--ink); background: var(--cream); border-radius: 18px; padding: 10px 18px; font-size: 18px; font-weight: 900; box-shadow: 0 5px 0 var(--ink); transition: transform 80ms; }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.btn.big { font-size: 22px; padding: 14px 24px; background: var(--lemon); }
.btn.pink { background: var(--pink); color: #fff; text-shadow: 0 2px 0 var(--ink); }
.round { width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--ink); background: var(--cream); padding: 0; font: 900 18px var(--round); display: grid; place-items: center; box-shadow: 0 3px 0 var(--ink); flex: none; }
.round.off { opacity: 0.5; text-decoration: line-through; }
.round.on { background: var(--lemon); }
.pill { background: var(--cream); border: 3px solid var(--ink); border-radius: 999px; padding: 3px 12px; font-weight: 900; font-size: 15px; white-space: nowrap; }
.coins { display: inline-flex; align-items: center; gap: 6px; }
.coin { display: inline-block; width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff7b0, #ffcc00 55%, #e09a00); border: 2px solid var(--ink); flex: none; }
.coins.bump { animation: bump 380ms ease-out; }
@keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.3) rotate(-4deg); } 100% { transform: scale(1); } }

/* title */
#title .card { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(460px, calc(100% - 32px)); background: var(--cream); border: 4px solid var(--ink); border-radius: 28px; box-shadow: 8px 8px 0 var(--ink); padding: 22px 20px; text-align: center; display: grid; gap: 12px; }
.logo { margin: 0; line-height: 0.92; font-size: clamp(46px, 14vw, 68px); font-weight: 900; letter-spacing: -1px; }
.logo span { display: block; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 5px 0 var(--ink); }
.logo .a { color: var(--pink); transform: rotate(-3deg); }
.logo .b { color: var(--lemon); transform: rotate(2deg); }
.tagline { margin: 0; font-size: 17px; font-weight: 700; }
.credit { margin: 0; font-size: 14px; font-weight: 800; color: #6b5f88; }
.row-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.row-btns .btn { flex: 1 1 160px; }
.title-meta { display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; font-size: 14px; }

/* headers */
.bar { position: absolute; left: 0; right: 0; top: 0; z-index: 3; display: flex; align-items: center; gap: 8px; padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top)); pointer-events: none; }
.bar > * { pointer-events: auto; }
.bar h2 { margin: 0; font-size: 20px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .spacer { flex: 1; }

/* design */
#design { background: linear-gradient(#ffe3f1, #ffd7c2); }
#design .wrap { position: absolute; inset: 64px 0 0 0; display: grid; grid-template-rows: minmax(150px, 34%) 1fr; }
#preview { position: relative; }
#prev-cv { position: absolute; inset: 0; width: 100%; height: 100%; }
#design-name { position: absolute; left: 0; right: 0; bottom: 2px; text-align: center; font-weight: 900; font-size: 16px; }
#panel { overflow-y: auto; padding: 4px 12px 12px; display: grid; gap: 8px; align-content: start; }
.prow { background: var(--cream); border: 3px solid var(--ink); border-radius: 18px; padding: 6px 8px 8px; }
.prow h3 { margin: 0 0 4px 4px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: #6b5f88; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opt { position: relative; border: 3px solid var(--ink); background: #fff; border-radius: 14px; padding: 4px 8px; display: inline-flex; align-items: center; gap: 4px; font: 900 13px var(--round); min-height: 44px; }
.opt .ic { width: 36px; height: 36px; display: block; }
.opt.on { background: var(--lemon); box-shadow: inset 0 -4px 0 rgba(0,0,0,0.12); }
.opt.locked { background: #ece8f3; color: #6b5f88; }
.opt.locked .ic, .opt.locked .lb { opacity: 0.55; }
.opt .price { display: inline-flex; align-items: center; gap: 2px; font-size: 12px; color: var(--ink); background: #fff3b0; border: 2px solid var(--ink); border-radius: 999px; padding: 0 5px 0 2px; }
.opt .price .coin { width: 12px; height: 12px; border-width: 1.5px; }
.opt.color { width: 40px; height: 40px; min-height: 0; padding: 0; border-radius: 50%; justify-content: center; }
.opt.color .sw { width: 28px; height: 28px; border-radius: 50%; display: block; border: 2px solid rgba(0,0,0,0.15); }
.opt.color.on { background: #fff; box-shadow: 0 0 0 3px var(--lemon), 0 0 0 6px var(--ink); }
.opt.chip.on::before { content: "✓ "; }
.opt.shake { animation: shake 360ms; }
@keyframes shake { 0%, 100% { transform: none; } 25% { transform: translateX(-6px) rotate(-3deg); } 50% { transform: translateX(6px) rotate(3deg); } 75% { transform: translateX(-3px); } }
#build-btn { width: 100%; }
@media (max-width: 420px) {
  .opts { gap: 5px; }
  .opt.color { width: 35px; height: 35px; }
  .opt.color .sw { width: 25px; height: 25px; }
}
@media (min-width: 760px) {
  #design .wrap { grid-template-rows: none; grid-template-columns: 1fr minmax(380px, 470px); }
  #panel { padding: 8px 20px 20px 8px; }
  #design-name { bottom: 16px; font-size: 22px; }
}

/* factory */
#factory { background: #ffe4d0; }
#fac-cap { position: absolute; left: 50%; top: max(64px, calc(env(safe-area-inset-top) + 58px)); transform: translateX(-50%); z-index: 3; width: max-content; max-width: calc(100% - 32px); text-align: center; font-weight: 900; font-size: 18px; color: #fff; background: rgba(42,33,64,0.88); border: 3px solid var(--lemon); border-radius: 16px; padding: 6px 14px; }
#skip-btn { position: absolute; right: 14px; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 3; }

/* play */
#hint { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 3; width: max-content; max-width: calc(100% - 32px); text-align: center; font-weight: 900; font-size: 15px; background: var(--cream); border: 3px solid var(--ink); border-radius: 14px; padding: 6px 12px; transition: opacity 600ms; pointer-events: none; }
#hint.fade { opacity: 0; }
#stat-wrap { position: absolute; left: 0; right: 0; top: max(62px, calc(env(safe-area-inset-top) + 56px)); z-index: 3; text-align: center; pointer-events: none; }
#stat { display: inline-block; font-size: 14px; }
.dock { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; gap: 8px; justify-content: center; align-items: center; padding: 10px 12px; padding-bottom: max(14px, env(safe-area-inset-bottom)); pointer-events: none; }
.dock > * { pointer-events: auto; }
.dock .btn { font-size: 15px; padding: 9px 12px; }
#flip-btn.ready { background: var(--pink); color: #fff; animation: pulse 600ms infinite alternate; }
@keyframes pulse { to { background: var(--lemon); color: var(--ink); box-shadow: 0 5px 0 var(--ink), 0 0 0 6px rgba(255,111,181,0.45); } }

/* shelf */
#shelf { background: linear-gradient(#ffe3f1, #ffd7c2); }
#shelf .inner { position: absolute; inset: 64px 0 0 0; overflow-y: auto; padding: 4px 12px 24px; }
#shelf-top { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 10px; }
#shelf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; max-width: 900px; margin: 0 auto 14px; }
.slot { position: relative; background: var(--cream); border: 3px solid var(--ink); border-radius: 18px; min-height: 132px; box-shadow: 0 5px 0 #c99db6; }
.slot.empty { border-style: dashed; background: rgba(255,255,255,0.35); box-shadow: none; }
.slot-play { width: 100%; height: 100%; border: 0; background: none; padding: 6px 4px 8px; display: grid; justify-items: center; gap: 2px; font: 900 12px var(--round); line-height: 1.15; }
.slot-play canvas { width: 84px; height: 84px; }
.recycle { position: absolute; right: -6px; top: -8px; min-width: 28px; height: 28px; border-radius: 999px; border: 2.5px solid var(--ink); background: #fff; font: 900 13px var(--round); padding: 0 6px; }
.recycle.sure { background: #ff4d5e; color: #fff; }
#shelf-make { display: block; margin: 0 auto; }

/* pause, toast */
#pause { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(42,33,64,0.55); padding: 16px; }
#pause .card { width: min(360px, 100%); background: var(--cream); border: 4px solid var(--ink); border-radius: 26px; box-shadow: 7px 7px 0 var(--ink); padding: 18px; display: grid; gap: 10px; text-align: center; }
#pause h2 { margin: 0; font-size: 32px; }
#toast { position: fixed; left: 50%; top: max(110px, calc(env(safe-area-inset-top) + 104px)); transform: translateX(-50%); z-index: 30; width: max-content; max-width: calc(100% - 32px); text-align: center; font-weight: 900; font-size: 16px; color: #fff; background: rgba(42,33,64,0.92); border: 3px solid var(--pink); border-radius: 16px; padding: 8px 14px; transition: opacity 400ms; pointer-events: none; }
#toast.fade { opacity: 0; }
</style>
</head>
<body>

<section id="title" class="screen">
  <canvas id="title-cv" class="full"></canvas>
  <div class="card">
    <h1 class="logo" aria-label="Fidget Factory"><span class="a">Fidget</span><span class="b">Factory</span></h1>
    <p class="tagline">Dream up wild fidget toys in a goofy toy workshop, then spin, pop, squish and click them!</p>
    <div class="row-btns">
      <button class="btn big" id="make-btn">Make a fidget</button>
      <button class="btn" id="shelf-btn">My shelf (<span id="shelf-count">0</span>)</button>
    </div>
    <div class="title-meta">
      <span class="pill coins"><i class="coin"></i><b>0</b></span>
      <span class="pill" id="best-line-wrap"><span id="best-line"></span></span>
      <button class="round" data-sound="sfx" aria-label="Sound effects" title="Sound (M)">♪</button>
      <button class="round" data-sound="music" aria-label="Music" title="Music">♫</button>
    </div>
    <p class="credit">Designed by Kiki</p>
  </div>
</section>

<section id="design" class="screen" hidden>
  <div class="bar">
    <button class="round" id="design-back" aria-label="Back to the title screen">◀</button>
    <h2>Toy workshop</h2>
    <span class="pill coins"><i class="coin"></i><b>0</b></span>
  </div>
  <div class="wrap">
    <div id="preview"><canvas id="prev-cv"></canvas><div id="design-name"></div></div>
    <div id="panel">
      <div class="prow"><h3>Kind</h3><div class="opts" data-opts="kind"></div></div>
      <div class="prow"><h3>Colour</h3><div class="opts" data-opts="c1"></div></div>
      <div class="prow"><h3>Second colour</h3><div class="opts" data-opts="c2"></div></div>
      <div class="prow"><h3>Pattern</h3><div class="opts" data-opts="pattern"></div></div>
      <div class="prow"><h3>Shape</h3><div class="opts" data-opts="shape"></div></div>
      <div class="prow"><h3>Extras</h3><div class="opts" data-opts="extras"></div></div>
      <button class="btn big pink" id="build-btn">To the factory!</button>
    </div>
  </div>
</section>

<section id="factory" class="screen" hidden>
  <canvas id="fac-cv" class="full"></canvas>
  <div class="bar">
    <button class="round" id="fac-pause" aria-label="Pause">II</button>
    <span class="spacer"></span>
  </div>
  <div id="fac-cap"></div>
  <button class="btn" id="skip-btn">Skip ▶▶</button>
</section>

<section id="play" class="screen" hidden>
  <canvas id="play-cv" class="full"></canvas>
  <div class="bar">
    <button class="round" id="play-pause" aria-label="Pause">II</button>
    <h2 id="play-name"></h2>
    <span class="pill coins"><i class="coin"></i><b>0</b></span>
  </div>
  <div id="stat-wrap"><span class="pill" id="stat"></span></div>
  <div id="hint"></div>
  <div class="dock">
    <button class="btn" id="play-shelf">Shelf</button>
    <button class="round" id="turn-l" aria-label="Turn the cube left">◀</button>
    <button class="btn" id="flip-btn">Flip it!</button>
    <button class="round" id="lights-btn" aria-label="Lights off">☾</button>
    <button class="round" id="turn-r" aria-label="Turn the cube right">▶</button>
    <button class="btn" id="play-new">New fidget</button>
  </div>
</section>

<section id="shelf" class="screen" hidden>
  <div class="bar">
    <button class="round" id="shelf-back" aria-label="Back to the title screen">◀</button>
    <h2>My shelf</h2>
    <span class="pill coins"><i class="coin"></i><b>0</b></span>
  </div>
  <div class="inner">
    <div id="shelf-top"><span class="pill" id="shelf-n"></span><span class="pill" id="shelf-best"></span></div>
    <div id="shelf-grid"></div>
    <button class="btn big" id="shelf-make">Make a new fidget</button>
  </div>
</section>

<div id="pause" hidden>
  <div class="card">
    <h2>Paused</h2>
    <button class="btn big" id="resume-btn">Keep playing</button>
    <button class="btn" id="restart-btn">Start over</button>
    <button class="btn" id="new-btn">Make a new fidget</button>
    <button class="btn" id="toshelf-btn">My shelf</button>
    <button class="btn" id="title-btn">Title screen</button>
    <div class="row-btns">
      <button class="round" data-sound="sfx" aria-label="Sound effects">♪</button>
      <button class="round" data-sound="music" aria-label="Music">♫</button>
    </div>
  </div>
</div>
<div id="toast" class="fade"></div>

<script src="art.js"></script>
<script src="sound.js"></script>
<script src="game.js"></script>
</body>
</html>
