<title>Stretcher Bearer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: full-bleed canvas battlefield; HUD notes clipped to the corners like a map board; menus are Army Form C.2121 message slips */
:root{
  --mud:#17140f;
  --panel:rgba(21,18,12,.8);
  --rule:rgba(205,191,147,.22);
  --buff:#cdbf93;
  --buff-deep:#b3a477;
  --ink:#231d13;
  --fog:#ece5cf;
  --dim:#a89f86;
  --cross:#b8281f;
  --flare:#e7b24c;
  --gas:#b8c45a;
  --f-display:"IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --f-type:"Special Elite", "Courier New", Courier, monospace;
  --f-ui:"Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:var(--mud);color:var(--fog)}
body{font-family:var(--f-ui);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}

/* ---------- HUD ---------- */
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:4px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#status{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));width:236px;padding:10px 12px;display:grid;gap:7px}
.dayline{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#dayLabel{font-family:var(--f-display);font-size:17px;line-height:1.1;color:var(--fog)}
#clock{font-variant-numeric:tabular-nums;font-weight:600;font-size:15px;color:var(--flare)}
.cbar{height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.cbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e7b24c,#c76b2b);border-radius:3px}
.cbar.night i{background:linear-gradient(90deg,#3c4f7a,#8aa0cf)}
.bars{display:grid;grid-template-columns:66px 1fr;gap:4px 8px;align-items:center;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.bar{height:9px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;transition:width .15s linear}
.bar.hp i{background:#c0392b}.bar.st i{background:#d8b25a}.bar.tent i{background:#9fb27a}.bar.foot i{background:#6f8fa6}.bar.jeep i{background:#8d9160}.bar.coop i{background:#c9a24a}
.inv{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;border-top:1px solid var(--rule);padding-top:7px}
.inv div{display:grid;justify-items:center;gap:1px}
.inv b{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--fog)}
.inv span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.inv .on b{color:var(--gas)}
#coopLine{font-family:var(--f-type);font-size:12.5px;line-height:1.25;color:var(--dim)}
#coopLine b{color:var(--fog);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips:empty{display:none}
.chip{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:2px;background:rgba(184,40,31,.25);border:1px solid rgba(184,40,31,.6);color:#f1c9c3}
#orders{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:calc(256px + env(safe-area-inset-left,0px));width:250px;padding:9px 12px}
#orders h3{margin:0 0 6px;font-family:var(--f-display);font-weight:400;font-size:15px;color:var(--flare);letter-spacing:.03em}
#orders.closed{display:none}
#missionList{list-style:none;margin:0;padding:0;display:grid;gap:6px}
#missionList li{display:grid;grid-template-columns:14px 1fr;gap:7px;font-size:14px;line-height:1.2;color:var(--fog)}
#missionList li .box{width:11px;height:11px;margin-top:2px;border:1.5px solid var(--dim);border-radius:1px;position:relative}
#missionList li.main .box{border-color:var(--flare)}
#missionList li.done{color:var(--dim);text-decoration:line-through}
#missionList li.done .box::after{content:"";position:absolute;inset:1px;background:var(--gas)}
#missionList li.failed{color:#9b7f78}
#missionList li.failed .box::after{content:"×";position:absolute;inset:-5px 0 0 1px;color:#d0675d;font-size:14px}
#missionList small{display:block;color:var(--dim);font-size:12px}
#miniWrap{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));padding:5px}
#mini{display:block;width:220px;height:162px;border-radius:2px}
#score{position:absolute;left:8px;bottom:-22px;font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.05em;white-space:nowrap}
#topBtns{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));top:calc(204px + env(safe-area-inset-top,0px));display:flex;gap:6px}
.ibtn{font:600 13px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--fog);background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:6px 10px;cursor:pointer}
.ibtn:focus-visible,.btn:focus-visible,.tb:focus-visible{outline:2px solid var(--flare);outline-offset:2px}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));display:grid;gap:6px;justify-items:center;align-content:end;pointer-events:none;width:min(460px,calc(100% - 40px))}
.toast{font-family:var(--f-type);font-size:14px;line-height:1.3;color:var(--fog);background:rgba(21,18,12,.86);border-left:3px solid var(--buff-deep);padding:6px 11px;border-radius:2px;animation:tin .25s ease-out;text-align:left}
.toast.alert{border-left-color:var(--gas);color:#eef3c4}
.toast.bad{border-left-color:var(--cross)}
.toast.good{border-left-color:#8fb36a}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
#prompt{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(26px + env(safe-area-inset-bottom,0px));font-family:var(--f-type);font-size:15px;color:var(--ink);background:var(--buff);padding:7px 14px;border-radius:2px;box-shadow:0 3px 0 rgba(0,0,0,.35);pointer-events:none;max-width:calc(100% - 40px);text-align:center}
#prompt:empty{display:none}
#prompt .pbar{display:block;height:4px;margin-top:5px;background:rgba(35,29,19,.2)}
#prompt .pbar i{display:block;height:100%;background:var(--cross)}

/* touch */
#touch{position:fixed;inset:auto 0 0 0;height:0}
#stick{position:fixed;left:calc(22px + env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:132px;height:132px;border-radius:50%;background:rgba(21,18,12,.45);border:1.5px solid var(--rule);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(205,191,147,.55)}
#tbtns{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,60px);grid-auto-rows:60px;gap:8px;
  grid-template-areas:"mask meds load" "coop run fire" "act act fire"}
.tb{border-radius:50%;border:1.5px solid var(--rule);background:rgba(21,18,12,.6);color:var(--fog);font:700 13px var(--f-ui);letter-spacing:.05em;text-transform:uppercase;touch-action:none;padding:0}
#tMask{grid-area:mask}#tMed{grid-area:meds}#tReload{grid-area:load}#tCoop{grid-area:coop}#tRun{grid-area:run}
#tAct{grid-area:act;border-radius:30px;background:rgba(205,191,147,.85);color:var(--ink)}
#tFire{grid-area:fire;border-radius:30px;background:rgba(184,40,31,.55);border-color:rgba(255,200,190,.4)}
.tb.held{filter:brightness(1.4)}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;display:grid;place-items:center;overflow-y:auto;background:rgba(14,11,7,.66);
  padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.form{width:100%;max-width:600px;background:var(--buff);color:var(--ink);font-family:var(--f-type);font-size:15px;line-height:1.5;
  padding:22px 26px 24px;border-radius:2px;box-shadow:0 18px 40px rgba(0,0,0,.55);position:relative;
  background-image:repeating-linear-gradient(0deg,transparent 0 29px,rgba(35,29,19,.09) 29px 30px)}
.form-head{display:flex;justify-content:space-between;gap:12px;font-family:var(--f-ui);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#5d5236;border-bottom:1.5px solid var(--ink);padding-bottom:6px}
.form h2{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.1;margin:12px 0 10px;text-wrap:balance}
.form h3{font-family:var(--f-display);font-weight:400;font-size:19px;margin:16px 0 6px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:0 0 12px;border:1px solid rgba(35,29,19,.5)}
.fields div{padding:4px 8px;border:1px solid rgba(35,29,19,.25);min-width:0}
.fields dt{font-family:var(--f-ui);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#6c6143}
.fields dd{margin:0}
.msg{margin:8px 0}
.new{background:rgba(184,40,31,.12);border-left:3px solid var(--cross);padding:6px 10px;margin:10px 0}
.olist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.olist li{display:grid;grid-template-columns:18px 1fr;gap:8px}
.olist .box{width:13px;height:13px;border:1.5px solid var(--ink);margin-top:4px}
.olist .tag{font-family:var(--f-ui);font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--cross)}
.olist .side{color:#6c6143}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{font-family:var(--f-display);font-size:19px;color:var(--buff);background:var(--ink);border:none;border-radius:2px;padding:9px 20px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.stamp{position:absolute;right:22px;top:58px;transform:rotate(-9deg);font-family:var(--f-ui);font-weight:700;letter-spacing:.12em;font-size:14px;text-transform:uppercase;color:var(--cross);border:2.5px solid var(--cross);padding:3px 9px;opacity:.75}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:12px 0}
.stats div{border:1px solid rgba(35,29,19,.4);padding:6px 9px}
.stats b{display:block;font-family:var(--f-ui);font-weight:700;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-family:var(--f-ui);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#6c6143}

.title{width:100%;max-width:780px;display:grid;gap:18px}
.title h1{font-family:var(--f-display);font-weight:400;font-size:clamp(46px,10vw,92px);line-height:.92;margin:0;color:var(--fog);text-wrap:balance;text-shadow:0 4px 18px rgba(0,0,0,.6)}
.title h1 em{font-style:normal;color:var(--cross)}
.credit{font-family:var(--f-type);color:var(--buff);font-size:15px;margin:0}
.title .form{max-width:none}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:6px 18px;margin:8px 0 0;font-size:14px}
.keys div{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
kbd{font-family:var(--f-ui);font-weight:700;font-size:12px;letter-spacing:.06em;background:var(--ink);color:var(--buff);padding:1px 6px;border-radius:2px;white-space:nowrap}
.best{font-family:var(--f-ui);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#6c6143;margin-top:10px}

@media (max-width:820px){
  #orders{display:none}
  #orders.open{display:block;left:calc(10px + env(safe-area-inset-left,0px));top:calc(262px + env(safe-area-inset-top,0px));width:236px}
  #toasts{bottom:calc(230px + env(safe-area-inset-bottom,0px))}
  #prompt{bottom:calc(196px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:560px){
  #status{width:196px;padding:8px 10px;gap:5px}
  #dayLabel{font-size:15px}
  .inv b{font-size:15px}
  #mini{width:132px;height:97px}
  #topBtns{top:calc(136px + env(safe-area-inset-top,0px));flex-direction:column;align-items:flex-end}
  #orders.open{top:calc(250px + env(safe-area-inset-top,0px));width:196px}
  .form{padding:18px 18px 20px}
  .form h2{font-size:24px}
  .fields{grid-template-columns:1fr}
  #tbtns{grid-template-columns:repeat(3,52px);grid-auto-rows:52px;gap:7px}
  #stick{width:116px;height:116px}
}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.btn:hover{transform:none}}

/* ================= static world ================= */
const ST={lines:[],segs:[],segG:null,lbG:null,brG:null,blotches:[],tufts:[],houses:[],ladders:[],bridges:[],L:{}};
function G(cell){return{c:cell,m:new Map()}}
function gAdd(g,o,x,y){const k=((Math.max(0,x)/g.c)|0)*4096+((Math.max(0,y)/g.c)|0);let a=g.m.get(k);if(!a){a=[];g.m.set(k,a)}a.push(o)}
function gAny(g,x,y,r,fn){const c=g.c;const i0=Math.max(0,((x-r)/c)|0),i1=Math.max(0,((x+r)/c)|0),j0=Math.max(0,((y-r)/c)|0),j1=Math.max(0,((y+r)/c)|0);
  for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++){const a=g.m.get(i*4096+j);if(a)for(let k=0;k<a.length;k++)if(fn(a[k]))return true}return false}
function crenel(x0,x1,y,dep,bay){const p=[];let up=false;for(let x=x0;x<x1;x+=bay){const yy=y-(up?dep:0);p.push([x,yy],[Math.min(x+bay,x1),yy]);up=!up}return p}
function zig(x,y0,y1,R){const p=[];const n=Math.max(2,Math.round(Math.abs(y1-y0)/72));for(let i=0;i<=n;i++){const y=y0+(y1-y0)*i/n;const off=(i===0||i===n)?0:(i%2?1:-1)*(20+R()*14);p.push([x+off,y])}return p}
function wavy(x0,x1,y,R){const p=[];for(let x=x0;x<=x1;x+=120)p.push([x,y+Math.sin(x*0.004)*28+(R()-.5)*16]);return p}
function yAt(li,x){const p=ST.lines[li].pts;for(let i=0;i<p.length-1;i++)if(x>=p[i][0]&&x<=p[i+1][0]){const t=(x-p[i][0])/((p[i+1][0]-p[i][0])||1);return p[i][1]+(p[i+1][1]-p[i][1])*t}return p[0][1]}
function buildStatic(){
  const R=mulberry(77);
  const A=(pts,side)=>{ST.lines.push({pts,side});return ST.lines.length-1};
  const L=ST.L;
  L.gres=A(wavy(60,W-60,380,R),'G');
  L.gsup=A(wavy(60,W-60,720,R),'G');
  L.gfront=A(crenel(-15,W+40,1050,-36,110),'G');
  L.gcomm=[900,2100,3300,4500,5600].map(x=>A(zig(x,yAt(L.gsup,x),1068,R),'G'));
  L.gcomm2=[1500,3900,5100].map(x=>A(zig(x,yAt(L.gres,x),yAt(L.gsup,x),R),'G'));
  L.gsap=A(zig(3900,1068,1320,R),'G');
  L.afront=A(crenel(-15,W+40,2950,36,110),'A');
  L.asup=A(wavy(60,W-60,3260,R),'A');
  L.acomm=[700,1700,2600,3400,4300,5300].map(x=>A(zig(x,yAt(L.asup,x),2932,R),'A'));
  L.asap=A(zig(2200,2932,2680,R),'A');
  ST.segG=G(120);
  ST.lines.forEach((Ln,li)=>{for(let i=0;i<Ln.pts.length-1;i++){const [x1,y1]=Ln.pts[i],[x2,y2]=Ln.pts[i+1];const s={id:ST.segs.length,x1,y1,x2,y2,side:Ln.side,li};ST.segs.push(s);
    const c=ST.segG.c,m=60;for(let gi=Math.max(0,((Math.min(x1,x2)-m)/c)|0);gi<=((Math.max(x1,x2)+m)/c|0);gi++)for(let gj=Math.max(0,((Math.min(y1,y2)-m)/c)|0);gj<=((Math.max(y1,y2)+m)/c|0);gj++){const k=gi*4096+gj;let a=ST.segG.m.get(k);if(!a){a=[];ST.segG.m.set(k,a)}a.push(s)}}});
  // ladders and bridges
  const along=(li,spacing,off,fn)=>{const P=ST.lines[li].pts;let acc=0,next=off,k=0;for(let i=0;i<P.length-1;i++){const [x1,y1]=P[i],[x2,y2]=P[i+1],l=hyp(x2-x1,y2-y1);
    while(next<=acc+l){const t=(next-acc)/l;if(l>=56&&t>.2&&t<.8)fn(x1+(x2-x1)*t,y1+(y2-y1)*t,x1,y1,x2,y2,k++);next+=spacing}acc+=l}};
  const ladder=dir=>(x,y,x1,y1,x2,y2,k)=>{const l=hyp(x2-x1,y2-y1);let nx=-(y2-y1)/l,ny=(x2-x1)/l;let d=dir;if(d==='ns')d=k%2?'n':'s';if(d==='ew')d=k%2?'e':'w';
    const w={n:[0,-1],s:[0,1],e:[1,0],w:[-1,0]}[d];if(nx*w[0]+ny*w[1]<0){nx=-nx;ny=-ny}ST.ladders.push({x,y,nx,ny,cx:x+nx*14,cy:y+ny*14})};
  const bridge=veh=>(x,y,x1,y1,x2,y2)=>ST.bridges.push({x,y,a:Math.atan2(y2-y1,x2-x1),w:veh?68:36,len:veh?92:80,veh:!!veh});
  along(L.afront,150,80,ladder('n'));along(L.afront,420,290,ladder('s'));
  along(L.asup,300,120,ladder('ns'));
  for(const li of L.acomm)along(li,140,90,ladder('ew'));
  along(L.asap,110,150,ladder('ew'));
  along(L.gfront,300,150,ladder('s'));along(L.gfront,520,300,ladder('n'));
  along(L.gsup,400,200,ladder('ns'));along(L.gres,600,300,ladder('ns'));
  for(const li of L.gcomm.concat(L.gcomm2))along(li,160,100,ladder('ew'));
  along(L.gsap,110,130,ladder('ew'));
  along(L.afront,560,330,bridge(false));along(L.asup,520,260,bridge(false));
  for(const li of L.acomm)along(li,1000,150,bridge(false));
  along(L.gfront,700,350,bridge(false));along(L.gsup,700,350,bridge(false));along(L.gres,900,450,bridge(false));
  for(const li of L.gcomm.concat(L.gcomm2))along(li,1000,160,bridge(false));
  for(const li of [L.afront,L.asup,L.gfront,L.gsup,L.gres]){let best=null,bc=1e9;
    for(const s of ST.segs){if(s.li!==li)continue;const l=hyp(s.x2-s.x1,s.y2-s.y1);if(l<80||Math.abs(s.x2-s.x1)<Math.abs(s.y2-s.y1))continue;
      const rx=roadX(s.y1),px=clamp(rx,Math.min(s.x1,s.x2)+38,Math.max(s.x1,s.x2)-38),c=Math.abs(px-rx);if(c<bc){bc=c;best={s,px}}}
    if(best){const s=best.s,t=(best.px-s.x1)/(s.x2-s.x1);bridge(true)(best.px,s.y1+(s.y2-s.y1)*t,s.x1,s.y1,s.x2,s.y2)}}
  ST.lbG=G(120);for(const l of ST.ladders)gAdd(ST.lbG,l,l.cx,l.cy);
  ST.brG=G(120);for(const b of ST.bridges)gAdd(ST.brG,b,b.x,b.y);
  // houses
  let hid=0;for(const b of NAMED)ST.houses.push({...b,id:hid++,k:R(),town:!!b.town});
  const overlaps=(x,y,w,h)=>ST.houses.some(o=>x<o.x+o.w+12&&x+w+12>o.x&&y<o.y+o.h+12&&y+h+12>o.y);
  const fill=(x0,y0,x1,y1)=>{const dep=70+R()*22;const rows=(y1-y0)>2*dep+30?[[y0,'n'],[y1-dep,'s']]:[[y1-dep,'s']];
    for(const [yy,door] of rows){let x=x0;while(x<x1-60){const w=Math.min(80+R()*48,x1-x);if(w<60)break;if(!overlaps(x,yy,w,dep))ST.houses.push({id:hid++,x,y:yy,w,h:dep,door,k:R(),town:1});x+=w+16}}};
  fill(2300,3655,2840,3820);fill(3345,3475,3830,3820);fill(2300,3900,2870,4290);fill(2935,3900,3830,4290);
  for(let i=0;i<1700;i++)ST.blotches.push({x:R()*W,y:R()*H,r:30+R()*110,k:(R()*4)|0});
  for(let i=0;i<4800;i++)ST.tufts.push({x:R()*W,y:R()*H,a:R()*TAU,k:R()});
}
function trenchSeg(x,y,r){r=r||23;let hit=null;gAny(ST.segG,x,y,0,s=>{if(segD2(x,y,s.x1,s.y1,s.x2,s.y2)<r*r){hit=s;return true}return false});return hit}
function tDist(x,y){let m=1e9;gAny(ST.segG,x,y,0,s=>{const d=segD2(x,y,s.x1,s.y1,s.x2,s.y2);if(d<m)m=d;return false});return Math.sqrt(m)}
function ladderAt(x,y){return gAny(ST.lbG,x,y,40,l=>hyp(l.cx-x,l.cy-y)<26)}
function inBridge(b,x,y){const dx=x-b.x,dy=y-b.y,c=Math.cos(b.a),s=Math.sin(b.a);return Math.abs(dx*c+dy*s)<b.w/2&&Math.abs(-dx*s+dy*c)<b.len/2}
function bridgeAt(x,y,veh){return gAny(ST.brG,x,y,60,b=>(!veh||b.veh)&&inBridge(b,x,y))}

const reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function yearOf(d){return Math.min(4,Math.floor((d-1)/3))}
function dayLen(){return 180}

function rebuildGrids(){treeG=G(100);for(const t of S.trees)gAdd(treeG,t,t.x,t.y);craterG=G(150);for(const c of S.craters)gAdd(craterG,c,c.x,c.y);rebuildWalls()}
function rebuildWalls(){wallG=G(100);for(const w of S.walls)gAdd(wallG,w,w.x+w.w/2,w.y+w.h/2)}
function craterRoom(x,y,r){return !gAny(craterG,x,y,90,o=>hyp(o.x-x,o.y-y)<Math.max(o.r,r)*.75)}
function addCrater(c){if(S.craters.length>900||!craterRoom(c.x,c.y,c.r))return;S.craters.push(c);gAdd(craterG,c,c.x,c.y)}
function inBld(x,y,m){return ST.houses.some(b=>x>b.x-m&&x<b.x+b.w+m&&y>b.y-m&&y<b.y+b.h+m)}
const inTown=(x,y,m)=>x>TOWN.x0-m&&x<TOWN.x1+m&&y>TOWN.y0-m&&y<TOWN.y1+m;
const onRoad=(x,y,m)=>Math.abs(y-roadY(x))<m||(y>1080&&Math.abs(x-roadX(y))<m);

function newGame(){
  const R=mulberry(1914);
  S={day:1,year:0,phase:'day',t:0,nid:1000,cam:{x:TENT.x,y:TENT.y-200},shake:0,
    player:{x:TENT.x,y:TENT.y+70,r:12,face:-Math.PI/2,hp:100,hpMax:100,st:100,band:6,bandMax:6,ammo:6,reserve:30,reserveMax:30,meds:1,mask:false,carry:null,reload:0,fireCd:0,foot:0,ills:{dys:0,fever:0,flu:0},treatTime:1.6,hurt:0,moving:0,inTent:false,cov:false,tr:false,inT:false,inJeep:false,blockT:0},
    asst:null,jeep:null,jeepMax:100,
    trees:[],craters:[],mud:[],wire:[],walls:[],bunkers:[],wet:new Array(ST.segs.length).fill(0),hs:ST.houses.map(()=>2),
    patients:[],enemies:[],friends:[],items:[],bullets:[],shells:[],gas:[],flares:[],fx:[],planes:[],missions:[],
    tent:{hp:100,max:100},stats:{saved:0,lost:0,kills:0,sides:0,mains:0,vips:0,pilots:0},today:{},perks:{dog:false},
    timers:{},msgT:{}};
  const ok=(x,y,road)=>x>20&&y>20&&x<W-20&&y<H-20&&tDist(x,y)>48&&!inBld(x,y,24)&&!inTown(x,y,30)&&(road||!onRoad(x,y,40));
  const add=(x,y,r,road)=>{if(ok(x,y,road))S.trees.push({x,y,r:r||(17+R()*12),s:2,k:R()})};
  for(const wd of WOODS)for(let i=0;i<wd.n;i++){const a=R()*TAU,d=Math.sqrt(R())*wd.r;add(wd.x+Math.cos(a)*d,wd.y+Math.sin(a)*d*0.85)}
  for(let i=0;i<140;i++)add(R()*W,1250+R()*1500);
  for(let i=0;i<320;i++)add(R()*W,40+R()*960);

  for(let x=60;x<W;x+=90){if(x>TOWN.x0-80&&x<TOWN.x1+80)continue;add(x,roadY(x)-46,15,1);add(x+45,roadY(x+45)+46,15,1)}
  for(let y=1250;y<2850;y+=90){add(roadX(y)-46,y,14,1);add(roadX(y+45)+46,y+45,14,1)}
  for(let x=2300;x<=2540;x+=60)for(let y=1660;y<=1840;y+=60)add(x+R()*8,y+R()*8,14);
  for(const b of ST.houses){const T=b.name?14:12,s=28;
    const door=(ex,ey)=>{const cx=b.x+b.w/2,cy=b.y+b.h/2;if(b.door==='s')return ey>b.y+b.h-T-1&&Math.abs(ex-cx)<26;if(b.door==='n')return ey<b.y+1&&Math.abs(ex-cx)<26;if(b.door==='e')return ex>b.x+b.w-T-1&&Math.abs(ey-cy)<26;return ex<b.x+1&&Math.abs(ey-cy)<26};
    for(let x=b.x;x<b.x+b.w;x+=s){const w=Math.min(s,b.x+b.w-x);if(!door(x+w/2,b.y))S.walls.push({x,y:b.y,w,h:T,hid:b.id});if(!door(x+w/2,b.y+b.h-T))S.walls.push({x,y:b.y+b.h-T,w,h:T,hid:b.id})}
    for(let y=b.y+T;y<b.y+b.h-T;y+=s){const h=Math.min(s,b.y+b.h-T-y);if(!door(b.x,y+h/2))S.walls.push({x:b.x,y,w:T,h,hid:b.id});if(!door(b.x+b.w-T+1,y+h/2))S.walls.push({x:b.x+b.w-T,y,w:T,h,hid:b.id})}
  }
  addWireBelt(2830,R,[2200,roadX(2830)]);addWireBelt(1150,R,[3900,roadX(1150)]);
  for(let i=0;i<40;i++)S.craters.push({x:R()*W,y:1250+R()*1500,r:20+R()*18,wet:false});

function addWireBelt(y,R,gaps){let x=60;while(x<W-60){const len=200+R()*230;let x2=Math.min(W-60,x+len);const g=gaps.find(gx=>gx>x-60&&gx<x2+60);if(g){if(g-60>x)S.wire.push({x,y,w:g-60-x,h:34});x=g+60;continue}S.wire.push({x,y,w:x2-x,h:34});x=x2+70+R()*90}}
function bunkersFor(y){
  const L=[];const mk=(x,kind)=>L.push({id:S.nid++,x:x-37,y:1092,w:74,h:44,kind,cd:rand(1,3),burst:0,bt:0,aim:0,sw:0});
  if(y===1){mk(1800,'nest');mk(4300,'nest')}
  if(y>=2){[950,2250,3500,4800].forEach(x=>mk(x,'bunker'))}
  if(y>=3)mk(1600,'bunker');
  if(y>=4)mk(5500,'bunker');
  return L;
}
function damageHouse(i,noRebuild){const s=S.hs[i];if(s<=0)return false;S.hs[i]=s-1;const f=s===2?.3:.55;S.walls=S.walls.filter(w=>w.hid!==i||Math.random()>f);if(!noRebuild)rebuildWalls();return true}
function devastate(y){
  const loss=[0,.3,.45,.6,.55][y];
  for(const t of S.trees){let f=t.y>3000?.3:t.y<1000?.7:1;if(Math.random()<loss*f)t.s=Math.max(0,t.s-1);if(y>=3&&t.y>1000&&t.y<2950&&Math.random()<.5)t.s=Math.max(0,t.s-1)}
  const n=[0,80,130,150,100][y],wetP=[0,0,.25,.6,.5][y];
  craterG=G(150);for(const c of S.craters)gAdd(craterG,c,c.x,c.y);
  for(let i=0;i<n;i++){const yy=Math.random()<.8?rand(1180,2880):rand(700,3350);addCrater({x:rand(40,W-40),y:yy,r:rand(22,48),wet:Math.random()<wetP})}
  const mudN=[0,0,14,32,14][y];for(let i=0;i<mudN;i++)S.mud.push({x:rand(100,W-100),y:rand(1220,2850),r:rand(70,160)});
  const wetF=[0,0,.1,.45,.3][y];for(let i=0;i<S.wet.length;i++)if(Math.random()<wetF)S.wet[i]=1;
  if(y===2){const R=mulberry(1916);addWireBelt(2775,R,[2200,roadX(2775)]);addWireBelt(1205,R,[3900,roadX(1205)])}
  if(y>=3)for(let i=0;i<16;i++){const x=rand(150,W-350);if(Math.abs(x-roadX(1800))<260)continue;S.wire.push({x,y:rand(1300,2650),w:rand(90,200),h:30})}
  for(const h of ST.houses){const p=h.town?[0,.18,.32,.45,.45][y]:[0,.55,.6,.7,.7][y];if(Math.random()<p)damageHouse(h.id,true);if(!h.town&&y>=2&&Math.random()<.5)damageHouse(h.id,true)}
  S.bunkers=bunkersFor(y);
  rebuildGrids();
}

/* ================= world queries ================= */
function craterAt(x,y){let c=null;gAny(craterG,x,y,75,o=>{if(hyp(o.x-x,o.y-y)<o.r*.85){c=o;return true}return false});return c}
function canopyAt(x,y){return gAny(treeG,x,y,35,t=>t.s===2&&hyp(t.x-x,t.y-y)<t.r*.85)}
function trunkAt(x,y,r){return gAny(treeG,x,y,r+12,t=>t.s>=1&&hyp(t.x-x,t.y-y)<r+6)}
function wallAt(x,y){return gAny(wallG,x,y,40,w=>x>=w.x&&x<=w.x+w.w&&y>=w.y&&y<=w.y+w.h)}
function bunkerAt(x,y,skip){return S.bunkers.some(b=>b.id!==skip&&x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h)}
function mudAt(x,y){return S.mud.some(m=>hyp(m.x-x,m.y-y)<m.r)}
function wireAt(x,y){return S.wire.some(w=>x>=w.x&&x<=w.x+w.w&&y>=w.y+4&&y<=w.y+w.h-4)}
function wetAt(x,y){const s=trenchSeg(x,y);if(s&&S.wet[s.id])return true;const c=craterAt(x,y);if(c&&c.wet)return true;return mudAt(x,y)}
function gasAt(x,y){return S.gas.some(g=>hyp(g.x-x,g.y-y)<g.r*.8)}
function lit(x,y){return S.flares.some(f=>hyp(f.x-x,f.y-y)<330*Math.min(1,f.t/2))}
function solid(x,y,skip){return wallAt(x,y)||bunkerAt(x,y,skip)}
function freeAt(x,y){return !solid(x,y)&&!trunkAt(x,y,10)&&!wireAt(x,y)&&x>40&&y>40&&x<W-40&&y<H-40}
function los(ax,ay,bx,by){const dx=bx-ax,dy=by-ay,d=hyp(dx,dy),n=Math.ceil(d/22);let leaf=0;
  for(let i=1;i<n;i++){const x=ax+dx*i/n,y=ay+dy*i/n;if(solid(x,y))return false;if(canopyAt(x,y)&&++leaf>=4)return false}return true}
function scramble(e){return tDist(e.x,e.y)<30&&!ladderAt(e.x,e.y)&&!bridgeAt(e.x,e.y,false)?.5:1}
function pushRect(e,rx,ry,rw,rh){const cx=clamp(e.x,rx,rx+rw),cy=clamp(e.y,ry,ry+rh);const dx=e.x-cx,dy=e.y-cy,d2=dx*dx+dy*dy;if(d2>=e.r*e.r)return;
  if(d2>1e-4){const d=Math.sqrt(d2);e.x=cx+dx/d*e.r;e.y=cy+dy/d*e.r}else{const l=e.x-rx,r=rx+rw-e.x,t=e.y-ry,b=ry+rh-e.y,m=Math.min(l,r,t,b);if(m===l)e.x=rx-e.r;else if(m===r)e.x=rx+rw+e.r;else if(m===t)e.y=ry-e.r;else e.y=ry+rh+e.r}}
function collide(e){
  e.x=clamp(e.x,e.r,W-e.r);e.y=clamp(e.y,e.r,H-e.r);
  gAny(wallG,e.x,e.y,e.r+40,w=>{pushRect(e,w.x,w.y,w.w,w.h);return false});
  for(const b of S.bunkers)pushRect(e,b.x,b.y,b.w,b.h);
  gAny(treeG,e.x,e.y,e.r+14,t=>{if(t.s>=1){const dx=e.x-t.x,dy=e.y-t.y,d=hyp(dx,dy),m=e.r+7;if(d<m&&d>0.01){e.x=t.x+dx/d*m;e.y=t.y+dy/d*m}}return false});
}
// trench rules: you can only climb in or out at a ladder, and only cross over on a bridge
function stepTo(e,nx,ny){
  const d=tDist(nx,ny);
  if(ladderAt(nx,ny)){e.x=nx;e.y=ny;e.inT=d<22;return true}
  if(e.inT){if(d<=21){e.x=nx;e.y=ny;return true}return false}
  if(d>=30||bridgeAt(nx,ny,false)){e.x=nx;e.y=ny;return true}
  return false;
}

const K={};let act={pressed:false,held:false},mouse={x:0,y:0,down:false,active:false},stick={x:0,y:0,on:false,id:null},tch={fire:false,run:false};
function update(dt){
  const P=S.player,night=S.phase==='night',truce=S.day===3;
  S.t+=dt;
  if(S.phase==='day'&&S.t>=dayLen()){if(S.day>=15){victory();return}startNight()}
  else if(night&&S.t>=nightLen()){endNight();return}
  updPlayer(dt);updJeep(dt);updAsst(dt);updPatients(dt);updEnemies(dt);updBunkers(dt);updFriends(dt);updBullets(dt);updItems(dt);updPlanes(dt);
  if(!truce&&Math.random()<ART[S.year]*(night?.35:1)*dt)spawnShell();
  if(!truce&&Math.random()<.12*dt)sfx('far',.12);
  for(const s of S.shells){s.t-=dt;if(s.t<=0){explode(s.x,s.y);s.dead=1}}S.shells=S.shells.filter(s=>!s.dead);
  if(S.timers.gas>0&&!night&&S.t>=S.timers.gas){S.timers.gas=-1;gasAttack()}
  for(const g of S.gas){g.x+=g.vx*dt;g.y+=g.vy*dt;g.r+=1.6*dt;g.life-=dt}S.gas=S.gas.filter(g=>g.life>0);
  if(S.timers.dayRaid>0&&!night&&S.t>=S.timers.dayRaid){S.timers.dayRaid=-1;const cx=clamp(P.x,400,W-400);for(let i=0;i<3+(S.year>3?1:0);i++)mkEnemy('raider',cx+rand(-350,350),rand(2600,2740));toast('Trench raid! Germans are attacking the front trench.','alert')}
  // battles
  if(!night&&!truce){S.timers.attack-=dt;if(S.timers.attack<=0){S.timers.attack=rand(40,65);assault()}
    if(S.timers.gattack>0){S.timers.gattack-=dt;if(S.timers.gattack<=0){S.timers.gattack=rand(60,95);counterAttack()}}}
  // wounded appear over time, day and night
  if(!truce||!night){S.timers.pat-=dt;if(S.timers.pat<=0){S.timers.pat=night?rand(18,28):rand(24,36);if(activePatients()<14){spawnPatient();toast('Stretcher bearer! A man is down out there.','','sb')}}}
  S.timers.patrol-=dt;if(S.timers.patrol<=0){S.timers.patrol=rand(16,26);const n=S.enemies.filter(e=>e.type==='rifle'&&!e.sentry&&!e.dead).length;if(n<PATROLS[S.year]){const h=randomSpot('far');mkEnemy('rifle',clamp(h.x+rand(-200,200),100,W-100),1080,{hx:h.x,hy:h.y,wr:260})}}
  if(night&&!truce){S.timers.raid-=dt;if(S.timers.raid<=0&&S.t<nightLen()-14){S.timers.raid=rand(12,16);const n=2+S.year+(S.day===13?3:0);
      for(let i=0;i<n;i++)mkEnemy('raider',clamp(TENT.x+rand(-1800,1800),80,W-80),rand(2560,2740),{tent:true});toast('Raiders crossing the wire!','alert','raid')}
    S.timers.flare-=dt;if(S.timers.flare<=0){S.timers.flare=rand(5,9);S.flares.push({x:clamp(P.x+rand(-450,450),100,W-100),y:clamp(P.y+rand(-350,250),1150,3000),t:8,max:8})}}
  for(const f of S.flares)f.t-=dt;S.flares=S.flares.filter(f=>f.t>0);
  for(const f of S.fx){f.t-=dt;if(f.vx){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.96;f.vy*=.96}}S.fx=S.fx.filter(f=>f.t>0);
  S.shake=Math.max(0,S.shake-dt*30);
  if(eng){eng.o.frequency.value=38+Math.abs(S.jeep.v)*.17;eng.g.gain.value=muted?0:.05}
  checkMissions();
  if(P.hp<=0){gameOver('You were badly wounded and carried off the field yourself.');return}
  if(S.tent.hp<=0){gameOver('The Germans overran the aid tent.');return}
}
function updPlayer(dt){
  const P=S.player;P.hurt=Math.max(0,P.hurt-dt);
  let ix=(K.right?1:0)-(K.left?1:0),iy=(K.down?1:0)-(K.up?1:0);
  if(stick.on){ix=stick.x;iy=stick.y}
  let m=hyp(ix,iy);if(m>0){ix/=m;iy/=m}m=Math.min(1,m);
  S.input={ix,iy,m};
  if(P.inJeep){P.st=Math.min(100,P.st+15*dt);P.foot=Math.max(0,P.foot-.5*dt);P.moving=Math.abs(S.jeep.v);P.cov=false;P.tr=false;P.canopy=false;P.inT=false}
  else{
    if(S.treat)m=0;
    const wet=wetAt(P.x,P.y),wire=wireAt(P.x,P.y);
    let sp=160;
    if((K.shift||tch.run)&&m>.1&&P.st>2&&!P.carry){sp=250;P.st=Math.max(0,P.st-26*dt)}else P.st=Math.min(100,P.st+(P.ills.dys?6:15)*dt*(m>.1?.7:1));
    if(P.carry)sp*=.62;if(P.foot>60)sp*=.72;if(wet)sp*=.58;if(P.mask)sp*=.9;if(P.ills.flu)sp*=.86;
    if(wire){sp*=.35;P.hp-=4*dt;toast('Snagged on the barbed wire!','bad','wire')}
    const cd=tDist(P.x,P.y);let free=false;
    if(P.inT){if(cd>21.5&&!ladderAt(P.x,P.y)){if(cd>=30)P.inT=false;else free=true}}
    else if(cd<30&&!bridgeAt(P.x,P.y,false)&&!ladderAt(P.x,P.y)){if(cd<22)P.inT=true;else free=true}
    const dx=ix*sp*m*dt,dy=iy*sp*m*dt;
    if(free){if(tDist(P.x+dx,P.y+dy)>=cd){P.x+=dx;P.y+=dy}}
    else if(m>0){const blocked=moveTrench(P,dx,dy);if(blocked&&m>.3){P.blockT+=dt;if(P.blockT>.45)toast('You can only climb in or out of a trench at a ladder, or cross it on a bridge.','','trenchhint')}else P.blockT=0}
    collide(P);P.moving=sp*m;P.tr=P.inT;P.cov=P.inT||!!craterAt(P.x,P.y);P.canopy=canopyAt(P.x,P.y);
    if(wet&&!P.inTent)P.foot=Math.min(100,P.foot+4.5*dt);else P.foot=Math.max(0,P.foot-.5*dt);
    if(P.foot>60)toast('Trench foot! Your feet are soaked. Dry off at the aid tent.','bad','foot');
  }
  if(mouse.active){const w=screenToWorld(mouse.x,mouse.y);P.face=Math.atan2(w.y-P.y,w.x-P.x)}else if(P.inJeep)P.face=S.jeep.a;else if(m>.1)P.face=Math.atan2(iy,ix);
  const inTent=hyp(P.x-TENT.x,P.y-TENT.y)<TENT.r;
  if(inTent){if(!P.inTent&&(P.band<P.bandMax||P.reserve<P.reserveMax||P.ammo<6))toast('Restocked bandages and ammunition at the aid tent.','good');
    P.band=P.bandMax;P.reserve=P.reserveMax;if(P.reload<=0)P.ammo=6;P.hp=Math.min(P.hpMax,P.hp+7*dt);if(P.foot>5){P.foot=Math.max(0,P.foot-28*dt);if(P.foot>20)toast('Changing into dry socks.','good','socks')}}
  P.inTent=inTent;
  P.fireCd-=dt;
  if(P.reload>0){P.reload-=dt;if(P.reload<=0){const n=Math.min(6-P.ammo,P.reserve);P.ammo+=n;P.reserve-=n}}
  if(K.reload){K.reload=false;startReload()}
  const want=mouse.down||K.space||tch.fire;
  if(want&&P.fireCd<=0&&P.reload<=0&&!S.treat){
    if(P.ammo>0){let a=P.face;if(tch.fire){const t=autoAim();if(t){a=P.face=Math.atan2(t.y-P.y,t.x-P.x)}}
      shoot(P.x,P.y,a,'P',{spd:900,dmg:1,spread:.035});P.ammo--;P.fireCd=P.inJeep?.45:P.carry?.6:.3;sfx('shot')}
    else if(P.reserve>0)startReload();
    else{toast('Out of ammunition. Restock at the aid tent.','bad','ammo');P.fireCd=.5}}
  if(gasAt(P.x,P.y)&&!P.mask){P.hp-=9*dt;toast('Choking on gas! Put on your mask: press G or tap Mask.','alert','gasmask')}
  if(P.ills.fever&&P.hp>15)P.hp-=.22*dt;
  if(P.ills.flu&&P.hp>10)P.hp-=.45*dt;
  interact(dt);
}
function startReload(){const P=S.player;if(P.reload>0||P.ammo>=6)return;if(P.reserve<=0){toast('No spare rounds. Restock at the aid tent.','bad','ammo');return}P.reload=1.5;sfx('click')}

/* ---------- jeep ---------- */
let eng=null;
function engine(on){if(!AC)return;if(on&&!eng){try{const o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();o.type='sawtooth';o.frequency.value=40;f.type='lowpass';f.frequency.value=320;g.gain.value=0;o.connect(f);f.connect(g);g.connect(master);o.start();eng={o,g}}catch(e){}}
  else if(!on&&eng){try{eng.o.stop()}catch(e){}eng=null}}
function enterJeep(){const P=S.player;P.inJeep=true;P.inT=false;P.x=S.jeep.x;P.y=S.jeep.y;engine(true);sfx('click');toast('Driving! Steer with the arrow keys or WASD. Roads are fastest; trenches can only be crossed on the big road bridges.','','jeephelp')}
function exitJeep(force){const P=S.player,J=S.jeep;const c=Math.cos(J.a),s=Math.sin(J.a);
  const tries=[[-s*38,c*38],[s*38,-c*38],[-c*46,-s*46],[c*46,s*46]];for(let r=1;r<=(force?6:1);r++)for(const [ox,oy] of tries){const x=J.x+ox*r,y=J.y+oy*r;if(playerSpotOk(x,y)){P.x=x;P.y=y;P.inJeep=false;P.inT=false;engine(false);return true}}
  if(force){P.inJeep=false;engine(false);return true}
  toast('No room to climb out here.','','noexit');return false}
function jeepSurface(x,y){if(mudAt(x,y))return .4;const c=craterAt(x,y);if(c)return c.wet?.45:.7;if(onRoad(x,y,26)||inTown(x,y,0))return 1.15;return 1}
function jeepOk(x,y,a){const c=Math.cos(a),s=Math.sin(a);
  for(const k of [-22,0,22]){const px=x+c*k,py=y+s*k;
    if(px<20||py<20||px>W-20||py>H-20)return '';
    if(solid(px,py)||trunkAt(px,py,5))return '';
    if(wireAt(px,py))return 'Barbed wire blocks the jeep. Look for the gaps where the road crosses.';
    if(tDist(px,py)<30&&!bridgeAt(px,py,true))return 'The jeep can only cross trenches on the big road bridges.'}
  for(const k of [-10,10]){if(solid(x-s*k,y+c*k))return ''}
  return true}
function updJeep(dt){
  const J=S.jeep,P=S.player;if(!J||J.dead)return;
  const I=S.input||{ix:0,iy:0,m:0},maxF=310*jeepSurface(J.x,J.y);
  if(P.inJeep&&I.m>.15){const th=Math.atan2(I.iy,I.ix),d=angDiff(th,J.a);
    if(Math.abs(d)>2.3){J.v=Math.max(-120,J.v-260*dt);J.a+=clamp(angDiff(th+Math.PI,J.a),-2.2*dt,2.2*dt)*Math.min(1,Math.abs(J.v)/60+.2)}
    else{const target=maxF*I.m*(1-Math.min(.6,Math.abs(d)/2.5));J.v=J.v<target?Math.min(target,J.v+240*dt):Math.max(target,J.v-320*dt);J.a+=clamp(d,-2.6*dt,2.6*dt)*Math.min(1,Math.abs(J.v)/60+.2)}}
  else J.v=J.v>0?Math.max(0,J.v-280*dt):Math.min(0,J.v+280*dt);
  if(J.v>maxF)J.v=Math.max(maxF,J.v-500*dt);
  if(Math.abs(J.v)>1){const nx=J.x+Math.cos(J.a)*J.v*dt,ny=J.y+Math.sin(J.a)*J.v*dt,r=jeepOk(nx,ny,J.a);
    if(r===true){J.x=nx;J.y=ny}
    else{if(Math.abs(J.v)>150&&P.inJeep){J.hp-=5;S.shake=Math.max(S.shake,6);sfx('crash')}J.v=-J.v*.25;if(P.inJeep&&r)toast(r,'',r.slice(0,10))}}
  if(P.inJeep){P.x=J.x;P.y=J.y;
    if(Math.abs(J.v)>110)for(const e of S.enemies){if(e.dead||e.gone||e.type==='sniper')continue;if(hyp(e.x-J.x,e.y-J.y)<26){e.hp-=3;e.hurt=.2;if(e.hp<=0)killEnemy(e,true)}}
    if(J.load.length&&hyp(J.x-TENT.x,J.y-TENT.y)<TENT.r+90)unloadJeep()}
  if(J.hp<=0)wreckJeep();
}
function unloadJeep(){const J=S.jeep;for(const it of J.load){if(it.kind==='crate'){const c=S.items.find(i=>i.id===it.id);if(c){c.gone=true;S.today.crate=true;toast('Medical crate delivered!','good')}}else{const p=S.patients.find(q=>q.id===it.id);if(p){savePatient(p,'jeep');S.today.jeepSaved++}}}J.load=[]}

/* ---------- interaction ---------- */
function interact(dt){
  const P=S.player,J=S.jeep,A=S.asst;let prompt='',prog=-1;
  if(P.inJeep){
    prompt=J.load.length?'Driving with '+J.load.length+' aboard · take them to the aid tent · E to get out':'Driving the jeep · '+(isTouch?'tap Treat':'press E')+' to get out';
    if(act.pressed)exitJeep(false);
    S.treat=null;act.pressed=false;setPrompt(prompt,-1);return;
  }
  const nearJeep=J&&!J.dead&&hyp(J.x-P.x,J.y-P.y)<48;
  if(P.carry){
    const c=carried();
    if(!c)P.carry=null;
    else if(P.inTent){if(P.carry.kind==='crate'){c.gone=true;S.today.crate=true;toast('Medical crate delivered!','good')}else savePatient(c);P.carry=null}
    else if(nearJeep&&J.load.length<3){
      prompt=press()+' to put '+(P.carry.kind==='crate'?'the crate':c.name)+' in the jeep ('+J.load.length+'/3)';
      if(act.pressed){if(P.carry.kind==='crate'){c.carried=false;c.inJeep=true;J.load.push({kind:'crate',id:c.id})}else{c.state='jeep';J.load.push({kind:'p',id:c.id})}P.carry=null;sfx('pickup');toast(J.load.length<3?'Loaded. Fetch more, or jump in and drive to the aid tent.':'The jeep is full. Drive to the aid tent!','good','loaded')}
    }else{
      prompt=(P.carry.kind==='crate'?'Carrying the medical crate':'Carrying '+c.name)+' to the aid tent · E to put down';
      if(act.pressed){if(P.carry.kind==='crate')c.carried=false;else c.state='stable';c.claim=0;P.carry=null}
    }
  }else{
    let best=null,bd=46;
    for(const p of S.patients){if(p.state!=='down'&&p.state!=='stable')continue;const d=hyp(p.x-P.x,p.y-P.y);if(d<bd){bd=d;best=p}}
    const coopNear=A&&A.st==='down'&&hyp(A.x-P.x,A.y-P.y)<Math.min(46,bd+1);
    let crate=null;for(const i of S.items)if(i.kind==='crate'&&!i.gone&&!i.inJeep&&!i.carried&&hyp(i.x-P.x,i.y-P.y)<44)crate=i;
    const treatTarget=coopNear?{id:'coop',name:'Cooper'}:best&&best.state==='down'?best:null;
    if(treatTarget){
      if(P.band<=0){prompt='No bandages left. Restock at the aid tent.';S.treat=null}
      else{prompt=(isTouch?'Hold Treat':'Hold E')+' to bandage '+treatTarget.name+(treatTarget.sev==='serious'?' (badly hurt)':'');
        if(act.held){if(!S.treat||S.treat.id!==treatTarget.id)S.treat={id:treatTarget.id,t:0};S.treat.t+=dt;prog=S.treat.t/P.treatTime;
          if(S.treat.t>=P.treatTime){P.band--;S.treat=null;sfx('bandage');
            if(coopNear){A.st='follow';A.hp=40;toast('Cooper is patched up and back to work.','good')}
            else if(best.sev==='light'){best.state='walking';toast(best.name+' is patched up and walking to the aid tent.','good')}
            else{best.state='stable';toast('Bleeding stopped. Carry '+best.name+' back, load them in the jeep, or let Cooper fetch them (T).','good')}}}
        else S.treat=null}
    }else{S.treat=null;
      if(best&&best.state==='stable'){prompt=press()+' to lift '+best.name+' onto your stretcher';if(act.pressed){best.state='carried';P.carry={kind:'p',id:best.id};sfx('pickup')}}
      else if(crate){prompt=press()+' to pick up the medical crate';if(act.pressed){crate.carried=true;P.carry={kind:'crate',id:crate.id};sfx('pickup')}}
      else if(nearJeep){prompt=press()+' to drive the jeep'+(J.load.length?' ('+J.load.length+' wounded aboard)':'');if(act.pressed)enterJeep()}
    }
  }
  act.pressed=false;
  setPrompt(prompt,prog);
}
let lastPrompt='';
function setPrompt(t,prog){const key=t+'|'+(prog>=0?Math.round(prog*20):'');if(key===lastPrompt)return;lastPrompt=key;const el=$('prompt');
  if(!t){el.textContent='';return}el.innerHTML='';el.append(t);if(prog>=0){const b=document.createElement('span');b.className='pbar';b.innerHTML='<i style="width:'+Math.min(100,prog*100)+'%"></i>';el.appendChild(b)}}

/* ---------- assistant ---------- */
function nearestStable(o,range){let best=null,bd=range;for(const p of S.patients){if(p.state!=='stable'||p.claim)continue;const d=hyp(p.x-o.x,p.y-o.y);if(d<bd){bd=d;best=p}}return best}
function orderCooper(){const A=S.asst;if(!A)return;if(A.st==='down'){toast('Cooper is wounded. Bandage him first.','bad','co1');return}if(A.st!=='follow'){toast('Cooper is busy carrying someone.','','co2');return}
  const q=nearestStable(A,1e9);if(!q){toast('No bandaged men are waiting. Bandage someone and Cooper will carry them.','','co3');return}A.st='fetch';A.tid=q.id;q.claim=1;toast('Cooper is going to fetch '+q.name+'.','good','coopf'+q.id)}
function updAsst(dt){
  const A=S.asst,P=S.player;if(!A)return;
  A.hurt=Math.max(0,A.hurt-dt);
  if(A.st==='down')return;
  A.cov=tDist(A.x,A.y)<22||!!craterAt(A.x,A.y);
  if(A.hp<=0){A.st='down';const p=A.tid&&S.patients.find(q=>q.id===A.tid);if(p){if(p.state==='asst')p.state='stable';p.claim=0}A.tid=null;toast('Cooper has been hit! Hold E next to him to patch him up.','bad');sfx('hurt');return}
  const p=A.tid?S.patients.find(q=>q.id===A.tid):null;

  if(A.st==='carry'){if(!p||p.state!=='asst'){A.st='follow';A.tid=null}else{tx=TENT.x;ty=TENT.y;sp=118;if(hyp(A.x-TENT.x,A.y-TENT.y)<TENT.r*.7){savePatient(p,'cooper');A.st='follow';A.tid=null}}}
  if(A.st==='follow'){
    A.scan-=dt;if(A.scan<=0){A.scan=.6;const q=nearestStable(A,700);if(q&&!(P.carry&&P.carry.id===q.id)){A.st='fetch';A.tid=q.id;q.claim=1;toast('Cooper is going to fetch '+q.name+'.','','coopf'+q.id);return}}
    const fx_=P.x-Math.cos(P.face)*(P.inJeep?50:42),fy=P.y-Math.sin(P.face)*(P.inJeep?50:42);
    if(hyp(fx_-A.x,fy-A.y)>34){tx=fx_;ty=fy;sp=hyp(P.x-A.x,P.y-A.y)>300?235:168}
  }
  if(tx!=null){const d=hyp(tx-A.x,ty-A.y);if(d>1){const k=Math.min(d,sp*scramble(A)*(wetAt(A.x,A.y)?.7:1)*(wireAt(A.x,A.y)?.5:1)*dt);A.x+=(tx-A.x)/d*k;A.y+=(ty-A.y)/d*k;A.face=Math.atan2(ty-A.y,tx-A.x)}collide(A)}
  if(A.hp<A.max&&hyp(A.x-TENT.x,A.y-TENT.y)<TENT.r)A.hp=Math.min(A.max,A.hp+10*dt);
}

/* ---------- patients, soldiers ---------- */
function updPatients(dt){
  const P=S.player,A=S.asst,J=S.jeep;
  for(const p of S.patients){
    if(p.state==='down'){p.life-=dt*(gasAt(p.x,p.y)?2.2:1);if(p.life<=0)patientDies(p)}
    else if(p.state==='stable'){p.life-=dt*.12;if(p.life<=0)patientDies(p)}
    else if(p.state==='walking'){const dx=TENT.x-p.x,dy=TENT.y-p.y,d=hyp(dx,dy);p.x+=dx/d*52*dt;p.y+=dy/d*52*dt;p.a=Math.atan2(dy,dx);if(d<TENT.r*.6)savePatient(p)}
    else if(p.state==='carried'){p.x=P.x-Math.cos(P.face)*15;p.y=P.y-Math.sin(P.face)*15;p.a=P.face}
    else if(p.state==='asst'){p.x=A.x-Math.cos(A.face)*15;p.y=A.y-Math.sin(A.face)*15;p.a=A.face}
    else if(p.state==='jeep'){p.x=J.x;p.y=J.y}
    else if(p.state==='dead'){p.fade+=dt;if(p.fade>3)p.state='gone'}
  }
  S.patients=S.patients.filter(p=>p.state!=='gone');
}
function patientDies(p){p.state='dead';p.fade=0;S.stats.lost++;S.today.lost++;toast(p.name+' did not make it.','bad');if(p.vip)S.today.vip='dead'}
function sightOn(e){const P=S.player;let s=e.sight;if(S.phase==='night'&&!lit(P.x,P.y))s*=.5;if(P.inJeep)return s*1.25;if(P.tr)s*=.5;else if(P.cov)s*=.65;if(P.canopy)s*=.55;if(P.moving>200)s*=1.2;return s}
function validT(t){const P=S.player,A=S.asst;if(!t)return false;if(t===P)return P.hp>0;if(t===A)return A.st!=='down';return t.alive}
function pickTarget(e){
  const P=S.player,A=S.asst,c=[];
  if(P.hp>0){const d=hyp(P.x-e.x,P.y-e.y);if(d<sightOn(e))c.push([d,P])}
  if(A&&A.st!=='down'){const d=hyp(A.x-e.x,A.y-e.y);if(d<e.sight*.75)c.push([d,A])}
  if(e.type!=='sniper'){const r=e.type==='raider'?280:e.sight*.85;for(const f of S.friends){if(!f.alive)continue;const d=hyp(f.x-e.x,f.y-e.y);if(d<r)c.push([d,f])}}
  c.sort((a,b)=>a[0]-b[0]);for(let i=0;i<Math.min(3,c.length);i++)if(los(e.x,e.y,c[i][1].x,c[i][1].y))return c[i][1];return null}
function nearestEnemy(o,range){const c=[];for(const e of S.enemies){if(e.dead||e.gone)continue;if(e.type==='sniper'&&e.vis<=0)continue;const d=hyp(e.x-o.x,e.y-o.y);if(d<range)c.push([d,e])}
  c.sort((a,b)=>a[0]-b[0]);for(let i=0;i<Math.min(3,c.length);i++)if(los(o.x,o.y,c[i][1].x,c[i][1].y))return c[i][1];return null}
function hitTarget(t,n){const P=S.player,A=S.asst;if(t===P){if(P.inJeep)S.jeep.hp-=n*.8;else damagePlayer(n)}else if(t===A){A.hp-=n;A.hurt=.3}else{t.hp-=1;t.hurt=.3}}
function moveToward(e,tx,ty,sp,dt){const d=hyp(tx-e.x,ty-e.y);if(d<.5)return d;const k=Math.min(d,sp*scramble(e)*(wireAt(e.x,e.y)?.45:1)*(wetAt(e.x,e.y)?.65:1)*dt);e.x+=(tx-e.x)/d*k;e.y+=(ty-e.y)/d*k;return d}
function updEnemies(dt){
  const P=S.player,truce=S.day===3;

    }else if(e.type==='trooper'){

function spawnPlane(side,from){

  else{const left=from?from==='L':Math.random()<.5;x=left?-250:W+250;y=rand(900,3400);a=left?rand(-.3,.3):Math.PI+rand(-.3,.3)}
  const p={id:S.nid++,side,x,y,a,spd:rand(220,255),hp:5,mode:'fly',life:0,cd:0,tgt:null,alt:1,fallT:0,smk:0};
  if(side==='G'&&S.year>=1&&S.day!==3&&Math.random()<.45){p.mode='bomb';const P=S.player;
    for(let i=0;i<10;i++){const tx=(P.y>2600&&Math.random()<.5)?P.x+rand(-200,200):rand(300,W-300),ty=(P.y>2600&&Math.random()<.5)?P.y+rand(-200,200):rand(2880,3320);if(hyp(tx-TENT.x,ty-TENT.y)>520){p.bx=tx;p.by=ty;break}}
    if(p.bx==null)p.mode='fly'}

function updPlanes(dt){
  const night=S.phase==='night',truce=S.day===3;
  S.timers.plane-=dt;if(S.timers.plane<=0){S.timers.plane=night?rand(40,70):rand(14,28)*(S.year===0?1.4:1);const p=spawnPlane();if(!truce&&Math.random()<.35)spawnPlane(p.side==='A'?'G':'A')}
  for(const p of S.planes){
    if(p.mode==='fall'){p.fallT-=dt;p.a+=2.4*dt;p.alt=Math.max(0,p.fallT/3.2);p.x+=Math.cos(p.a)*p.spd*.7*dt;p.y+=Math.sin(p.a)*p.spd*.7*dt;p.smk-=dt;if(p.smk<=0){p.smk=.05;fx({k:'smoke',x:p.x,y:p.y,vx:rand(-10,10),vy:rand(-10,10),r:rand(8,14),t:1.6,max:1.6})}
      if(p.fallT<=0){planeCrash(p);p.gone=1}continue}
    p.life+=dt;p.cd-=dt;
    let steer=null;
    let tgt=p.tgt&&S.planes.find(q=>q.id===p.tgt&&q.mode!=='fall'&&!q.gone);
    if(!tgt&&!truce&&p.life<45){p.tgt=null;let bd=650;for(const q of S.planes){if(q.side===p.side||q.mode==='fall'||q.gone)continue;const d=hyp(q.x-p.x,q.y-p.y);if(d<bd){bd=d;tgt=q}}if(tgt)p.tgt=tgt.id}
    if(tgt&&p.life<45){const lead=.35;steer=Math.atan2(tgt.y+Math.sin(tgt.a)*tgt.spd*lead-p.y,tgt.x+Math.cos(tgt.a)*tgt.spd*lead-p.x);
      const d=hyp(tgt.x-p.x,tgt.y-p.y);if(d<420&&Math.abs(angDiff(Math.atan2(tgt.y-p.y,tgt.x-p.x),p.a))<.25&&p.cd<=0){p.cd=.11;
        fx({k:'tracer',x:p.x+Math.cos(p.a)*24,y:p.y+Math.sin(p.a)*24,x2:p.x+Math.cos(p.a+rand(-.05,.05))*300,y2:p.y+Math.sin(p.a+rand(-.05,.05))*300,t:.08,max:.08});
        sfx('mg',vol(p.x,p.y)*.45);if(Math.random()<.13){tgt.hp--;if(tgt.hp<=0&&tgt.mode!=='fall'){tgt.mode='fall';tgt.fallT=3.2}}}}
    else if(p.mode==='bomb'){steer=Math.atan2(p.by-p.y,p.bx-p.x);if(hyp(p.bx-p.x,p.by-p.y)<70){for(let i=0;i<3;i++)S.shells.push({x:p.x+Math.cos(p.a)*i*70,y:p.y+Math.sin(p.a)*i*70,t:.9+i*.15,max:1.05});p.mode='leave';sfx('whistle',vol(p.x,p.y));if(vol(p.x,p.y)>.4)toast('Enemy plane overhead! Bombs!','alert','bombs')}}
    else if(p.life>45||p.mode==='leave')steer=p.side==='G'?-Math.PI/2:Math.PI/2;
    if(steer!=null)p.a+=clamp(angDiff(steer,p.a),-1.5*dt,1.5*dt);
    p.x+=Math.cos(p.a)*p.spd*dt;p.y+=Math.sin(p.a)*p.spd*dt;
    if(p.x<-600||p.x>W+600||p.y<-600||p.y>H+600)p.gone=1;
  }
  S.planes=S.planes.filter(p=>!p.gone);
}
function planeCrash(p){let x=clamp(p.x,60,W-60),y=clamp(p.y,60,H-60);if(hyp(x-TENT.x,y-TENT.y)<350){y-=400}

function checkMissions(){
  const T=S.today;
  for(const m of S.missions){if(m.done||m.failed)continue;let ok=false;
    if(m.type==='save'){m.count=T.saved;ok=T.saved>=m.n}
    else if(m.type==='vip'){if(T.vip==='saved')ok=true;else if(T.vip==='dead'){m.failed=true;toast('Orders failed: '+m.title.replace('Rescue ','')+' was lost.','bad')}}
    else if(m.type==='dog')ok=T.dog;else if(m.type==='tags'){m.count=T.tags;ok=T.tags>=3}else if(m.type==='crate')ok=T.crate;else if(m.type==='sniper')ok=T.sniper;
    else if(m.type==='jeep'){m.count=T.jeepSaved;ok=T.jeepSaved>=m.n}
    if(ok)completeMission(m)}
}
function completeMission(m){m.done=true;const P=S.player;sfx('win');
  if(m.main){S.stats.mains++;const u=pick(UPG);if(u[0]==='treat')P.treatTime=Math.max(.7,P.treatTime-u[1]);else if(u[0]==='meds')P.meds+=u[1];else{P[u[0]]+=u[1];if(u[0]==='hpMax')P.hp+=u[1];if(u[0]==='bandMax')P.band+=u[1]}
    m.reward=u[2];toast('Main orders complete! '+u[2],'good')}
  else{S.stats.sides++;let r='';
    if(m.type==='dog'){P.meds++;S.perks.dog=true;r='Rags will bark when raiders come: they now show on your map. +1 medicine.'}
    else if(m.type==='tags'){P.bandMax+=2;P.band+=2;r='The chaplain gives you a bigger satchel: +2 bandages.'}
    else if(m.type==='crate'){P.meds+=2;P.reserveMax+=6;r='+2 medicine and room for 6 more rounds.'}
    else if(m.type==='sniper'){P.hpMax+=10;P.hp+=10;r='The trench is safer now: +10 maximum health.'}
    else if(m.type==='jeep'){S.jeepMax+=50;S.jeep.hp+=50;r='The mechanics bolt armour plates onto the jeep: +50 jeep health.'}
    m.reward=r;toast('Side mission complete! '+r,'good')}
}
function missionTargets(){const L=[];
  for(const m of S.missions){if(m.done||m.failed)continue;
    if(m.type==='vip'){const p=S.patients.find(p=>p.id===m.id);if(p&&(p.state==='down'||p.state==='stable'))L.push({x:p.x,y:p.y})}

  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(2,3,17,9,0,0,TAU);ctx.fill();
  if(p.state==='carried'||p.state==='asst'){ctx.fillStyle='#5b4a2f';ctx.fillRect(-22,-9,44,18);ctx.strokeStyle='#3b2f1d';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-28,-9);ctx.lineTo(28,-9);ctx.moveTo(-28,9);ctx.lineTo(28,9);ctx.stroke()}
  ctx.fillStyle=p.pilot?'#5d4a36':p.vip?'#8a7a4a':'#7b6b3f';ctx.beginPath();ctx.ellipse(0,0,15,7,0,0,TAU);ctx.fill();
  ctx.fillStyle='#e7d3b4';circle(14,0,5);ctx.fill();ctx.fillStyle=p.pilot?'#4a3a2a':'#5f5a3a';circle(-5,8,6);ctx.fill();
  if(p.state==='stable'||p.state==='carried'||p.state==='asst'){ctx.fillStyle='#f4efe2';ctx.fillRect(-4,-7,7,14)}else if(p.state==='down'){ctx.fillStyle='#a3271d';circle(-2,-1,3.6);ctx.fill()}
  if(p.vip||p.pilot){ctx.fillStyle='#c9a24a';ctx.fillRect(4,-7,3,14)}
  ctx.restore();
  if(p.state==='down'||p.state==='stable'){const f=Math.max(0,p.life/p.max),bob=Math.sin(now/300+p.id)*2;
    ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=5;circle(p.x,p.y,22);ctx.stroke();
    ctx.strokeStyle=f>.5?'#d7c38a':f>.25?'#e39b3c':'#d0392b';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,22,-Math.PI/2,-Math.PI/2+TAU*f);ctx.stroke();
    const mx=p.x,my=p.y-36+bob;ctx.fillStyle=p.vip||p.pilot?'#c9a24a':'#f4efe2';circle(mx,my,9);ctx.fill();ctx.fillStyle=p.state==='stable'?'#5f7a3a':'#b8281f';ctx.fillRect(mx-2,my-6,4,12);ctx.fillRect(mx-6,my-2,12,4)}
}
function drawSoldier(x,y,a,side,o){
  ctx.save();ctx.translate(x,y);
  if(o.dead){ctx.rotate(a+1.4);ctx.fillStyle='#5d6255';ctx.beginPath();ctx.ellipse(0,0,15,7,0,0,TAU);ctx.fill();ctx.fillStyle='#4f554e';circle(13,0,6);ctx.fill();ctx.restore();return}
  ctx.fillStyle='rgba(0,0,0,.25)';circle(3,4,13);ctx.fill();
  if(o.player){ctx.strokeStyle='rgba(244,239,226,.55)';ctx.lineWidth=1.5;circle(0,0,18);ctx.stroke()}
  ctx.rotate(a);
  const uni=side==='A'?(o.player||o.medic?'#7f6d3e':'#76683f'):(o.type==='sniper'?'#4f5a3c':o.type==='raider'?'#585d52':'#6a7062');
  if(!o.limp&&!o.medic){ctx.strokeStyle='#2a2219';ctx.lineWidth=o.player?3:3.5;ctx.beginPath();if(o.type==='raider'){ctx.moveTo(4,7);ctx.lineTo(16,11)}else if(o.player){ctx.moveTo(6,5);ctx.lineTo(17,5)}else{ctx.moveTo(-4,6);ctx.lineTo(24,6)}ctx.stroke()}
  ctx.fillStyle=uni;ctx.beginPath();ctx.ellipse(0,0,8,12.5,0,0,TAU);ctx.fill();
  ctx.fillStyle='#e7d3b4';circle(5,4,2.6);ctx.fill();
  if(o.player||o.medic){ctx.fillStyle='#f4efe2';ctx.fillRect(-4,-13,8,5);ctx.fillStyle='#b8281f';ctx.fillRect(-1,-13,2,5);ctx.fillRect(-3,-11.5,6,2)}
  if(o.bandage){ctx.fillStyle='#f4efe2';ctx.fillRect(-3,4,6,6)}
  if(side==='A'){ctx.fillStyle='#57522f';circle(0,0,8.8);ctx.fill();ctx.fillStyle='#6d6742';circle(.5,0,6);ctx.fill()}
  else if(o.helm==='stahl'){ctx.fillStyle='#4b504b';ctx.beginPath();ctx.ellipse(-1,0,8.6,8,0,0,TAU);ctx.fill();ctx.fillStyle='#5f655f';circle(.5,0,5.8);ctx.fill()}
  else{ctx.fillStyle='#262624';circle(0,0,6.8);ctx.fill();ctx.fillStyle='#c9a24a';circle(0,0,1.8);ctx.fill()}
  if(o.mask){ctx.fillStyle='#5b6150';ctx.fillRect(5,-4,5,8)}
  if(o.hurt>0){ctx.globalAlpha=Math.min(1,o.hurt*3)*.7*(ctx.globalAlpha);ctx.fillStyle='#fff';circle(0,0,12);ctx.fill()}
  ctx.restore();
}
function planeShape(){ctx.fillRect(-2,-28,10,56);ctx.fillRect(-18,-3.5,36,7);ctx.fillRect(-18,-10,5,20);ctx.beginPath();ctx.moveTo(18,-3.5);ctx.lineTo(22,0);ctx.lineTo(18,3.5);ctx.fill()}
function drawPlanes(){
  for(const f of S.fx)if(f.k==='tracer'){ctx.strokeStyle=`rgba(255,220,140,${f.t/f.max})`;ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(f.x2,f.y2);ctx.stroke()}
  for(const p of S.planes){if(!inView(p.x,p.y,160))continue;const s=1.6*(p.mode==='fall'?(.55+.45*p.alt):1),so=p.mode==='fall'?70*p.alt:70;
    ctx.save();ctx.translate(p.x+so*.5,p.y+so);ctx.rotate(p.a);ctx.scale(s*.9,s*.9);ctx.fillStyle='rgba(0,0,0,.2)';planeShape();ctx.restore();
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.scale(s,s);
    const body=p.side==='A'?'#8e8156':'#7a705f',wing=p.side==='A'?'#b3a56f':'#958b76';
    ctx.fillStyle=wing;ctx.fillRect(-2,-28,10,56);
    ctx.fillStyle=body;ctx.beginPath();ctx.ellipse(0,0,18,4.2,0,0,TAU);ctx.fill();ctx.fillRect(-18,-10,5,20);
    ctx.fillStyle='#2b2620';circle(4,0,2.4);ctx.fill();
    for(const sy of [-21,21]){if(p.side==='A'){ctx.fillStyle='#2c3f73';circle(3,sy,4.2);ctx.fill();ctx.fillStyle='#f1ecdc';circle(3,sy,2.8);ctx.fill();ctx.fillStyle='#b8281f';circle(3,sy,1.4);ctx.fill()}
      else{ctx.fillStyle='#f1ecdc';ctx.fillRect(-1,sy-4,8,8);ctx.fillStyle='#161512';ctx.fillRect(2,sy-3.6,2,7.2);ctx.fillRect(-.6,sy-1,7.2,2)}}
    ctx.fillStyle='rgba(220,220,210,.28)';circle(20,0,7);ctx.fill();
    ctx.restore()}}
function drawFx(){for(const f of S.fx){const k=f.t/f.max;
  if(f.k==='flash'){ctx.fillStyle=`rgba(255,190,90,${k*.8})`;circle(f.x,f.y,f.r*(1.3-k*.5));ctx.fill();ctx.fillStyle=`rgba(255,240,200,${k})`;circle(f.x,f.y,f.r*.4);ctx.fill()}
  else if(f.k==='smoke'){ctx.fillStyle=`rgba(70,64,56,${k*.55})`;circle(f.x,f.y,f.r*(1.8-k));ctx.fill()}
  else if(f.k==='dirt'){ctx.fillStyle=`rgba(60,48,34,${k})`;ctx.fillRect(f.x-2,f.y-2,4,4)}
  else if(f.k==='muzzle'){ctx.fillStyle=`rgba(255,230,150,${k})`;circle(f.x,f.y,5);ctx.fill()}
  else if(f.k==='puff'){ctx.fillStyle=`rgba(150,135,110,${k*.6})`;circle(f.x,f.y,5+(1-k)*6);ctx.fill()}
  else if(f.k==='text'){ctx.font='700 20px "Barlow Condensed", sans-serif';ctx.textAlign='center';ctx.fillStyle=`rgba(230,240,190,${Math.min(1,k*2)})`;ctx.fillText(f.txt,f.x,f.y-(1-k)*40)}}}
function drawMarkers(){
  const P=S.player,A=S.asst,J=S.jeep,list=[];
  for(const p of S.patients)if(p.state==='down'||p.state==='stable')list.push({x:p.x,y:p.y,c:p.vip||p.pilot?'gold':'red',d:hyp(p.x-P.x,p.y-P.y)});
  for(const t of missionTargets())list.push({x:t.x,y:t.y,c:'gold',d:hyp(t.x-P.x,t.y-P.y)});
  if(P.carry||(P.inJeep&&J.load.length)||S.phase==='night'||(S.phase==='day'&&S.t>dayLen()-30))list.push({x:TENT.x,y:TENT.y,c:'tent',d:0});
  if(J&&!J.dead&&!P.inJeep)list.push({x:J.x,y:J.y,c:'jeep',d:1});
  if(A&&A.st==='down')list.push({x:A.x,y:A.y,c:'gold',d:2});
  list.sort((a,b)=>a.d-b.d);let reds=0;
  const m=34,top=m+(VW<560?150:0);
  for(const t of list){if(t.c==='red'&&++reds>6)continue;
    const sx=(t.x-camX)*SC+VW/2,sy=(t.y-camY)*SC+VH/2;if(sx>0&&sx<VW&&sy>0&&sy<VH)continue;
    const cx=VW/2,cy=VH/2,dx=sx-cx,dy=sy-cy;const s=Math.min((VW/2-m)/Math.abs(dx||1e-6),(VH/2-m)/Math.abs(dy||1e-6));let ex=cx+dx*s,ey=cy+dy*s;ey=Math.max(top,ey);
    const a=Math.atan2(dy,dx);ctx.save();ctx.translate(ex,ey);ctx.fillStyle='rgba(21,18,12,.75)';circle(0,0,13);ctx.fill();
    ctx.rotate(a);ctx.fillStyle=t.c==='red'?'#e05a4c':t.c==='gold'?'#e7b24c':t.c==='jeep'?'#b9bd86':'#ece5cf';ctx.beginPath();ctx.moveTo(19,0);ctx.lineTo(13,-5);ctx.lineTo(13,5);ctx.fill();ctx.rotate(-a);
    if(t.c==='red'){ctx.fillRect(-1.6,-6,3.2,12);ctx.fillRect(-6,-1.6,12,3.2)}else if(t.c==='gold'){circle(0,0,5);ctx.fill()}else if(t.c==='jeep'){ctx.fillRect(-6,-3.5,12,7);ctx.fillStyle='#1d1b17';ctx.fillRect(-5,3,3,2);ctx.fillRect(2,3,3,2)}else{ctx.fillRect(-6,-1,12,6);ctx.beginPath();ctx.moveTo(-7,-1);ctx.lineTo(0,-7);ctx.lineTo(7,-1);ctx.fill()}
    ctx.restore()}
}
function drawMiniBg(){const c=miniBg.getContext('2d'),k=220/W;c.fillStyle=GROUND[S.year];c.fillRect(0,0,220,162);
  c.fillStyle='rgba(40,58,25,.85)';for(const t of S.trees)if(t.s===2)c.fillRect(t.x*k-.7,t.y*k-.7,1.5,1.5);
  c.fillStyle='rgba(30,24,18,.5)';for(const m of S.mud){c.beginPath();c.arc(m.x*k,m.y*k,m.r*k,0,TAU);c.fill()}
  c.strokeStyle='rgba(150,138,105,.7)';c.lineWidth=1.3;c.beginPath();for(let x=0;x<=W;x+=200){const yy=roadY(x)*k;x?c.lineTo(x*k,yy):c.moveTo(x*k,yy)}c.stroke();c.beginPath();for(let y=1080;y<=H;y+=200){const xx=roadX(y)*k;y>1080?c.lineTo(xx,y*k):c.moveTo(xx,y*k)}c.stroke();
  c.lineJoin='miter';for(const L of ST.lines){c.beginPath();L.pts.forEach(([x,y],i)=>i?c.lineTo(x*k,y*k):c.moveTo(x*k,y*k));c.strokeStyle=L.side==='A'?'#2a2014':'#1e1e1a';c.lineWidth=2;c.stroke()}
  c.fillStyle='rgba(200,170,120,.9)';for(const b of ST.bridges)if(b.veh)c.fillRect(b.x*k-1.5,b.y*k-1.5,3,3);
  c.fillStyle='rgba(180,180,185,.55)';for(const w of S.wire)c.fillRect(w.x*k,w.y*k,w.w*k,1.3);
  for(const h of ST.houses){const s=S.hs[h.id];c.fillStyle=s===2?'#8a5a44':s===1?'#6e6052':'#54504a';c.fillRect(h.x*k,h.y*k,Math.max(1.5,h.w*k),Math.max(1.5,h.h*k))}
  c.fillStyle='#a8a8a0';for(const b of S.bunkers)c.fillRect(b.x*k,b.y*k,4,3);
  c.fillStyle='rgba(200,60,40,.08)';c.fillRect(0,0,220,1100*k);
}
let miniBgT=0;
function drawMini(now){const k=220/W,P=S.player,J=S.jeep,A=S.asst;if(now-miniBgT>4000||miniBgT===0){miniBgT=now;drawMiniBg()}
  mctx.drawImage(miniBg,0,0);
  mctx.fillStyle='#f4efe2';mctx.fillRect(TENT.x*k-4,TENT.y*k-3,8,6);mctx.fillStyle='#b8281f';mctx.fillRect(TENT.x*k-1,TENT.y*k-3,2,6);mctx.fillRect(TENT.x*k-4,TENT.y*k-1,8,2);
  for(const g of S.gas){mctx.fillStyle='rgba(184,196,90,.35)';mctx.beginPath();mctx.arc(g.x*k,g.y*k,g.r*k,0,TAU);mctx.fill()}
  mctx.fillStyle='rgba(150,190,110,.85)';for(const f of S.friends)if(f.alive&&f.kind==='assault')mctx.fillRect(f.x*k-.8,f.y*k-.8,1.6,1.6);
  for(const p of S.patients){if(p.state!=='down'&&p.state!=='stable')continue;const x=p.x*k,y=p.y*k;mctx.fillStyle=p.vip||p.pilot?'#e7b24c':p.state==='stable'?'#f4efe2':'#ff5a48';mctx.fillRect(x-1,y-3,2,6);mctx.fillRect(x-3,y-1,6,2)}
  for(const t of missionTargets()){mctx.strokeStyle='#e7b24c';mctx.lineWidth=1.2;mctx.beginPath();mctx.arc(t.x*k,t.y*k,t.approx?7:3,0,TAU);mctx.stroke()}
  for(const e of S.enemies){if(e.dead||e.gone||e.type==='sniper')continue;const d=hyp(e.x-P.x,e.y-P.y);if(d<600||(S.perks.dog&&e.type==='raider')){mctx.fillStyle='#d0392b';mctx.fillRect(e.x*k-1.2,e.y*k-1.2,2.4,2.4)}}
  for(const p of S.planes){mctx.fillStyle=p.side==='A'?'#c8d0f0':'#e08070';mctx.fillRect(p.x*k-1.5,p.y*k-1.5,3,3)}
  if(J&&!P.inJeep){mctx.fillStyle=J.dead?'#555':'#b9bd86';mctx.fillRect(J.x*k-2.5,J.y*k-2,5,4)}
  if(A){mctx.strokeStyle=A.st==='down'?'#e7b24c':'#c9a24a';mctx.lineWidth=1.3;mctx.beginPath();mctx.arc(A.x*k,A.y*k,2.4,0,TAU);mctx.stroke()}
  const hw=VW/2/SC,hh=VH/2/SC;mctx.strokeStyle='rgba(244,239,226,.45)';mctx.lineWidth=1;mctx.strokeRect((camX-hw)*k,(camY-hh)*k,hw*2*k,hh*2*k);
  mctx.fillStyle='#fff';mctx.beginPath();mctx.arc(P.x*k,P.y*k,2.6,0,TAU);mctx.fill();
}

/* ================= HUD ================= */
let hudT=0,lastMissions='',lastIlls='',lastCoop='';
function fmtClock(){let m;if(S.phase==='day')m=6*60+S.t/dayLen()*14*60;else m=20*60+S.t/nightLen()*9*60;m=Math.floor(m)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function hud(){const P=S.player,J=S.jeep,A=S.asst;
  $('dayLabel').textContent='Day '+S.day+' · '+DAYS[S.day-1][0];$('clock').textContent=fmtClock();
  $('cbar').classList.toggle('night',S.phase==='night');$('clockFill').style.width=(S.phase==='day'?S.t/dayLen():S.t/nightLen())*100+'%';
  $('hpFill').style.width=Math.max(0,P.hp/P.hpMax*100)+'%';$('stFill').style.width=P.st+'%';$('tentFill').style.width=Math.max(0,S.tent.hp/S.tent.max*100)+'%';$('footFill').style.width=P.foot+'%';
  $('jeepFill').style.width=(J&&!J.dead?Math.max(0,J.hp/S.jeepMax*100):0)+'%';$('coopFill').style.width=(A&&A.st!=='down'?Math.max(0,A.hp/A.max*100):0)+'%';
  let cs='following you';if(A){const p=A.tid&&S.patients.find(q=>q.id===A.tid);if(A.st==='down')cs='wounded! Bandage him';else if(A.st==='fetch'&&p)cs='going to fetch '+p.name;else if(A.st==='carry'&&p)cs='carrying '+p.name+' home'}
  if(cs!==lastCoop){lastCoop=cs;$('coopLine').innerHTML='Cooper: <b>'+esc(cs)+'</b>'}
  $('iBand').textContent=P.band+'/'+P.bandMax;$('iAmmo').textContent=P.reload>0?'…':P.ammo+'/'+P.reserve;$('iMeds').textContent=P.meds;$('iMask').textContent=P.mask?'On':'Off';$('iMaskBox').classList.toggle('on',P.mask);
  const ills=[];if(P.foot>60)ills.push('Trench foot');if(P.ills.dys)ills.push('Dysentery');if(P.ills.fever)ills.push('Trench fever');if(P.ills.flu)ills.push('Influenza');if(gasAt(P.x,P.y)&&!P.mask)ills.push('Gassed');
  const ih=ills.join('|');if(ih!==lastIlls){lastIlls=ih;$('ills').innerHTML=ills.map(i=>`<span class="chip">${i}</span>`).join('')}
  const mh=JSON.stringify(S.missions.map(m=>[m.title,m.done,m.failed,m.count]));
  if(mh!==lastMissions){lastMissions=mh;$('missionList').innerHTML=S.missions.map(m=>`<li class="${m.main?'main':''} ${m.done?'done':''} ${m.failed?'failed':''}"><span class="box"></span><div>${esc(m.title)}${m.n||m.type==='tags'?` <b>${Math.min(m.count||0,m.n||3)}/${m.n||3}</b>`:''}<small>${m.main?'Main orders':'Side mission'}</small></div></li>`).join('')}
  $('score').textContent='Score '+score()+' · Saved '+S.stats.saved;
}

/* ================= loop & boot ================= */
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  try{if(mode==='play')update(dt);else if(eng)eng.g.gain.value=0;render(now);if(mode!=='title'&&now-hudT>100){hudT=now;hud()}}catch(err){console.error(err)}
  requestAnimationFrame(frame)}
function start(data){
  buildStatic();
  if(data&&data.S){try{S=JSON.parse(data.S);DAWN=data.DAWN||null;if(!S.hs||!S.planes)throw 0;for(const e of S.enemies)e.tgt=null;for(const f of S.friends)f.tgt=null;rebuildGrids();mode='play';$('hud').hidden=false;hideScreen();pause()}catch(e){S=null}}
  if(!S){newGame();startDay(false);showTitle()}
  requestAnimationFrame(frame);
}
try{window.claude?.hot?.snapshot?.(()=>S&&mode!=='title'?{S:JSON.stringify({...S,bullets:[]},(k,v)=>k==='tgt'?null:v),DAWN}:{})}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
