    s += shape(on(PX(0), BASE), tone([-1,0,0], m), 0);
    if (vis([-1,0,0])){                                  // the back: a locked service door and vent louvres
      const bk = tone([-1,0,0], m), B = PX(-.2);
      s += shape(on(B, rrUV(16, 8, D - 16, 56, 3)), mix(bk, '#000000', .07), 1.1);
      s += shape(on(PX(-.3), ellUV(D - 22, 32, 1.6, 1.6, 12)), METAL.l, .8) + line([[-.4, D - 22, 31.2], [-.4, D - 22, 32.8]], .7);
      for (let i = 0; i < 4; i++) s += shape(on(B, rrUV(24, 61 + i * 4, D - 24, 63 + i * 4, .8)), mix(bk, '#000000', .45), .6);
    }
    if (vis([0,1,0])){
      s += shape(on(PY(D + .2), rrUV(12, 16, W - 12, 60, 6)), mix(sm, '#ffffff', .16), 1.2);
      s += txY(W / 2, D + .3, 33, MC.side, Math.min(11, 11 * 4 / MC.side.length), tc, 800);
    }
    s += ink(pd(on(PX(0), BASE)), 2);
    return s;
  }
  // pickup bay cavity and what is in it
  let cav = shape(on(PX(BAY_X), bayR), m.d, 0);
  const sideY = vis([0,1,0]) ? BAY[0] : BAY[2];          // the cavity's side wall that faces the viewer
  cav += face(pd([[BAY_X,sideY,BAY[1]],[W,sideY,BAY[1]],[W,sideY,BAY[3]],[BAY_X,sideY,BAY[3]]]), mix(m.d, '#000000', .25));
  cav += face(pd([[BAY_X,BAY[0],BAY[1]],[W,BAY[0],BAY[1]],[W,BAY[2],BAY[1]],[BAY_X,BAY[2],BAY[1]]]), mix(m.d, '#ffffff', .14));
  const inBay = [];
  st.bay.forEach((p, i) => { if (st.take) return; const [x, y, z] = baySpot(i); inBay.push({ at:[x, y, z], svg: prizeAt(p, x, y, z) }); });
  for (const b of st.bayIn) if (b.t >= 0) inBay.push({ at:[b.x, b.y, b.z], svg: prizeAt(b.p, b.x, b.y, b.z) });
  cav += byDepth(inBay);
  s += act('take', clipTo(on(PX(W), bayR), fill(pd(on(PX(W), bayR)), 'transparent') + cav));
  // front face with the bay hole
  s += `<path d="${pd(on(PX(W), BASE))}${pd(on(PX(W), bayR))}" fill="${tone([1,0,0], m)}" fill-rule="evenodd"/>`;
  s += ink(pd(on(PX(W), bayR)), 1.6);
  // (the flap is drawn by scene(), after the cabinet's silhouette ink: open, it sticks out past the outline)
  // display
  const F = PX(W + .3);
  s += shape(on(F, rrUV(DISP[0], DISP[1], DISP[2], DISP[3], 2.5)), '#1d2a26', 1.3);
  const [l1, l2] = displayLines(), cy = (DISP[0] + DISP[2]) / 2;
  s += tx(W + .4, cy, DISP[1] + 10.4, l1, 3.9, '#8af0ae', 700);
  s += tx(W + .4, cy, DISP[1] + 2.6, l2, 6.2, '#8af0ae', 800);
  // coin box door (where the tokens end up) with its lock
  s += shape(on(F, rrUV(46, 12, 74, 30, 2)), mix(tone([1,0,0], m), '#000000', .07), 1.1);
  s += shape(on(PX(W + .4), ellUV(69, 21, 1.6, 1.6, 12)), METAL.l, .8) + line([[W + .5, 69, 20.2], [W + .5, 69, 21.8]], .7);
  // body + side decal
  s += extrude(BASE, 0, W, m);
  if (vis([0,1,0])){
    s += shape(on(PY(D + .2), rrUV(12, 16, W - 12, 60, 6)), mix(sm, '#ffffff', .16), 1.2);
    s += txY(W / 2, D + .3, 33, MC.side, Math.min(11, 11 * 4 / MC.side.length), tc, 800);
  }
  s += ink(pd(on(PX(W), BASE)), 2);
  return s;
}

function coinDisc(x, y, z, r = 3){
  const A = ellZ(x, y, z, r, 18), B = ellZ(x, y, z + 1, r, 18);
  return loft(A, B, n => toneI(n, COINM)) + fill(pd(B), COINM.l) + ink(sp(hull([...A, ...B].map(p => P(...p)))), .7);
}
function coinStanding(x, y, z){
  const A = on(PY(y - .6), ellUV(x, z, 2.8, 2.8, 16)), B = on(PY(y + .6), ellUV(x, z, 2.8, 2.8, 16));
  const yc = vis([0,1,0]) ? y + .6 : y - .6, cap = vis([0,1,0]) ? B : A;
  return loft(A, B, n => toneI(n, COINM)) + fill(pd(cap), COINM.l) + ink(pd(cap), .8) + ink(pd(on(PY(yc + Math.sign(yc - y) * .05), ellUV(x, z, 1.7, 1.7, 12))), .5);
}

function ledge(m){
  let s = box(W, 1, LZ0, W + LX, D - 1, LZ1, m, tone, 1.1);
  s += shape(on(PZ(LZ1 + .05), rrUV(W + 1.6, 3.5, W + LX - 1.6, D - 3.5, 2)), '#fbf7ea', 1);
  if (vis([1,0,0])) s += shape(on(PX(W + LX + .1), rectUV(4, LZ0 + 3.6, D - 4, LZ0 + 6.4)), mix(m.l, '#ffffff', .3), .8);
  // the ledge's silhouette, under the things that stand on it (it used to cut across the token stack from behind)
  s += hullInk([...on(PX(W), rectUV(1, LZ0, D - 1, LZ1)), ...on(PX(W + LX), rectUV(1, LZ0, D - 1, LZ1))], 2.2);
  const Z = LZ1 + .1;
  const parts = [];
  // token stack
  let stack = '';
  for (let i = 0; i < Math.min(st.coins, MAX_STACK); i++) stack += coinDisc(STACK[0], STACK[1], Z + i * 1.15);
  if (!st.coins) stack += fill(pd(ellZ(STACK[0], STACK[1], Z, 3)), '#e9e3d3') + ink(pd(ellZ(STACK[0], STACK[1], Z, 3)), .5);
  parts.push({ at:[STACK[0], STACK[1], Z], box:[[STACK[0] - 3, STACK[1] - 3, Z], [STACK[0] + 3, STACK[1] + 3, Z + 12]], svg: act('coin', stack) });
  // coin slot plate
  let slot = shape(on(PZ(Z), rrUV(SLOT[0] - 4.5, SLOT[1] - 4.5, SLOT[0] + 4.5, SLOT[1] + 4.5, 1.5)), METAL.l, 1);
  slot += shape(on(PZ(Z + .05), rectUV(SLOT[0] - 3.5, SLOT[1] - .6, SLOT[0] + 3.5, SLOT[1] + .6)), '#26231f', .5);
  parts.push({ at:[SLOT[0], SLOT[1], Z - 1], box:[[SLOT[0] - 4.5, SLOT[1] - 4.5, Z], [SLOT[0] + 4.5, SLOT[1] + 4.5, Z + .1]], svg: act('coin', slot) });
  // drop button: bezel + big red cap that sinks when pressed
  const down = st.btn > 0, bh = down ? 1.2 : 3.4;
  let b = fill(pd(ellZ(BTN[0], BTN[1], Z, 7.2, 28)), METAL.m) + ink(pd(ellZ(BTN[0], BTN[1], Z, 7.2, 28)), 1);
  b += cyl(BTN[0], BTN[1], Z, Z + bh, 5.6, REDM, toneI, 1.2, 28);
  b += fill(pd(ellZ(BTN[0] + 1.6, BTN[1] - 1.2, Z + bh + .05, 2, 12)), mix(REDM.l, '#ffffff', .35));
  parts.push({ at:[BTN[0], BTN[1], Z], box:[[BTN[0] - 7.2, BTN[1] - 7.2, Z], [BTN[0] + 7.2, BTN[1] + 7.2, Z + 3.5]], svg: act('drop', b) });
  // joystick: base, shaft, ball; tilts the way it is pushed
  const [jx, jy] = JOY, [tx0, ty0] = st.tilt;
  let j = '';
  for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
    const c = [jx + dx * 6.2, jy + dy * 6.2], q = [-dy, dx];
    j += fill(pd([[c[0] + dx * 1.6, c[1] + dy * 1.6, Z], [c[0] + q[0] * 1.3, c[1] + q[1] * 1.3, Z], [c[0] - q[0] * 1.3, c[1] - q[1] * 1.3, Z]]), '#b8b1a0');
  }
  j += cyl(jx, jy, Z, Z + 1.6, 4, DARK, toneI, 1, 20);
  const top = [jx + tx0 * 4.2, jy + ty0 * 4.2, Z + 12.5];
  j += rod([jx, jy, Z + 1.6], top, .85, METAL, toneI, .9);
  const [bx, by] = P(...top), br = 3.4 * 1.2247;
  j += circ(bx, by, br, DARK.m) + circ(bx + br * .14, by - br * .16, br * .78, DARK.l) + `<ellipse cx="${f(bx + br * .36)}" cy="${f(by - br * .42)}" rx="${f(br * .22)}" ry="${f(br * .14)}" fill="#ffffff" opacity=".55"/>` + circInk(bx, by, br, 1.1);
  // invisible push zones round the stick
  const zones = [[1,0],[0,1],[-1,0],[0,-1]].map(([dx, dy]) => {
    const a0 = Math.atan2(dy, dx) - Math.PI / 4, pts = [[jx, jy, Z + 6]];
    for (let i = 0; i <= 6; i++){ const a = a0 + i / 6 * Math.PI / 2; pts.push([jx + 10 * Math.cos(a), jy + 10 * Math.sin(a), Z + 6]); }
    return `<path d="${pd(pts)}" fill="transparent" data-act="stick" data-dx="${dx}" data-dy="${dy}"/>`;
  }).join('');
  parts.push({ at:[jx, jy, Z], box:[[jx - 7.8, jy - 7.8, Z], [jx + 7.8, jy + 7.8, Z + 16]], svg: j + zones });
  // a token on its way into the slot
  if (st.coin != null){
    const k = st.coin;
    let cx = SLOT[0], cy, cz;
    if (k < .6){ const q = ease(k / .6); cy = STACK[1] + (SLOT[1] - STACK[1]) * q; cz = Z + Math.min(st.coins, MAX_STACK) * 1.15 + 4 + (Z + 8 - (Z + Math.min(st.coins, MAX_STACK) * 1.15 + 4)) * q + 7 * Math.sin(Math.PI * q); }
    else { cy = SLOT[1]; cz = Z + 8 - 13 * ((k - .6) / .4) ** 1.6; }
    let c = coinStanding(cx, cy, cz);
    if (cz - 2.8 < Z) c = clipTo([[SLOT[0] - 3.5, SLOT[1], Z], [SLOT[0] + 3.5, SLOT[1], Z], [SLOT[0] + 3.5, SLOT[1], Z + 30], [SLOT[0] - 3.5, SLOT[1], Z + 30]], c);
    parts.push({ at:[cx, cy, Z + 9], svg: c });
  }
  s += byDepth(parts);
  return s;
}

// a prize outside the pit (in the bay, being taken out), placed by its centre
const prizeAt = (p, x, y, zc) => MC.classic ? orb({ ...p, x, y, z: zc }) : prizeDraw({ ...p, x, y, z: zc - KINDS[p.kind].h / 2 }, null, { env:false }).svg;
function scene(st, m){
  // the claw-cam rides inside the glass box: only the pit is in front of it
  if (CLAWCAM) return glassBox(m);
  let s = '';
  s += castShadow([...on(PX(0), BASE), ...on(PX(W + LX), rectUV(1, 0, D - 1, LZ1)),
    [0,0,HR],[W,0,HR],[W,D,HR],[0,D,HR], ...on(PX(0), CREST), ...on(PX(10), CREST)]);
  // everything on the front (ledge, prizes being taken out) lies beyond the plane x = W:
  // in front of the cabinet when the front faces the viewer, hidden behind it otherwise
  let front = '';
  // prizes being taken out of the bay come toward the viewer, in front of the base
  if (st.take){
    const k = ease(Math.min(1, st.take.t));
    st.take.ps.forEach((p, i) => { const [x, y, z] = baySpot(i);
      front += `<g opacity="${f(1 - Math.max(0, (st.take.t - .55) / .45))}">${prizeAt(p, x + 22 * k, y, z + 16 * k)}</g>`; });
  }
  front += ledge(m);
  const frontVis = vis([1,0,0]);
  if (!frontVis) s += act('take', flapSvg()) + front;
  s += base(m);
  s += glassBox(m);
  s += roofTop(m);
  s += roof(m);
  // cabinet silhouette (base + glass section + roof), before the parts that stand in front of it
  s += hullInk([...on(PX(0), BASE), ...on(PX(W), BASE), [0,0,HR],[W,0,HR],[W,D,HR],[0,D,HR]], 2.8);
  if (frontVis) s += act('take', flapSvg());
  s += marquee(m);
  if (frontVis) s += front;
  return s;
}

/* ---------- saves (only gameon.claw-of-cool.*, and the game still plays if storage is blocked) ---------- */
const SAVE_KEY = 'gameon.claw-of-cool.';
const store = {
  get(k, d){ try { const v = localStorage.getItem(SAVE_KEY + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v){ try { localStorage.setItem(SAVE_KEY + k, JSON.stringify(v)); } catch (e) {} },
};
// jeremy.v1's saves: read, never written (its best score and collection count for the Classic machine)
const saved = { best: +store.get('best', 0) || 0, found: store.get('collection', {}) || {} };
if (typeof saved.found !== 'object' || Array.isArray(saved.found)) saved.found = {};
// jeremy.v2's own saves, under gameon.claw-of-cool.jeremy.v2.: best score and collection per machine, machines
// unlocked, the last machine and zoom view picked. The sound setting is shared with v1 (gameon.claw-of-cool.sound)
const V2 = 'jeremy.v2.';
const isObj = o => o && typeof o === 'object' && !Array.isArray(o);
const s2 = { best: store.get(V2 + 'best', {}), found: store.get(V2 + 'collection', {}), unlocked: +store.get(V2 + 'unlocked', 1) || 1,
  machine: +store.get(V2 + 'machine', 0) || 0, view: +store.get(V2 + 'view', 0) || 0 };
if (!isObj(s2.best)) s2.best = {};
if (!isObj(s2.found)) s2.found = {};
for (const k in s2.found) if (!isObj(s2.found[k])) s2.found[k] = {};
s2.unlocked = Math.max(1, Math.min(MACHINES.length, s2.unlocked | 0));
const bestOf = i => Math.max(i === 0 ? saved.best : 0, +s2.best[MACHINES[i].id] || 0);
const foundOf = k => (MCI === 0 && saved.found[k] ? +saved.found[k] || 1 : 0) + (+(s2.found[MC.id] || {})[k] || 0);
// start on the machine and view picked last time
setMachine(s2.machine < s2.unlocked ? s2.machine : 0);
Object.assign(st, fresh(), { pal: MC.pal, view: Math.max(0, Math.min(3, s2.view | 0)) });

/* ---------- sound: made on the spot with WebAudio, no sound files ---------- */
const SND = (() => {
  let ctx = null, out = null, soundOn = store.get('sound', 'on') !== 'off';
  const ac = () => {
    if (!soundOn) return null;
    if (!ctx){ try { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null;
      ctx = new A(); out = ctx.createGain(); out.gain.value = .45; out.connect(ctx.destination); } catch (e) { ctx = null; return null; } }
    if (ctx.state === 'suspended'){ try { const r = ctx.resume(); if (r && r.catch) r.catch(() => {}); } catch (e) {} }
    return ctx;
  };
  const blip = (f0, dur, o = {}) => { const c = ac(); if (!c) return; try {
    const t = c.currentTime + (o.at || 0), osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'square'; osc.frequency.setValueAtTime(f0, t); if (o.f1) osc.frequency.exponentialRampToValueAtTime(o.f1, t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(o.vol || .1, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    osc.connect(g); g.connect(out); osc.start(t); osc.stop(t + dur + .03); } catch (e) {} };
  const notes = (fs, step, o) => fs.forEach((fq, i) => blip(fq, o.len || step * 1.6, { ...o, at: (o.at || 0) + i * step }));
  return {
    get on(){ return soundOn; },
    toggle(){ soundOn = !soundOn; store.set('sound', soundOn ? 'on' : 'off'); if (soundOn) this.coin(); return soundOn; },
    unlock(){ ac(); },
    coin(){ blip(988, .07, { vol:.08 }); blip(1319, .16, { vol:.08, at:.07 }); },
    whir(){ blip(92, .07, { type:'sawtooth', vol:.035, f1:120 }); },
    zip(){ blip(900, .38, { type:'sine', vol:.12, f1:240 }); },
    clunk(){ blip(150, .1, { type:'triangle', vol:.22, f1:60 }); blip(70, .08, { type:'square', vol:.05, at:.02 }); },
    lift(){ blip(180, .9, { type:'sawtooth', vol:.03, f1:420 }); },
    win(t){ const base = [523, 659, 784, 1047];
      if (t >= 3){ notes([523, 659, 784, 1047, 784, 1047, 1319], .1, { type:'square', vol:.08 }); notes([1047, 1319, 1568], 0, { type:'triangle', vol:.07, at:.72, len:.9 }); }
      else notes(t >= 2 ? [...base, 1319] : base, .085, { type:'triangle', vol:.13 }); },
    slip(){ blip(420, .55, { type:'sine', vol:.12, f1:140 }); },
    miss(){ notes([220, 175], .16, { type:'triangle', vol:.12 }); },
    refill(){ notes([392, 494, 587, 698, 784, 988], .06, { type:'triangle', vol:.09 }); },
    over(){ notes([659, 523, 440, 330], .16, { type:'triangle', vol:.12, len:.3 }); },
    tap(){ blip(660, .05, { type:'triangle', vol:.07 }); },
  };
})();

/* ---------- behaviour ---------- */
// game.screen: 'title' | 'play' | 'paused' | 'over'
const game = { screen:'title', overAt:0, newBest:false };
let ui, looping = false, HOLD = false;
function kick(){
  if (HOLD || looping || game.screen !== 'play') return; looping = true;
  ui.animate(dt => { if (game.screen !== 'play' || HOLD){ looping = false; return false; } update(dt); return true; });
}
const say = (l1, l2, t = 2.4) => { st.msg = [l1, l2]; st.msgT = t; };
const popUp = (text, sub, col, big = false) => { st.pop = { text, sub, col, big, t0: st.t }; };
const clampX = x => Math.max(10, Math.min(W - 10, x)), clampY = y => Math.max(10, Math.min(D - 10, y));
const looseness = () => Math.max(.66, 1 - .12 * (st.round - 1));
const tryTime = () => Math.max(9, 17 - 2 * st.round);
// something is still moving through the machine (a coin, the claw, a prize falling or in the bay)
const busy = () => st.coin != null || st.credit > 0 || st.phase !== 'idle' || st.falls.length || st.bayIn.length || st.bay.length || st.take || st.held || st.refill;

function findSpot(x, y, r, p){
  const tz = MC.classic ? HB + r : restZ(KINDS[p.kind], false);
  const ok = (a, b) => a >= 2 + r && a <= W - 2 - r && b >= 2 + r && b <= D - 2 - r && !(a > W - 34 && b < 34)
    && st.prizes.every(q => Math.hypot(q.x - a, q.y - b) >= q.r + r - 1)
    && st.falls.every(fl => Math.hypot(fl.tx - a, fl.ty - b) >= fl.p.r + r - 1);
  for (let rad = 0; rad <= 40; rad += 2.5)
    for (let i = 0; i < 16; i++){ const a = x + rad * Math.cos(i / 16 * 2 * Math.PI), b = y + rad * Math.sin(i / 16 * 2 * Math.PI); if (ok(a, b)) return [a, b, tz, 0]; }
  return MC.classic ? [clampX(Math.min(x, W - 36)), y, HB + r + 8, 1] : [clampX(Math.min(x, W - 36)), y, tz, 0];
}
function removePrize(p){
  st.prizes = st.prizes.filter(q => q !== p);
  if (p.layer !== 0) return;
  // a prize resting on it rolls down into the gap
  const top = st.prizes.find(q => q.layer === 1 && Math.hypot(q.x - p.x, q.y - p.y) < 13);
  if (!top) return;
  st.prizes = st.prizes.filter(q => q !== top);
  st.falls.push({ p:{ ...top, layer:0 }, x:top.x, y:top.y, z:top.z, vz:0, tx:p.x, ty:p.y, tz:HB + top.r, mode:'floor', delay:.7 });
}
const overHole = (x, y) => x > CHX + 2 && y < CHY - 2;
// a prize drops into the chute: it breaks the beam, the board counts the win
function winPrize(p){
  const T = tierOf(p), tier = KINDS[p.kind].tier, pts = kindPts(p.kind);
  st.score += pts; st.coins += T.coins; st.roundWins++; st.won.push(p.kind);
  // jeremy.v2 keeps its own collection; v1's is only read
  const fm = s2.found[MC.id] = s2.found[MC.id] || {}; fm[p.kind] = (fm[p.kind] || 0) + 1; store.set(V2 + 'collection', s2.found);
  say(T.name, '+' + pts, 3);
  popUp(`+${pts} ${T.name}!`, KINDS[p.kind].name + (T.coins ? `  +${T.coins} coin${T.coins > 1 ? 's' : ''}` : ''), T.col, tier >= 2);
  SND.win(tier);
  // FIX (v1 waited until the machine was completely idle, so round 2 could come after 8 or 9 wins):
  // the 5th win of a round refills the machine straight away
  if (st.roundWins >= WINS_PER_ROUND) refill(p);
}
function dropHeld(){
  const h = st.held; if (!h) return;
  const p = h.p; st.held = null;
  if (overHole(p.x, p.y)){ st.falls.push({ p, x:p.x, y:p.y, z:p.z, vz:0, tx:p.x, ty:p.y, tz:-99, mode:'chute', delay:0 }); winPrize(p); return true; }
  const [tx, ty, tz, layer] = findSpot(p.x, p.y, p.r, p);
  p.layer = layer;
  st.falls.push({ p, x:p.x, y:p.y, z:p.z, vz:0, tx, ty, tz, mode:'floor', delay:0 });
  return false;
}
// the prize the claw would land on from where it is now (the highest one under it)
function prizeUnder(x, y){
  return st.prizes.map(p => ({ p, d: Math.hypot(p.x - x, p.y - y) })).filter(o => o.d < o.p.r + 2).sort((a, b) => (MC.classic ? b.p.z - a.p.z : pTopZ(b.p) - pTopZ(a.p)))[0] || null;
}
function startDrop(){
  const cl = st.claw;
  st.phase = 'lower'; st.pt = 0; st.step = null;
  for (const k in keys) keys[k] = false;
  const near = st.prizes.map(p => ({ p, d: Math.hypot(p.x - cl.x, p.y - cl.y) }));
  const under = prizeUnder(cl.x, cl.y);
  const side = near.filter(o => o.d < o.p.r + 4.5).sort((a, b) => b.p.z - a.p.z)[0];
  let tips = HB + 2.5;
  if (cl.x > CHX - 6 && cl.y < CHY + 6) tips = CHT + 3;           // the claw stops at the chute's rim
  else if (under) tips = under.p.z - 2.5;
  else if (side) tips = side.p.z + 3.5;
  st.drop = { stop: Math.min(ZTOP, tips + 13 - 2), c: under && tips === under.p.z - 2.5 ? under.p : null, d: under ? under.d : 99 };
  if (!MC.classic) st.drop = { stop: dropStop(cl), c: null, d: 99 };
  SND.zip();
}
// themed machines: how low the claw's hub goes from where it is now: onto the middle of the prize under it, beside
// one it would land on, the chute's rim, or the floor (the sand). Worked out every frame, since prizes can move
function dropStop(cl){
  const floor = (MC.sand != null ? MC.sand : HB) + 2.5;
  let tips = floor;
  if (cl.x > CHX - 6 && cl.y < CHY + 6) tips = CHT + 3;
  else {
    const under = prizeUnder(cl.x, cl.y);
    const side = st.prizes.map(p => ({ p, d: Math.hypot(p.x - cl.x, p.y - cl.y) })).filter(o => o.d < o.p.r + 4.5).sort((a, b) => pTopZ(b.p) - pTopZ(a.p))[0];
    if (under) tips = Math.max(floor, pMidZ(under.p) - 2.5);
    else if (side) tips = Math.max(floor, pTopZ(side.p) + 1);
  }
  return Math.min(ZTOP, tips + 11);
}

function update(dt){
  st.t += dt;
  if (st.btn > 0) st.btn -= dt;
  if (st.msgT > 0) st.msgT -= dt;
  if (st.tiltHold > 0) st.tiltHold -= dt;
  const cl = st.claw, dr = st.drop, cx0 = cl.x, cy0 = cl.y;

  // coin into the slot -> one credit -> the try starts
  if (st.coin != null){ st.coin += dt / .75; if (st.coin >= 1){ st.coin = null; st.credit++; } }
  if (st.phase === 'idle' && st.credit > 0 && st.coin == null){ st.phase = 'ready'; st.pt = 0; }

  // joystick: buttons push it for a moment, arrow keys hold it
  let dir = [0, 0];
  const kx = (keys.ArrowDown ? 1 : 0) - (keys.ArrowUp ? 1 : 0), ky = (keys.ArrowLeft ? 1 : 0) - (keys.ArrowRight ? 1 : 0);
  if (st.step) dir = st.step.dir; else if (kx || ky) dir = [kx, ky]; else if (st.tiltHold > 0) dir = st.tiltDir;
  const lk = Math.min(1, dt * 16);
  st.tilt = [st.tilt[0] + (dir[0] - st.tilt[0]) * lk, st.tilt[1] + (dir[1] - st.tilt[1]) * lk];
  if (!(dir[0] || dir[1]) && Math.abs(st.tilt[0]) + Math.abs(st.tilt[1]) < .01) st.tilt = [0, 0];

  st.pt += dt;
  switch (st.phase){
    case 'ready':
      if (st.pt >= .9){ st.credit--; st.phase = 'play'; st.pt = 0; st.time = tryTime(); }
      break;
    case 'play': {
      if (st.step){
        const mv = Math.min(st.step.rem, SPEED * (MC.speed || 1) * dt);
        cl.x = clampX(cl.x + st.step.dir[0] * mv); cl.y = clampY(cl.y + st.step.dir[1] * mv);
        st.step.rem -= mv; if (st.step.rem <= 1e-6) st.step = null;
      } else if (kx || ky){
        const n = Math.hypot(kx, ky);
        cl.x = clampX(cl.x + kx / n * SPEED * (MC.speed || 1) * dt); cl.y = clampY(cl.y + ky / n * SPEED * (MC.speed || 1) * dt);
      }
      st.time -= dt;
      if (st.time <= 0){ st.time = 0; startDrop(); }
      break;
    }
    case 'lower':
      cl.o = Math.min(1, st.pt / .35);
      if (!MC.classic) dr.stop = dropStop(cl);
      if (cl.z > dr.stop) cl.z = Math.max(dr.stop, cl.z - 42 * (MC.lower || 1) * dt);
      if (cl.z <= dr.stop + 1e-6 && st.pt > .35){
        st.phase = 'close'; st.pt = 0; SND.clunk();
        if (!MC.classic && !(cl.x > CHX - 6 && cl.y < CHY + 6)){ const u = prizeUnder(cl.x, cl.y); dr.c = u ? u.p : null; dr.d = u ? u.d : 99; }
        const p = dr.c;
        if (p && dr.d < p.r + 2){
          // the grip: centred holds, off-centre slips. Cooler prizes are smaller and slipperier, the claw looser each round,
          // and even a good grip on a rare prize can wobble loose on the way. Themed machines: odd shapes (long, flat,
          // rings) grip worse and slip more, a buried prize has to be pulled free, and the legendary one is slipperiest
          const T = tierOf(p), K = KINDS[p.kind], sh = kindShape(p.kind);
          const grip = MC.classic ? T.grip : sh.grip * (K.tier === 3 ? .88 : 1) * (p.buried ? .9 : 1);
          const slip = MC.classic ? T.slip : sh.slip + (K.tier === 3 ? .1 : 0);
          const holdR = 4.5 * grip * looseness(), edge = p.r + 2;
          p.caught = true;
          dr.grip = dr.d < holdR ? 'hold' : 'slip';
          if (dr.grip === 'hold' && crand() < slip * (.5 + dr.d / holdR)){ dr.grip = 'slip'; dr.late = true; }
          // the fingers close on the prize's edge (a themed prize says how wide it is where the claw grips it)
          dr.oEnd = MC.classic ? Math.max(0, (p.r * (dr.grip === 'hold' || dr.late ? .72 : .98) - 1.5) / 8.5)
            : Math.max(0, Math.min(1, (K.gr * (dr.grip === 'hold' || dr.late ? .95 : 1.1) - 1.5) / 8.5));
          dr.px = p.x; dr.py = p.y;
          dr.holdR = holdR; dr.edge = edge;
        }
        else { dr.grip = 'miss'; dr.oEnd = 0; }
      }
      break;
    case 'close': {
      const k = Math.min(1, st.pt / .5);
      cl.o = 1 + (dr.oEnd - 1) * ease(k);
      if (dr.grip === 'hold' || dr.late){ const p = dr.c; p.x = dr.px + (cl.x - dr.px) * .7 * ease(k); p.y = dr.py + (cl.y - dr.py) * .7 * ease(k); }
      if (k >= 1){
        if (dr.grip !== 'miss'){
          const p = dr.c; removePrize(p);
          st.held = { p, ox: p.x - cl.x, oy: p.y - cl.y, oz: p.z - cl.z };
          dr.slipT = dr.grip === 'hold' ? 1e9 : dr.late ? 1.4 + crand() * 1.8
            : .35 + 2.4 * Math.max(0, Math.min(1, (dr.edge - dr.d) / Math.max(.5, dr.edge - dr.holdR)));
        }
        st.phase = 'lift'; st.pt = 0; dr.z0 = cl.z; SND.lift();
      }
      break;
    }
    case 'lift': case 'carry': {
      if (st.phase === 'lift'){
        const k = Math.min(1, st.pt / (1.1 / (MC.speed || 1))); cl.z = dr.z0 + (ZTOP - dr.z0) * ease(k);
        if (k >= 1){ st.phase = 'carry'; st.pt = 0; dr.x0 = cl.x; dr.y0 = cl.y; dr.dur = Math.max(.5, Math.hypot(HOME[0] - cl.x, HOME[1] - cl.y) / (32 * (MC.speed || 1))); }
      } else {
        const k = Math.min(1, st.pt / dr.dur), q = ease(k);
        cl.x = dr.x0 + (HOME[0] - dr.x0) * q; cl.y = dr.y0 + (HOME[1] - dr.y0) * q;
        if (k >= 1){ st.phase = 'release'; st.pt = 0; dr.o0 = cl.o; }
      }
      if (st.held){
        const h = st.held, wob = dr.grip === 'slip' ? Math.sin(st.t * 18) * (dr.late ? .9 : .6) : 0;
        h.p.x = cl.x + h.ox + wob; h.p.y = cl.y + h.oy; h.p.z = cl.z + h.oz;
        dr.slipT -= dt;
        if (dr.slipT <= 0){ if (!dropHeld()){ say('SO', 'CLOSE', 2.4); popUp('So close!', 'It slipped out of the claw', '#e2483d'); SND.slip(); } dr.slipped = true; }
      }
      break;
    }
    case 'release': {
      if (st.held && st.pt > .05) dropHeld();
      const k = Math.min(1, st.pt / .4); cl.o = dr.o0 + (1 - dr.o0) * ease(k);
      if (k >= 1){ st.phase = 'back'; st.pt = 0; }
      break;
    }
    case 'back': {
      const k = Math.min(1, st.pt / .45); cl.o = 1 - ease(k);
      if (k >= 1){
        cl.o = 0; st.phase = 'idle'; st.pt = 0;
        if (dr.grip === 'miss'){ say('TRY', 'AGAIN', 2); popUp('Missed!', 'Line the claw up over a prize', '#857d6e'); SND.miss(); }
        st.drop = null;
      }
      break;
    }
  }
  // the gantry whirs while the claw moves
  st.whirD += Math.hypot(cl.x - cx0, cl.y - cy0);
  if (st.whirD > 3.2){ st.whirD = 0; SND.whir(); }

  // falling prizes
  for (const fl of st.falls.slice()){
    if (fl.delay > 0){ fl.delay -= dt; continue; }
    fl.vz += (fl.mode === 'floor' ? MC.fall || 300 : 300) * dt; fl.z -= fl.vz * dt;
    const lk2 = Math.min(1, dt * 7); fl.x += (fl.tx - fl.x) * lk2; fl.y += (fl.ty - fl.y) * lk2;
    if (fl.mode === 'floor' && fl.z <= fl.tz){
      fl.z = fl.tz;
      if (fl.vz > 70){ fl.vz = -fl.vz * .3; continue; }
      st.falls.splice(st.falls.indexOf(fl), 1);
      const q = { ...fl.p, x:fl.tx, y:fl.ty, z:fl.tz, caught:false };
      if (!MC.classic){ q.hx = q.x; q.hy = q.y; q.bz = q.z; q.buried = false; }
      st.prizes.push(q);
    }
    const ph = MC.classic ? fl.p.r : KINDS[fl.p.kind].h;
    if (fl.mode === 'chute' && fl.z + (MC.classic ? 0 : ph) < HB - (MC.classic ? fl.p.r : 0) - 3){
      st.falls.splice(st.falls.indexOf(fl), 1);
      const i = st.bay.length + st.bayIn.length, [sx, sy, sz] = baySpot(i);
      st.bayIn.push({ p:fl.p, t:-.35, x:BAY_X + 2, y:sy, z:BAY[3] + (MC.classic ? fl.p.r : ph / 2) + 2, sx, sy, sz, vz:0 });
    }
  }
  if (st.refill && !st.falls.length) st.refill = false;
  // prizes coming out of the chute into the bay
  for (const b of st.bayIn.slice()){
    b.t += dt; if (b.t < 0) continue;
    b.vz += 300 * dt; b.z -= b.vz * dt; b.x += (b.sx - b.x) * Math.min(1, dt * 5);
    if (b.z <= b.sz){ b.z = b.sz; if (b.vz > 60){ b.vz = -b.vz * .3; } else if (Math.abs(b.x - b.sx) < .3){ st.bayIn.splice(st.bayIn.indexOf(b), 1); st.bay.push(b.p); } }
  }
  // the prize waits a moment in the bay, then the flap tips open and it goes on the shelf
  st.bayRest = st.bay.length && !st.bayIn.length && !st.take ? st.bayRest + dt : 0;
  if (st.bayRest > .7) takePrize(true);
  if (st.flap !== st.flapT){ const g = Math.sign(st.flapT - st.flap); st.flap = Math.max(0, Math.min(1, st.flap + g * dt / .35)); }
  if (st.take && st.flap >= 1){
    st.take.t += dt / .7;
    if (st.take.t >= 1){ st.bay = []; st.take = null; st.flapT = 0; }
  }

  // between tries: out of coins ends the game; five wins (or a nearly empty machine) refill it for the next round
  if (!busy()){
    if (!st.coins){ st.endT += dt; if (st.endT > 1.2) gameOver(); }
    else if (st.prizes.length < 8) refill();
  } else st.endT = 0;

  // themed machines: prizes bob and drift in the water, or hover in low gravity
  if (MC.float) for (const p of st.prizes){
    if (p.caught) continue;
    const t = st.t + p.ph * 3;
    if (MC.float === 'bob'){ p.x = p.hx + 1.3 * Math.sin(t * .7); p.y = p.hy + 1.3 * Math.cos(t * .53); p.z = p.bz + (KINDS[p.kind].floats ? .8 * Math.sin(t * 1.7) : .6 + .6 * Math.sin(t * 1.3)); }
    else { p.x = p.hx + 1.2 * Math.sin(t * .4); p.y = p.hy + 1.2 * Math.cos(t * .33); p.z = p.bz + 1 + 5 * (1 + Math.sin(t * .6)); p.rot = (p.rot || 0) + dt * .12; }
  }
  // the camera: zoomed in on the pit from when the coin lands until the claw is home (or the round ends)
  const inTry = !st.refill && (st.phase === 'ready' || st.phase === 'play' || DROP_PH.includes(st.phase));
  if (inTry && st.zoom < 1) st.zoom = Math.min(1, st.zoom + dt / ZOOM_IN);
  else if (!inTry && st.zoom > 0) st.zoom = Math.max(0, st.zoom - dt / ZOOM_OUT);
  if (st.vblend < 1) st.vblend = Math.min(1, st.vblend + dt / .5);
}
const ZOOM_IN = .8, ZOOM_OUT = .7;

function refill(won){
  st.round++; st.roundWins = 0; st.refill = true;
  const ps = layout(st.round);
  st.prizes = [];
  // the prize just won keeps falling down the chute; the new prizes rain in from the top
  st.falls = st.falls.filter(fl => fl.mode === 'chute').concat(ps.map((p, i) => ({ p, x:p.x, y:p.y, z:p.z + 70, vz:0, tx:p.x, ty:p.y, tz:p.z, mode:'floor', delay:(p.layer ? .9 : 0) + i * .025 })));
  // reaching round 2 unlocks the next machine
  let news = 'Cooler prizes, looser claw';
  if (st.round === 2 && MCI + 1 < MACHINES.length && s2.unlocked < MCI + 2){ s2.unlocked = MCI + 2; store.set(V2 + 'unlocked', s2.unlocked); news = MACHINES[MCI + 1].name + ' unlocked!'; st.unlockedNow = MCI + 1; }
  say('ROUND', String(st.round), 3);
  popUp(`Round ${st.round}!`, (won ? `+${kindPts(won.kind)} ${KINDS[won.kind].name} · ` : '') + news, '#5a82c6', true);
  SND.refill();
}

/* ---------- controls ---------- */
function insertCoin(){
  if (game.screen !== 'play') return;
  if (st.refill) return ui.flash('Refilling the machine...');
  if (DROP_PH.includes(st.phase)) return ui.flash('The claw is busy - wait for it to come back');
  if (st.coin != null || st.credit > 0 || st.phase !== 'idle') return ui.flash('One try at a time');
  if (!st.coins) return ui.flash('Out of coins!');
  st.coins--; st.coin = 0; SND.coin(); kick();
}
function move(dx, dy){
  st.tiltDir = [dx, dy]; st.tiltHold = .22; kick();
  if (st.phase !== 'play'){
    if (st.phase === 'idle' && !st.coin && !st.credit && st.coins) return ui.flash('Press DROP to put in a coin');
    return;
  }
  const cl = st.claw, nx = clampX(cl.x + dx * STEP), ny = clampY(cl.y + dy * STEP);
  if (Math.abs(nx - cl.x) + Math.abs(ny - cl.y) < .01 && !st.step) return ui.flash('The claw is at the edge');
  if (st.step && st.step.dir[0] === dx && st.step.dir[1] === dy) st.step.rem += STEP; else st.step = { dir:[dx, dy], rem:STEP };
}
function drop(){
  st.btn = .22; kick();
  if (st.phase === 'play') return startDrop();
  if (DROP_PH.includes(st.phase)) return ui.flash('The claw is already on its way');
  if (st.phase === 'idle' && st.coin == null && !st.credit) return insertCoin();
}
function takePrize(auto){
  if (st.take) return;
  if (!st.bay.length){
    if (auto) return;
    if (st.bayIn.length || st.falls.some(fl => fl.mode === 'chute') || (st.held && st.drop && st.drop.grip === 'hold'))
      return ui.flash('Wait - it is still on its way down');
    return ui.flash('The prize flap is empty');
  }
  st.take = { t:0, ps: st.bay.slice() }; st.flapT = 1; kick();
}

/* ---------- screens: title, play, pause, game over ---------- */
const $ = id => document.getElementById(id);
function showScreen(name){
  for (const id of ['title', 'pause', 'over']) $(id).classList.toggle('show', id === name);
  document.documentElement.classList.toggle('overlay', !!name);
  const b = name && $(name).querySelector('.big'); if (b) try { b.focus({ preventScroll:true }); } catch (e) {}
}
function startGame(i){
  SND.unlock();
  if (i != null && i !== MCI){ if (i >= s2.unlocked) return; setMachine(i); buildShelf(); store.set(V2 + 'machine', MCI); }
  const keep = { pal: MC.pal, xr: st.xr, xrT: st.xrT, view: st.view };
  Object.assign(st, fresh(), keep);
  for (const k in keys) keys[k] = false;
  game.screen = 'play'; game.newBest = false; showScreen(null);
  popUp('Go!', 'Press DROP to put in a coin', '#5a82c6');
  ui.render(); kick();
}
function pauseGame(){
  if (game.screen !== 'play') return;
  game.screen = 'paused'; for (const k in keys) keys[k] = false;
  showScreen('pause'); ui.render();
}
function resumeGame(){
  if (game.screen !== 'paused') return;
  game.screen = 'play'; showScreen(null); ui.render(); kick();
}
function toTitle(){
  game.screen = 'title';
  const keep = { pal: MC.pal, xr: st.xr, xrT: st.xrT, view: st.view };
  Object.assign(st, fresh(), keep);
  showScreen('title'); ui.render();
}
function gameOver(){
  game.screen = 'over'; game.overAt = performance.now();
  game.newBest = st.score > bestOf(MCI);
  if (game.newBest){ s2.best[MC.id] = st.score; store.set(V2 + 'best', s2.best); }
  SND.over(); showScreen('over'); ui.render();
}
function toggleSound(){ SND.toggle(); ui.render(); }
// the machine picker on the title screen: a locked machine says how to unlock it
function pickMachine(i){
  if (i < 0 || i >= MACHINES.length) return;
  if (i >= s2.unlocked) return ui.flash(`Win 5 prizes on ${MACHINES[i - 1].name} to unlock ${MACHINES[i].name}`);
  if (i !== MCI){ setMachine(i); store.set(V2 + 'machine', MCI); buildShelf();
    const keep = { pal: MC.pal, xr: st.xr, xrT: st.xrT, view: st.view }; Object.assign(st, fresh(), keep); }
  SND.tap(); ui.render();
}
// the zoom views: the View button or V cycles them; a try in progress turns the camera to the new one
const VIEWS = [
  { id:'top',   name:'Top-down', yaw:0,  pitch:82 },
  { id:'front', name:'Front',    yaw:0,  pitch:9 },
  { id:'claw',  name:'Claw-cam', yaw:0,  pitch:90 },
  { id:'side',  name:'Side',     yaw:90, pitch:9 },
];
function cycleView(){
  if (game.screen !== 'play') return;
  st.vprev = st.view; st.view = (st.view + 1) % VIEWS.length; st.vblend = st.zoom > 0 ? 0 : 1;
  store.set(V2 + 'view', st.view);
  if (st.zoom <= 0) ui.flash(`${VIEWS[st.view].name} view: you'll see it after the next coin`);
  SND.tap(); kick(); ui.render();
}

window.GAME_KEYS = true;   // the arrows and space play the game; they don't turn the camera here
const KEYDIR = { ArrowLeft:[0,1], ArrowRight:[0,-1], ArrowUp:[-1,0], ArrowDown:[1,0] };
const KEYALIAS = { a:'ArrowLeft', A:'ArrowLeft', d:'ArrowRight', D:'ArrowRight', w:'ArrowUp', W:'ArrowUp', s:'ArrowDown', S:'ArrowDown' };
const onButton = e => e.target && e.target.closest && e.target.closest('button');
addEventListener('keydown', e => {
  const key = KEYALIAS[e.key] || e.key, go = e.key === ' ' || e.key === 'Enter';
  if (/input|textarea/i.test(e.target.tagName || '')) return;
  if (game.screen === 'title'){
    if (go && !(e.key === 'Enter' && onButton(e))){ e.preventDefault(); if (!e.repeat) startGame(); return; }
    // left and right pick a machine
    if ((key === 'ArrowLeft' || key === 'ArrowRight') && !e.repeat){ e.preventDefault(); const d = key === 'ArrowRight' ? 1 : -1;
      let i = MCI + d; if (i >= s2.unlocked) i = 0; if (i < 0) i = s2.unlocked - 1; pickMachine(i); }
    return; }
  if (game.screen === 'over'){ if (go && !(e.key === 'Enter' && onButton(e))){ e.preventDefault(); if (!e.repeat && performance.now() - game.overAt > 700) startGame(); } return; }
  if (game.screen === 'paused'){ if (e.key === 'p' || e.key === 'P' || e.key === 'Escape'){ e.preventDefault(); resumeGame(); } return; }
  if (e.key === 'p' || e.key === 'P' || e.key === 'Escape'){ e.preventDefault(); pauseGame(); return; }
  if (e.key === 'm' || e.key === 'M'){ toggleSound(); return; }
  if (e.key === 'v' || e.key === 'V'){ if (!e.repeat) cycleView(); return; }
  if (KEYDIR[key]){ e.preventDefault(); if (e.repeat) return;
    if (st.phase !== 'play'){ move(...KEYDIR[key]); ui.render(); return; }
    // a tap nudges the claw one step; holding the key keeps it moving after that
    move(...KEYDIR[key]); keys[key] = true; kick(); ui.render(); return; }
  // space always drops, even right after a button was clicked (that button keeps the focus); Enter still presses buttons
  if (e.key === ' ' || (e.key === 'Enter' && !onButton(e))){ e.preventDefault(); if (!e.repeat){ drop(); ui.render(); } }
});
addEventListener('keyup', e => { const key = KEYALIAS[e.key] || e.key; if (KEYDIR[key]) keys[key] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });



/* ---------- see-through: how a real claw machine works ----------
   Parts (each sits on another part; cables run from a real port to a real port):
   GANTRY  two rails on brackets under the roof . end stop . bridge beam on two end trucks with hangers .
           X gearmotor at the back end of the right rail, its pulley, the toothed belt along the rail and the
           clamp that ties the belt to the bridge . a rack along the bridge . trolley under the bridge .
           Y gearmotor on the trolley with its pinion on the rack . winch drum with its cheek and coaxial gearmotor .
           the string down to the claw . the coiled cord that feeds the claw's coil
   CLAW    fingers . hub with the solenoid coil inside . plunger
   PRIZES  chute shaft below the hole (back, side and front walls) . deflector into the pickup bay .
           infrared emitter and receiver on the shaft walls, and the beam between them
   COINS   coin acceptor under the slot . coin tube . cash box behind the coin door . coin meter
   POWER   main board on the back wall (chips, connectors, test button, standoff screws, status LED) .
           power supply on the floor (vents, fan) . speaker . LED strip under the roof
   CONTROL joystick plate with its shaft and four microswitches . drop-button microswitch
   HARNESS board to gantry (up the back corner, along the roof), festoon to the bridge and trolley,
           board to controls and acceptor, power supply to board, chute sensor and speaker to board */
const COPPER = { l:'#f0b07a', m:'#d08a52', d:'#9a5a2c' }, PCB = { l:'#4fa36a', m:'#2f8a4a', d:'#1d5f31' };

<script>(() => { // at phone width the zoom buttons sit in their own row under the keypad, not on the machine, so they have room
  const chip = document.querySelector(".zchip"), wrap = document.querySelector(".zwrap"); if (!chip || !wrap) return;
  const place = () => { const kp = document.querySelector(".kpad"), phone = innerWidth <= 560 && kp && kp.parentNode !== wrap;
    chip.classList.toggle("below", !!phone);
    if (phone){ if (chip.previousElementSibling !== kp) kp.after(chip); } else if (chip.parentNode !== wrap) wrap.appendChild(chip); };
  requestAnimationFrame(() => requestAnimationFrame(place)); addEventListener("resize", place); })();</script>
