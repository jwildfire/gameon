<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#183f3d">
  <meta name="description" content="A little maze. A pocketful of shapes. Some very cute monsters. Collect every shape and find your way home.">
  <title>MazeAThon · GameOn</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="world.js" defer></script>
  <script src="game.js" defer></script>
</head>
<body>
<main class="shell">
  <header class="masthead">
    <a class="brand" href="../../" aria-label="Back to GameOn">Maze<span>AThon</span><small>GAME 07 / GAMEON</small></a>
    <span class="motto">A little lost. A lot of adventure.</span>
    <nav class="tools" aria-label="Game controls">
      <button id="sound" class="icon-button" aria-label="Turn sound on" aria-pressed="false" title="Sound">♪<span class="sound-slash">/</span></button>
      <button id="help" class="icon-button" aria-label="How to play" title="How to play">?</button>
      <button id="pause" class="icon-button" aria-label="Pause game" title="Pause (P or Escape)" disabled>Ⅱ</button>
    </nav>
  </header>
  <section class="hud" aria-label="Adventure progress">
    <div class="section-label"><span id="chapter">YOUR NEXT LITTLE ADVENTURE</span><h1 id="section-name">Find your way home.</h1></div>
    <div id="inventory" class="inventory" aria-label="Shape keys collected"></div>
    <div class="run-stats"><span id="total-count">0 / 12 shapes</span><span class="clock"><span aria-hidden="true">◷</span> <span id="timer">0:00</span></span></div>
  </section>
  <section class="stage" aria-label="Maze game">
    <canvas id="maze" tabindex="0" aria-label="MazeAThon maze. Move with arrow keys or W A S D. Collect shapes, open matching boost rooms, and reach the exit. Press M for your map, H for a hint, and P to pause."></canvas>
    <div class="stage-caption" id="objective"><span class="live-dot"></span><span id="objective-text">Collect the shapes. Find the exit.</span></div>
    <div id="active-boosts" class="active-boosts" aria-label="Active boosts"></div>
    <button class="minimap-button" id="mini-button" aria-label="Open explored map" title="Map (M)"><canvas id="mini" width="155" height="125" aria-hidden="true"></canvas><span>YOUR MAP <kbd>M</kbd></span></button>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <div id="dialog" class="dialog"></div>
    </div>
  </section>
  <footer class="bottom-bar">
    <div class="keyboard-tip"><span class="key-cluster">↑<br>← ↓ →</span><span><b>Wander a little.</b><small>Arrow keys or WASD to move</small></span></div>
    <div class="dpad" role="group" aria-label="Touch movement controls">
      <button data-dir="up" aria-label="Move up">↑</button>
      <button data-dir="left" aria-label="Move left">←</button>
      <span aria-hidden="true">✦</span>
      <button data-dir="right" aria-label="Move right">→</button>
      <button data-dir="down" aria-label="Move down">↓</button>
    </div>
    <p id="trail-note" class="trail-note">Three mazes. Twelve shapes. One way home.</p>
    <div class="utility"><button id="hint" class="text-button" disabled><span aria-hidden="true">✧</span> Hint <kbd>H</kbd></button><button id="map" class="text-button" disabled><span aria-hidden="true">▧</span> Map <kbd>M</kbd></button></div>
  </footer>
</main>
<noscript>This game needs JavaScript. Enable it, then reload to start your adventure.</noscript>
</body>
</html>
